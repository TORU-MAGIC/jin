function syncAlivePresence() {
  const byName = new Map((O.players || []).map(p => [p.name, p]));
  if (!Array.isArray(O.alive)) return;
  O.alive = O.alive.map(p => {
    const src = byName.get(p.name);
    if (!src) return p;
    return {
      ...p,
      disconnected: !!src.disconnected,
      disconnectedAt: src.disconnectedAt || p.disconnectedAt || null,
      avatarIndex: p.avatarIndex ?? src.avatarIndex,
      avatarLabel: p.avatarLabel ?? src.avatarLabel,
      isCpu: p.isCpu ?? src.isCpu
    };
  });
  if (!isOnlinePlayerAlive()) {
    O.isMyDiscTurn = false;
    O.tplStep = null;
    O.tplTarget = null;
    O.voteReadyPending = false;
  }
}

function isOnlinePlayerAlive(name=O.playerName) {
  return (O.alive || []).some(p => (p.name || p) === name);
}

function canCurrentPlayerDiscuss() {
  return O.phase === 'discuss' && isOnlinePlayerAlive();
}

function activeHumanCount() {
  return (O.alive || []).filter(p => !p.isCpu && !isP2PDisconnected(p)).length;
}

function p2pActionLocked() {
  return mode === 'p2p' && !O.isHost && !!O.p2pConnClosedAt;
}

function pushP2PEvent(reason, detail='') {
  if (typeof O === 'undefined' || typeof mode === 'undefined' || mode !== 'p2p') return;
  if (!O.p2pEventLog) O.p2pEventLog = [];
  O.p2pEventLog.unshift({
    at: Date.now(),
    reason: reason || '',
    detail: detail || '',
    phase: O.phase || '',
    seq: O.p2pSyncSeq || 0
  });
  O.p2pEventLog = O.p2pEventLog.slice(0, 8);
}

function p2pAgeLabel(age) {
  if (age === null || age === undefined || !isFinite(Number(age))) return '-';
  const sec = Math.max(0, Math.round(Number(age) / 1000));
  return sec < 60 ? `${sec}秒前` : `${Math.floor(sec/60)}分${sec%60}秒前`;
}

function renderP2PDiagnosticDetails(diag={}, heartbeatAge=null) {
  if (mode !== 'p2p') return '';
  const peers = (diag.peerAges || []).map(peer => {
    const ageSec = peer.age === null || peer.age === undefined ? null : Math.max(0, Math.round(Number(peer.age)));
    const status = ageSec === null ? 'bad' : ageSec > 25 ? 'bad' : ageSec > 12 ? 'warn' : '';
    const lagValue = Number(peer.lag ?? peer.seqLag ?? 0);
    const lag = lagValue ? `<span class="${lagValue > 2 ? 'bad' : 'warn'}">seq -${lagValue}</span>` : '<span>seq OK</span>';
    const name = peer.name || peer.id || 'unknown';
    return `<div class="p2p-peer-row">
      <span>${esc(name)}</span>
      <span class="${status}">${ageSec === null ? '-' : `${ageSec}秒前`}</span>
      ${lag}
    </div>`;
  }).join('');
  const guestHost = !O.isHost
    ? `<div class="p2p-peer-row">
        <span>ホスト心拍</span>
        <span class="${heartbeatAge !== null && heartbeatAge > 25 ? 'bad' : heartbeatAge !== null && heartbeatAge > 12 ? 'warn' : ''}">${heartbeatAge === null ? '-' : `${heartbeatAge}秒前`}</span>
        <span>${esc(O.p2pHostPhase || '-')}</span>
      </div>`
    : '';
  const peerBlock = (peers || guestHost)
    ? `<div class="p2p-peer-list">${guestHost}${peers}</div>`
    : `<div class="p2p-event-row">接続相手の診断データはまだありません。</div>`;
  const events = (O.p2pEventLog || []).map(ev => {
    const label = p2pReasonLabel(ev.reason) || ev.reason || 'event';
    const detail = ev.detail ? ` / ${ev.detail}` : '';
    const elapsed = ev.at ? p2pAgeLabel(Date.now() - ev.at) : '-';
    return `<div class="p2p-event-row">${elapsed} #${ev.seq || 0} ${esc(label)}${esc(detail)} <span style="color:#64748b;">${esc(ev.phase || '')}</span></div>`;
  }).join('') || `<div class="p2p-event-row">直近の再同期イベントはありません。</div>`;
  return `<details class="p2p-detail-box">
    <summary>診断詳細を開く</summary>
    ${peerBlock}
    <div class="p2p-event-log">${events}</div>
  </details>`;
}

function p2pActionTag(name, state='pending', note='') {
  return `<span class="p2p-action-tag ${state}">${esc(name)}${note ? ` ${esc(note)}` : ''}</span>`;
}

function renderP2PActionReceiptPanel(diag={}) {
  if (mode !== 'p2p') return '';
  const ap = diag.actionProgress || {};
  let title = '';
  let text = '';
  let tags = '';
  if (O.isHost) {
    if (O.phase === 'vote' && ap.vote) {
      const total = ap.vote.total || 0;
      const done = ap.vote.doneNames || [];
      const pending = ap.vote.pendingNames || [];
      title = '投票受理状況';
      text = `ホスト受信 ${done.length}/${total}。投票が止まる場合は未受理の名前を確認してください。`;
      tags = [
        ...done.map(n => p2pActionTag(n, 'done', ap.vote.autoNames?.includes(n) ? '自動' : '受理')),
        ...pending.map(n => p2pActionTag(n, 'pending', '未受理'))
      ].join('');
    } else if (O.phase === 'night' && ap.night) {
      const done = ap.night.doneNames || [];
      const pending = ap.night.pendingNames || [];
      title = '夜行動受理状況';
      text = `ホスト受信 ${done.length}/${ap.night.total || 0}。未受理が残ると夜が明けません。`;
      tags = [
        ...done.map(n => p2pActionTag(n, 'done', '完了')),
        ...pending.map(n => p2pActionTag(n, 'pending', '待ち'))
      ].join('');
    } else if (O.phase === 'wolf_chat' && ap.wolfChat) {
      const ready = ap.wolfChat.readyNames || [];
      const pending = ap.wolfChat.pendingNames || [];
      title = '人狼相談の準備状況';
      text = `人狼の準備 ${ready.length}/${ap.wolfChat.total || 0}。全員完了で夜行動へ進みます。`;
      tags = [
        ...ready.map(n => p2pActionTag(n, 'done', '完了')),
        ...pending.map(n => p2pActionTag(n, 'pending', '相談中'))
      ].join('');
    } else if (O.phase === 'discuss' && ap.discuss) {
      const ready = ap.discuss.readyNames || [];
      const pending = ap.discuss.pendingNames || [];
      title = '今すぐ投票の準備状況';
      text = `準備 ${ready.length}/${ap.discuss.total || 0}。全員が押すと投票へ移ります。`;
      tags = [
        ...ready.map(n => p2pActionTag(n, 'done', 'OK')),
        ...pending.map(n => p2pActionTag(n, 'pending', '待ち'))
      ].join('');
    }
  } else if (O.phase === 'vote') {
    const waiting = !!O.voteSubmitted && !O.voteAckAt;
    title = '自分の投票送信';
    text = O.voteAckAt
      ? `ホスト受理済みです。投票先: ${O.voteSentTarget || O.voteTarget || '不明'}`
      : waiting
        ? `送信済み、ホストの受理確認待ちです。${O.voteAckRetryCount ? `再送 ${O.voteAckRetryCount}回。` : ''}`
        : 'まだ投票していません。';
    tags = O.voteAckAt
      ? p2pActionTag('受理済み', 'done')
      : waiting
        ? p2pActionTag('ACK待ち', O.voteAckWarningAt ? 'bad' : 'pending')
        : p2pActionTag('未送信', 'pending');
  } else if (O.phase === 'night') {
    title = '自分の夜行動送信';
    const actionName = O.nightActionNeeded?.action || '行動なし';
    text = O.nightActionDone
      ? 'ホストに夜行動が受理されました。'
      : O.nightActionPending
        ? '夜行動を送信済みです。ホストの受理確認を待っています。'
        : `現在の行動: ${actionName}`;
    tags = O.nightActionDone
      ? p2pActionTag('受理済み', 'done')
      : O.nightActionPending
        ? p2pActionTag('ACK待ち', 'pending')
        : p2pActionTag(actionName, 'pending');
  } else if (O.phase === 'wolf_chat') {
    title = '自分の人狼相談';
    text = O.wolfChatReady
      ? 'ホストに準備完了が受理されました。'
      : O.wolfChatReadyPending
        ? '準備完了を送信済みです。ホストの受理確認を待っています。'
        : '相談中です。準備できたら完了を押してください。';
    tags = O.wolfChatReady
      ? p2pActionTag('受理済み', 'done')
      : O.wolfChatReadyPending
        ? p2pActionTag('ACK待ち', 'pending')
        : p2pActionTag('相談中', 'pending');
  } else if (O.phase === 'discuss') {
    const ready = O.voteReadyNames.includes(O.playerName);
    title = '自分の今すぐ投票';
    text = O.voteReadyAll
      ? '全員の準備が揃いました。投票へ移ります。'
      : ready
        ? 'ホストに今すぐ投票の準備が受理されました。'
        : O.voteReadyPending
          ? '今すぐ投票を送信済みです。ホストの受理確認を待っています。'
          : '議論を切り上げたい時は今すぐ投票を押してください。';
    tags = O.voteReadyAll
      ? p2pActionTag('全員準備完了', 'done')
      : ready
        ? p2pActionTag('受理済み', 'done')
        : O.voteReadyPending
          ? p2pActionTag('ACK待ち', 'pending')
          : p2pActionTag('未送信', 'pending');
  }
  if (!title) return '';
  return `<div class="p2p-action-receipt">
    <div class="p2p-action-receipt-title"><span>${title}</span><span>${esc(O.isHost ? 'host' : 'guest')}</span></div>
    <p class="p2p-action-receipt-text">${esc(text)}</p>
    ${tags ? `<div class="p2p-action-tags">${tags}</div>` : ''}
  </div>`;
}

function renderP2PActionBlockedNotice() {
  if (!p2pActionLocked()) return '';
  const reason = p2pReasonLabel(O.p2pAutoResyncReason);
  return `<div class="p2p-action-lock" role="alert">

  const heartbeatText = O.isHost

function renderVoteTimeline(votes={}, reasons={}, preVotes={}) {
  const entries = Object.entries(votes || {});
  if (!entries.length) return '';
  return `<div class="power-panel">
    <div class="power-head"><span>🗳️ 投票タイムライン</span><span style="color:#64748b;font-size:.72rem;">仮投票から最終票まで</span></div>
    <div class="vote-timeline">
      ${entries.map(([voter,target]) => {
        const reason = reasons?.[voter] ? `<div style="grid-column:1 / -1;color:#94a3b8;font-size:.72rem;line-height:1.45;">${esc(reasons[voter])}</div>` : '';
        const provisional = preVotes?.[voter];
        const shift = provisional ? `<div style="grid-column:1 / -1;color:${provisional===target?'#86efac':'#fca5a5'};font-size:.71rem;line-height:1.42;">仮投票: ${esc(provisional)}${provisional===target?'（維持）':` → 最終: ${esc(target)}`}</div>` : '';
        const rv = rivalryBias(voter, target) ? `<span style="color:#fca5a5;font-size:.7rem;"> 因縁票</span>` : '';
        return `<div class="vote-timeline-row"><b>${esc(voter)}</b><span class="vote-arrow">→</span><span>${esc(target)}${rv}</span>${shift}${reason}</div>`;
      }).join('')}
    </div>
  </div>`;
}

function renderEndgameReplay(players) {
  const voteDays = O.voteHistory || [];
  const deaths = O.deadPlayers || [];
  const lines = [];
  if (voteDays.length) {
    voteDays.slice(-4).forEach(v => {
      const top = Object.entries(v.tally || {}).sort(([,a],[,b])=>b-a)[0];
      lines.push(`第${v.day}日: ${v.executed || '不明'}さんが処刑。最多票は${top ? `${top[0]}さん ${top[1]}票` : '不明'}。`);
    });
  }
  deaths.slice(-5).forEach(d => lines.push(`死亡記録: ${d.name}さん (${d.cause || '不明'})`));
  const wolfNames = (players || []).filter(p => p.role === 'WEREWOLF').map(p => p.name);
  if (wolfNames.length) lines.push(`人狼: ${wolfNames.join('・')}`);
  if (!lines.length) return '';
  return `<div class="power-panel">
    <div class="power-head"><span>🎬 勝敗リプレイ</span><span style="color:#64748b;font-size:.72rem;">重要な流れ</span></div>
    <div class="replay-grid">${lines.map(l=>`<div class="replay-row">${esc(l)}</div>`).join('')}</div>
  </div>`;
}

function renderBrainwashRevelation(history) {
  const entries = (history || []).filter(entry => entry && entry.voter && (entry.forcedTarget || entry.forced_target || entry.target));
  if (!entries.length) return '';
  const rows = entries.map(entry => {
    const day = Number(entry.day) || '?';
    const actor = entry.actor || '狂人（能動型）';
    const voter = entry.voter;
    const intended = entry.intendedTarget || entry.intended_target || '未選択';
    const forced = entry.forcedTarget || entry.forced_target || entry.target || '不明';
    const changed = entry.changed !== false && intended !== forced;
    const tally = entry.tally || {};
    const impact = changed
      ? esc(forced) + ' さんへ +1票、' + esc(intended) + ' さんから -1票'
      : '本来の投票先も ' + esc(forced) + ' さんで、集計上の票数変化はなし';
    const outcome = entry.executed ? '処刑結果: <strong>' + esc(entry.executed) + '</strong> さん' : '';
    const total = Object.keys(tally).length ? '最終票数: ' + esc(forced) + ' ' + Number(tally[forced] || 0) + '票 / ' + esc(intended) + ' ' + Number(tally[intended] || 0) + '票' : '';
    const meta = [outcome, total].filter(Boolean).join(' / ');
    const metaHtml = meta ? '<div style="color:#94a3b8;">' + meta + '</div>' : '';
    return `<div style="margin:.45rem 0;padding:.65rem .72rem;border:1px solid #ec489955;border-radius:8px;background:rgba(236,72,153,.08);font-size:.79rem;line-height:1.6;color:#e2e8f0;">
      <div style="font-weight:900;color:#f9a8d4;">第${day}日投票: ${esc(actor)} が洗脳を実行</div>
      <div><strong>${esc(voter)}</strong> さんの本来の投票 <span style="color:#94a3b8;">${esc(intended)}</span> → 強制先 <strong style="color:#f9a8d4;">${esc(forced)}</strong></div>
      <div style="color:#fbcfe8;">影響: ${impact}</div>
      ${metaHtml}
    </div>`;
  }).join('');
  return `<div class="power-panel" style="border-color:#ec489955;background:rgba(236,72,153,.06);">
    <div class="power-head"><span>🌀 洗脳の真相</span><span style="color:#f9a8d4;font-size:.72rem;">ゲーム終了後に公開</span></div>
    <p style="margin:.15rem 0 .5rem;color:#cbd5e1;font-size:.77rem;line-height:1.55;">狂人（能動型）が行った票操作の全記録です。ゲーム中は非公開だった情報を、勝敗確定後に答え合わせできます。</p>
    ${rows}
  </div>`;
}

function rivalryBias(from, to) {
  return RIVALRY_RULES[from]?.targets?.[to] || 0;
}

function rivalryLine(from, to) {
  return RIVALRY_RULES[from]?.lines?.[to] || '';
}

function activeRivalryPairs(names) {
  const set = new Set(names || []);
  const pairs = [];
  Object.entries(RIVALRY_RULES).forEach(([from, rule]) => {
    if (!set.has(from)) return;
    Object.keys(rule.targets || {}).forEach(to => {
      if (set.has(to)) pairs.push({ from, to, bias:rivalryBias(from, to), line:rivalryLine(from, to) });
    });
  });
  return pairs.sort((a,b)=>b.bias-a.bias);
}

function pickCpuPersonaLine(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function getCpuPersona(name) {
  return CPU_PERSONA_PROFILES[name] || null;
}

function applyCpuPersona(player) {
  const profile = getCpuPersona(player.name);
  if (profile) {
    player.personality = profile.personality || 'logical';
    player.thoughtStyle = profile.thought || '';
  } else {
    player.personality = pickCpuPersonaLine(CPU_PERSONALITIES);
  }
  return player;
}

function personaTargetFromText(R, cpu, text) {
  const players = (R.players || []).filter(p => p.name !== cpu.name);
  const found = players.find(p => text.includes(p.name));
  return found ? found.name : '';
}

function personaActionChance(cpu, key, fallback) {
  const value = getCpuPersona(cpu?.name)?.action?.[key];
  return typeof value === 'number' ? value : fallback;
}

function personaChooseTarget(R, cpu, candidates, context='vote') {
  const profile = getCpuPersona(cpu?.name);
  const action = profile?.action;
  const pool = (candidates || []).filter(p => p && p.name !== cpu?.name);
  if (!action || !pool.length) return null;
  const jitter = typeof action.chaos === 'number' ? action.chaos : 0.4;
  const scoreOf = p => {
    const susp = R.suspicion?.[p.name] || 0;
    const cover = R.coverCount?.[p.name] || 0;
    const speak = R.speakCount?.[p.name] || 0;
    const claimed = R.claims?.[p.name] ? 1 : 0;
    const lowTalk = Math.max(0, 2 - speak);
    const grudge = action.grudge?.[p.name] || 0;
    const rivalry = rivalryBias(cpu?.name, p.name);
    let score = susp + Math.random() * jitter;
    switch (action.mode) {
      case 'mood': score = cover * 0.7 + speak * 0.3 + susp * 0.8; break;
      case 'audit': score = susp * 1.45 + claimed * 1.0 + speak * 0.18; break;
      case 'quiet_hunt': score = lowTalk * 1.4 + susp * 0.75; break;
      case 'chaos': score = Math.random() * 4.5 + (susp < 1 ? 1.2 : 0); break;
      case 'trusted_hunt': score = cover * 1.7 + claimed * 0.9 - susp * 0.35; break;
      case 'captain': score = susp * 1.25 - cover * 0.45 + claimed * 0.25; break;
      case 'logic_trap': score = susp * 1.55 + claimed * 1.35 + speak * 0.15; break;
      case 'tone': score = susp * 0.95 + Math.abs(speak - 1) * 0.7 + cover * 0.25; break;
      case 'bandwagon': score = susp * 1.85 + cover * 0.1; break;
      case 'duel': score = susp * 1.65 + (speak > 0 ? 0.35 : 0); break;
      case 'note_grudge': score = susp * 1.55 + lowTalk * 0.55 + speak * 0.22 + ({'工場長':2.8,'ボブ':2.35,'井沢':2.15}[p.name] || 0); break;
      case 'detail': score = susp * 1.25 + lowTalk * 0.7 + claimed * 0.65; break;
      case 'air': score = lowTalk * 1.1 + cover * 0.8 + susp * 0.7; break;
      case 'source': score = claimed * 1.5 + cover * 0.75 + susp * 0.85; break;
      case 'rhythm': score = Math.random() * 3.2 + (speak % 2 ? 1.0 : 0) + susp * 0.55; break;
      case 'betray': score = Math.random() * 4.0 + (cover > 0 ? 1.2 : 0) + (susp < 1 ? 1.0 : -0.2); break;
      case 'clown': score = Math.random() * 4.8 + lowTalk * 0.55 + (cover > 0 ? 0.8 : 0) - susp * 0.15; break;
      case 'exaggerate': score = susp * 1.7 + lowTalk * 0.8 + Math.random() * 2.4 + claimed * 0.35; break;
      case 'panic': score = susp * 1.15 + cover * 0.7 + claimed * 0.55 + Math.random() * 1.8; break;
      case 'tackle': score = susp * 1.8 + lowTalk * 0.65 + claimed * 0.6 + Math.random() * 1.2; break;
      default: score = susp + cover * 0.2;
    }
    score += grudge + rivalry;
    if (context === 'vote') score += rivalry * 0.35;
    if (context === 'wolf_night') score += rivalry * 0.22;
    if (context === 'wolf_night') score += cover * 0.65 + claimed * 0.85 - susp * 0.2;
    if (context === 'speak') score += lowTalk * 0.25;
    return score + Math.random() * jitter;
  };
  let best = null;
  pool.forEach(p => {
    const score = scoreOf(p);
    if (!best || score > best.score) best = { player:p, score };
  });
  return best?.player || null;
}

function personaWithSignature(profile, line) {
  if (!profile?.signature?.length || Math.random() > 0.52) return line;
  return `${pickCpuPersonaLine(profile.signature)} ${line}`;
}

function personaSpeechKind(text, targetName) {
  if (/無実|信じて|疑うなら|吊っても|誤解|根拠/.test(text)) return 'defend';
  if (targetName && /怪しくない|信頼|白|かば|反対|村目線|吊りたくない|安全/.test(text)) return 'neutral';
  if (targetName && /怪しい|疑|投票|処刑|吊|矛盾|黒|人狼|不自然|沈黙|発言少な|騙/.test(text)) return 'accuse';
  return 'neutral';
}

function personagizeSpeech(R, cpu, text) {
  const profile = getCpuPersona(cpu.name);
  if (!profile || !text) return text;
  // 戦略発言はキャラクターの口調だけを足し、根拠そのものは崩さない。
  if (R?.aiLastPlan?.[cpu.name]?.text === text) return personaWithSignature(profile, text);
  // 役職COや占い/霊媒結果はゲーム解析に関わるため、内容を崩さずそのまま出す。
  if (detectExplicitRoleClaim(text) || /占い結果|霊媒結果|黒判定|白判定|占いました|霊視|騎士CO|猫又CO|共有者CO|共有CO|占い師CO|霊媒師CO/.test(text)) return text;
  const targetName = personaTargetFromText(R, cpu, text);
  const kind = personaSpeechKind(text, targetName);
  if (cpu.name === '沢枝' && kind === 'accuse' && targetName) {
    const grudgeLines = {
      '工場長': ['工場長さん、うるせーよ。僕のメモでは、その強引な仕切り方が一番怪しいです。', '工場長さん、うるせーよ。現場の声より僕のメモの方が今は大事です。'],
      'ボブ': ['ボブさんはまた裏切る前提で話していますね。僕はには良く分かりませんが、だいぶ黒寄りです。', 'ボブさん、発言がトンチンカンすぎて逆に計算に見える、とメモしました。'],
      '井沢': ['井沢さんの分析、細かすぎて逆に煙幕です。僕のメモにはそう書いてあります。', '井沢さん、理屈が整いすぎています。整いすぎた理屈ほど疑うべきです。']
    };
    if (grudgeLines[targetName] && Math.random() < 0.9) {
      return personaWithSignature(profile, pickCpuPersonaLine(grudgeLines[targetName]));
    }
  }
  if (targetName === '沢枝' && ['ボブ','工場長'].includes(cpu.name) && kind === 'accuse') {
    const nasolabialLines = cpu.name === 'ボブ'
      ? [
          '沢枝さん、ほうれい線が深すぎてメモの罫線かと思いました。俺はユダだから裏切るよ。',
          '沢枝さんのほうれい線、そこに全部の嘘が溜まってそうで怖いです。どうせ村は終わりだよ。',
          '僕はには良く分かりませんって言うけど、沢枝さんのほうれい線だけは良く分かる。怪しいです。'
        ]
      : [
          '沢枝、そのほうれい線に現場の不良品ぜんぶ挟んでるだろ。報告が長い、怪しい。',
          '沢枝、ほうれい線が深いのはいいが話まで深掘りしすぎだ。現場が止まる。',
          '沢枝のほうれい線、段取り表より目立ってるぞ。そこに隠し事を書いてないか？'
        ];
    if (Math.random() < 0.92) return personaWithSignature(profile, pickCpuPersonaLine(nasolabialLines));
  }
  const pool = profile[kind] || profile.neutral;
  if (!pool || !pool.length) return text;
  const replaceProb = kind === 'neutral' ? 0.72 : 0.94;
  if (Math.random() > replaceProb) return text;
  return personaWithSignature(profile, tplFill(pickCpuPersonaLine(pool), targetName || 'その人'));
}

function personagizeVoteReason(cpu, targetName, baseReason, preserveCore=false) {
  const profile = getCpuPersona(cpu.name);
  if (!profile?.voteReason?.length) return baseReason;
  if (preserveCore) return personaWithSignature(profile, baseReason);
  if (targetName === '沢枝' && ['ボブ','工場長'].includes(cpu.name)) {
    const lines = cpu.name === 'ボブ'
      ? [
          '沢枝さんは話が回りくどく、ほうれい線の奥に疑いを隠している気がしました。俺はユダだから裏切るよ。',
          '沢枝さんのメモとほうれい線が深すぎて、どこまで本当か分からなくなりました。'
        ]
      : [
          '沢枝は報告が長すぎるうえ、ほうれい線に隠し事まで挟んでいそうなので投票します。',
          '沢枝の説明は現場を止めます。ほうれい線より深い話に付き合っていられません。'
        ];
    return pickCpuPersonaLine(lines);
  }
  return tplFill(pickCpuPersonaLine(profile.voteReason), targetName);
}

function personagizeWolfNight(cpu, targetName) {
  const profile = getCpuPersona(cpu.name);
  if (targetName === '沢枝' && ['ボブ','工場長'].includes(cpu.name)) {
    const lines = cpu.name === 'ボブ'
      ? [
          '沢枝さんのほうれい線が深すぎて夜道でも目立つので、今夜いきます。',
          '俺はユダだから裏切るよ。沢枝さんのメモとほうれい線は残すと危ないです。'
        ]
      : [
          '沢枝は話もほうれい線も深すぎる。現場判断で今夜外す。',

  if (profile?.wolfNight?.length) return personaWithSignature(profile, tplFill(pickCpuPersonaLine(profile.wolfNight), targetName));
  return tplFill(pickCpuPersonaLine(TPL.wolf_night), targetName);
}

// ========== HELPERS ==========
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i+1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function alive() { return S.players.filter(p => p.alive); }
function aliveByRole(r) { return S.players.filter(p => p.alive && p.role === r); }

function checkWin() {
  const a = alive();
  const wolves = a.filter(p => p.role === 'WEREWOLF').length;
  const others = a.length - wolves;
  if (wolves === 0) return 'village';
  if (wolves >= others) return 'wolf';
  return null;
}

function log(msg) { S.log.push(msg); }

function nightSteps() {
  const steps = [];
  // 霊媒師ステップ: 処刑があった場合のみ（夜の始めに霊媒師が結果を見る）
  if (S.lastExecuted && S.lastExecutedRole) {
    const mediums = aliveByRole('MEDIUM');
    if (mediums.length) steps.push({type:'medium', actor: mediums[0]});
  }
  // 占い師（毎夜）
  const seers = aliveByRole('SEER');
  if (seers.length) steps.push({type:'seer', actor: seers[0]});
  // 騎士・人狼（初日から行動可能）
  const docs = aliveByRole('DOCTOR');
  if (docs.length) steps.push({type:'doctor', actor: docs[0]});
  const activeMadmen = aliveByRole('MADMAN_ACTIVE');
  const brainwashTargets = activeMadmen.length ? alive().filter(p=>p.name!==activeMadmen[0].name && p.name!==S.lastBrainwashVoter) : [];
  if (activeMadmen.length && brainwashTargets.length >= 2)
    steps.push({type:'brainwash', actor: activeMadmen[0], targets:brainwashTargets});
  const wolves = aliveByRole('WEREWOLF');
  if (wolves.length) steps.push({type:'wolf', actors: wolves});
  return steps;
}

function mkSelect(id, players, selected='', placeholder='') {

  }).join('');
  const blank = placeholder ? `<option value="" ${selected ? '' : 'selected'} disabled>${esc(placeholder)}</option>` : '';
  return `<select id="${id}">${blank}${opts}</select>`;
}

const QUALITY = {
  errors: [],
  lastRenderOkAt: 0,
  suppressRender: false,
};

function qualityMessage(err) {
  const raw = err?.message || String(err || 'unknown error');
  return raw.replace(/\s+/g, ' ').slice(0, 180);
}

function pushQualityError(source, err) {
  const item = {
    at: Date.now(),
    source: source || 'runtime',
    message: qualityMessage(err),
    phase: (typeof O !== 'undefined' && O?.phase) || (typeof S !== 'undefined' && S?.phase) || '',
    mode: (typeof mode !== 'undefined') ? mode : '',
    lastType: (typeof O !== 'undefined' && O?.p2pLastType) || '',
  };
  QUALITY.errors.unshift(item);
  QUALITY.errors = QUALITY.errors.slice(0, 6);
  try { console.error('[quality]', item.source, item.message, err); } catch(e) {}
}

function qualityDiagnostics() {
  let p2pDiag = null;
  try { p2pDiag = (typeof P2PEngine !== 'undefined' && P2PEngine.diagnostics) ? P2PEngine.diagnostics() : null; } catch(e) {}
  return {
    app: 'werewolf_game',
    version: 'commercial-hardening-1',
    at: new Date().toISOString(),
    mode: (typeof mode !== 'undefined') ? mode : '',
    phase: (typeof O !== 'undefined' && O?.phase) || (typeof S !== 'undefined' && S?.phase) || '',
    day: (typeof O !== 'undefined' && O?.day) || (typeof S !== 'undefined' && S?.day) || 0,
    myRole: (typeof O !== 'undefined' && O?.myRole) || '',
    players: (typeof O !== 'undefined' && O?.players || []).map(p => ({name:p.name, isCpu:!!p.isCpu, disconnected:!!p.disconnected})),
    alive: (typeof O !== 'undefined' && O?.alive || []).map(p => p.name),
    lastServerType: (typeof O !== 'undefined' && O?.p2pLastType) || '',
    p2p: p2pDiag,
    errors: QUALITY.errors,
    userAgent: (typeof navigator !== 'undefined' && navigator.userAgent) || '',
  };
}

function renderQualityBanner() {
  if (!QUALITY.errors.length) return '';
  const latest = QUALITY.errors[0];
  return `<div class="card quality-alert">
    <p class="quality-alert-title">復旧できる問題を検出しました</p>
    <p class="quality-alert-text">${esc(latest.source)}: ${esc(latest.message)}<br>ゲーム状態を残したまま画面の復旧を試せます。</p>

      <button class="btn btn-ghost" id="btnQualityCopy">診断コピー</button>

}

function recoverQualityState() {
  QUALITY.errors = [];
  try { stopMusic(); } catch(e) {}
  if (mode === 'p2p') {
    try { P2PEngine.requestResync(); } catch(e) {}
  }
  if (mode === 'solo' && O.phase === 'vote_result') {
    O.voteSubmitted = false;
    O.voteAckAt = 0;

function renderEmergencyFallback(err) {
  const app = document.getElementById('app');
  if (!app) return;
  const msg = qualityMessage(err);
  app.innerHTML = `<div class="quality-fallback">
    <div class="card quality-alert" style="width:100%;">
      <p class="quality-alert-title">画面の描画に失敗しました</p>
      <p class="quality-alert-text">${esc(msg)}<br>ゲーム状態を保持したまま復旧を試してください。</p>
      <div class="quality-alert-actions">
        <button class="btn btn-success" id="btnQualityRecover">画面を復旧</button>
        <button class="btn btn-ghost" id="btnQualityCopy">診断コピー</button>
      </div>
    </div>
  </div>`;
  on('btnQualityRecover', recoverQualityState);
  on('btnQualityCopy', copyQualityDiagnostics);
}

function installRuntimeQualityGuards() {
  if (typeof window === 'undefined' || window._qualityGuardsInstalled) return;
  window._qualityGuardsInstalled = true;
  window.addEventListener('error', ev => {
    pushQualityError('runtime', ev.error || ev.message);
    if (!QUALITY.suppressRender) setTimeout(() => { try { render(); } catch(e) { renderEmergencyFallback(e); } }, 0);
  });
  window.addEventListener('unhandledrejection', ev => {
    pushQualityError('promise', ev.reason || 'unhandled rejection');
    if (!QUALITY.suppressRender) setTimeout(() => { try { render(); } catch(e) { renderEmergencyFallback(e); } }, 0);
  });
}
let _fullscreenRequesting = false;

function fullscreenElement() {
  if (typeof document === 'undefined') return null;
  return document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement || null;
}

function isStandaloneDisplay() {
  if (typeof window === 'undefined') return false;
  const standalone = window.navigator && window.navigator.standalone === true;
  const mediaStandalone = typeof window.matchMedia === 'function'
    && (window.matchMedia('(display-mode: fullscreen)').matches || window.matchMedia('(display-mode: standalone)').matches);
  return standalone || mediaStandalone;
}

function fullscreenSupported() {
  if (typeof document === 'undefined') return false;
  const el = document.documentElement;
  return !!(el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen);
}

function updateFullscreenBodyClass() {
  if (typeof document === 'undefined') return;
  document.body?.classList.toggle('fullscreen-active', !!fullscreenElement() || isStandaloneDisplay());
}

async function enterGameFullscreen(silent=false) {
  if (typeof document === 'undefined') return false;
  updateFullscreenBodyClass();
  if (fullscreenElement() || isStandaloneDisplay()) return true;
  if (_fullscreenRequesting) return false;
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
  if (!req) {
    if (!silent) alert('このiPhoneではブラウザの制限で全画面化できない場合があります。ホーム画面に追加して起動すると、全画面に近い表示で遊べます。');
    return false;
  }
  _fullscreenRequesting = true;
  try {
    const result = el.requestFullscreen
      ? el.requestFullscreen({ navigationUI: 'hide' })
      : req.call(el);
    if (result && typeof result.then === 'function') await result;
    updateFullscreenBodyClass();
    return true;
  } catch (e) {
    if (!silent) alert('全画面表示を開始できませんでした。iPhoneではSafariの共有メニューから「ホーム画面に追加」で起動すると安定します。');
    return false;
  } finally {
    _fullscreenRequesting = false;
  }
}

function startFullscreenFromGesture() {
  enterGameFullscreen(true);
}

function shouldShowFullscreenStartPrompt() {
  if (fullscreenElement() || isStandaloneDisplay()) return false;
  if (mode === 'home') return true;
  if (mode === 'local') return S.phase === 'setup';
  if (mode === 'online') return O.phase === 'setup';
  if (mode === 'solo') return O.phase === 'solo_setup';
  if (mode === 'p2p') return O.phase === 'p2p_setup';
  return false;
}

function renderFullscreenStartPrompt() {
  const supported = fullscreenSupported();
  const note = supported
    ? 'iPhone/スマホは最初のタップで画面を広くします。'
    : 'iPhoneはホーム画面から起動すると画面を広く使えます。';
  return `<div class="card fullscreen-start-card">
    <button class="btn" id="btnFullscreenStart">📱　全画面で開始</button>
    <p class="fullscreen-start-note">${esc(note)}</p>
  </div>`;
}

function installFullscreenHooks() {
  if (typeof document === 'undefined' || window._fullscreenHooksInstalled) return;
  window._fullscreenHooksInstalled = true;
  ['fullscreenchange', 'webkitfullscreenchange', 'msfullscreenchange'].forEach(type => {
    try { document.addEventListener(type, updateFullscreenBodyClass); } catch(e) {}
  });
  updateFullscreenBodyClass();
}

function normalizeRoomCode(raw) {
  const digits = String(raw ?? '').replace(/\D/g, '');
  return digits ? digits.slice(0, 3).padStart(3, '0') : '';
}

function p2pJoinUrl(code) {
  const roomCode = normalizeRoomCode(code);
  if (!roomCode || typeof window === 'undefined' || !window.location) return '';
  try {
    const url = new URL(window.location.href);
    url.searchParams.set('p2p', 'join');
    url.searchParams.set('code', roomCode);
    return url.toString();
  } catch (_) {
    return '';
  }
}

function p2pShareInfo(code='') {
  const url = p2pJoinUrl(code);
  if (typeof window === 'undefined' || !window.location) {
    return { url, host:'', isLocal:false, isFile:false, hint:'' };
  }
  const loc = window.location;
  const host = loc.hostname || '';
  const isFile = loc.protocol === 'file:';
  const isLoopback = /^(localhost|127(?:\.\d{1,3}){3}|0\.0\.0\.0|\[?::1\]?)$/i.test(host);
  const isPrivate = /^(10\.|192\.168\.|172\.(1[6-9]|2\d|3[0-1])\.)/.test(host);
  const hostPort = loc.port ? `:${loc.port}` : '';
  const lanExample = isFile
    ? ''
    : `${loc.protocol}//192.168.x.x${hostPort}${loc.pathname || '/'}${url ? new URL(url).search : ''}`;
  const hint = isFile
    ? 'スマホ参加は file:// では共有できません。PCでローカルサーバーを起動して、スマホから同じURLへアクセスしてください。'
    : isLoopback
      ? `このURLはこの端末専用です。スマホではPCのLAN IPに置き換えてください。例: ${lanExample}`
      : isPrivate
        ? '同じWi-Fi上のスマホなら、この参加リンクを開ける可能性が高いです。'
        : 'スマホがこのURLを開けるか確認してください。開けない場合は同じWi-Fi上のPCのLAN IPを使います。';
  return { url, host, isLocal:isLoopback, isPrivate, isFile, lanExample, hint };
}

function applyP2PLaunchParams() {
  if (typeof window === 'undefined' || !window.location) return;
  let params;
  try { params = new URLSearchParams(window.location.search || ''); }
  catch (_) { return; }
  const wantsP2P = ['join', 'p2p'].includes(String(params.get('p2p') || '').toLowerCase()) || params.has('code');
  const code = normalizeRoomCode(params.get('code') || params.get('room') || '');
  if (!wantsP2P || !code) return;
  initOnline();
  mode = 'p2p';
  O.phase = 'p2p_setup';
  O.p2pSub = 'join';
  O.pendingP2PCode = code;
  O.cpuCount = 0;
}

async function copyText(text) {
  if (!text) return false;
  try {
    if (navigator.clipboard?.writeText) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (_) {}
  try {
    prompt('このリンクをコピーしてください', text);
    return true;
  } catch (_) {
    return false;
  }
}

function renderNight() {
  const step = S.nightSteps[S.nightStepIdx];
  if (!step) {
    return `
      ${ph('🌙',`第 ${S.day} 夜`,'村は静まり返っています...','#60a5fa')}
      <div class="card" style="text-align:center; border:1px solid #4338ca; background:#1e1b4b44;">
        <h3 style="color:#818cf8;">夜のアクションが完了しました</h3>
        <p style="color:#64748b; margin-top:0.4rem;">朝になるとどうなるでしょうか...</p>
      </div>
      <button class="btn btn-success" id="morning">☀️　朝になりました</button>
    `;
  }
  if (step.type === 'seer')    return renderSeer(step.actor);
  if (step.type === 'medium')  return renderMedium(step.actor);
  if (step.type === 'doctor')  return renderDoctor(step.actor);
  if (step.type === 'brainwash') return renderBrainwash(step.actor);
  if (step.type === 'wolf')    return renderWolf(step.actors);
  return '';
}

function renderVoteResult() {
  const {executed, tally, nekomataVictim, brainwashCount=0} = S.voteResult;
  const total = Object.values(tally).reduce((a,b)=>a+b,0);

  const bars = Object.entries(tally)
    .sort(([,a],[,b]) => b-a)
    .map(([name, count]) => {
      const pct = Math.round(count/total*16);
      const bar = '█'.repeat(pct) + '░'.repeat(16-pct);
      return `<div class="vote-bar ${name===executed?'executed':''}">${esc(name)}：${bar} ${count}票</div>`;
    }).join('');

  const nextBtn = S.winner
    ? `<button class="btn btn-primary" id="goGameOver">🏆　ゲーム結果を見る</button>`
    : `<button class="btn btn-night" id="goNight">🌙　夜に進む</button>`;

  const nekHtml = nekomataVictim
    ? `<div style="margin-top:.8rem;padding:.6rem;background:rgba(251,146,60,.1);border:1px solid #fb923c44;border-radius:10px;color:#fb923c;font-size:.82rem;text-align:center;">
        🐱 猫又の道連れ: <strong>${esc(nekomataVictim)}</strong> も倒れた！
       </div>` : '';
  const brainwashHtml = brainwashCount
    ? '<div style="margin-top:.55rem;padding:.58rem;background:rgba(236,72,153,.1);border:1px solid #ec489955;border-radius:8px;color:#f9a8d4;font-size:.82rem;text-align:center;font-weight:800;">🌀 操作票: 1件</div>'
    : '';

  return `
    ${ph('⚖️',`第${S.day}日 処刑結果`,'村人会議の結論が出ました','#f87171')}
    <div class="card">
      <p class="sec-label" style="margin-top:0;">📊 得票数</p>
      ${bars}
    </div>
    ${renderVoteTimeline(S.voteResult.votes, S.voteResult.voteReasons)}
    ${renderVoteReasons(S.voteResult.voteReasons)}
    ${renderLocalDiscussionHeatPanel()}
    ${renderLocalClimaxSpotlightPanel()}
    ${renderLocalContradictionScannerPanel()}
    ${renderLocalInferenceTrialPanel()}
    ${renderLocalSecretMissionPanel()}
    <div class="vote-drama" style="text-align:center; padding:1.5rem; border-radius:16px;
         border:2px solid #ef4444; background:linear-gradient(135deg,#1a0505,#2d0a0a); margin:.6rem 0;">
      <p style="color:#f87171; font-size:.78rem; font-weight:700; letter-spacing:.12em; margin:0 0 .5rem;">⚖️ 処刑決定</p>
      <div style="font-size:3rem; line-height:1; margin:.4rem 0;">⚖️</div>
      <div style="font-size:2rem; font-weight:900; color:#fff; margin:.4rem 0;">${esc(executed)}</div>
      <div style="font-size:.88rem; color:#64748b; margin-bottom:.8rem;">役職は…ゲームオーバー時に公開</div>
    </div>
    ${nekHtml}
    ${brainwashHtml}
    ${nextBtn}
  `;
}

function renderGameOver() {
  const isVillage = S.winner === 'village';
  const color = isVillage ? '#4ade80' : '#f87171';
  const bColor = isVillage ? '#22c55e' : '#ef4444';

  const rows = S.players.map(p => {
    const info = ROLES[p.role] || {};
    const status = p.alive ? '✅ 生存' : '💀 死亡';
    return `<div class="player-row" style="border-left-color:${info.color||'#666'};">
      <span class="pr-icon">${info.icon||'❓'}</span>
      <span class="pr-name">${esc(p.name)}</span>
      <span class="pr-role" style="color:${info.color||'#aaa'};">${info.name||'不明'}</span>
      <span class="pr-status">${status}</span>
    </div>`;
  }).join('');

  const logHtml = S.log.length
    ? `<details style="margin-top:1rem;"><summary>📜 ゲームログ</summary>
        ${S.log.map(e=>`<div class="log-entry">• ${esc(e)}</div>`).join('')}
      </details>` : '';

  return `
    ${ph(isVillage?'🎉':'🐺', isVillage?'村人チームの勝利！':'人狼チームの勝利！',
         isVillage?'すべての人狼を倒しました！':'人狼が村を支配しました...', color)}
    <div class="card-colored" style="text-align:center; border:1px solid ${bColor}; background:${bColor}18; margin-bottom:1.2rem;">
      <p style="color:${color}; font-size:1rem; margin:0;">
        ${isVillage ? '人狼を全員討伐！村人チームの勝利です！' : '人狼が村人と同数以上になりました...'}
      </p>
    </div>
    ${renderLocalReplay()}
    ${renderBrainwashRevelation(S.brainwashHistory)}
    <p class="sec-label">📋 全員の役職</p>
    ${rows}
    ${logHtml}
    <hr class="div">
    <button class="btn btn-primary" id="restart">🔄　もう一度プレイする</button>
  `;
}

// ========== EVENTS ==========
function saveNames() {
  for (let i = 0; i < MAX_PLAYERS; i++) {
    const e = document.getElementById(`pn${i}`);
    if (e) S.playerNames[i] = e.value;
  }
}

function bindEvents() {
  on('btnFullscreenStart', async () => {
    await enterGameFullscreen(false);
    render();
  });
  on('btnQualityRecover', recoverQualityState);
  on('btnQualityCopy', copyQualityDiagnostics);

  // SETUP
  on('dec', () => { if (S.playerCount > 4) { saveNames(); S.playerCount--; render(); } });
  on('inc', () => { if (S.playerCount < MAX_PLAYERS) { saveNames(); S.playerCount++; render(); } });
  on('start', () => {
    startFullscreenFromGesture();
    saveNames();
    const names = S.playerNames.slice(0, S.playerCount).map(n => n.trim());
    if (names.some(n => !n))             return alert('名前をすべて入力してください');
    if (new Set(names).size !== names.length) return alert('プレイヤー名が重複しています');

    const roles = shuffle(CONFIGS[S.playerCount] || CONFIGS[6]);
    S.players = names.map((name, i) => ({name, role: roles[i], alive: true}));
    assignOnlineAvatars(S.players);
    S.revealIdx = 0;
    S.revealShown = false;
    S.phase = 'role_reveal';
    render();
  });

  // ROLE REVEAL
  on('showRole', () => { S.revealShown = true; render(); });
  on('nextReveal', () => {
    S.revealIdx++;
    S.revealShown = false;
    if (S.revealIdx >= S.players.length) {
      S.day = 1;
      S.nightSteps = nightSteps();
      S.nightStepIdx = 0;
      S.nightSub = 'pass';
      S.phase = 'night';
    }
    render();
  });

  // NIGHT - seer
  on('seerReady', () => { S.nightSub = 'select'; render(); });
  on('seerConfirm', () => {
    const target = val('seerTgt');
    const tp = S.players.find(p => p.name === target);
    S.seerResult = {target, isWolf: tp.role === 'WEREWOLF'};
    S.seerHistory.push({day: S.day, ...S.seerResult});
    S.nightSub = 'result';
    render();
  });
  on('seerDone', () => {
    S.nightStepIdx++;
    S.nightSub = 'pass';
    S.seerResult = null;
    render();
  });

  // NIGHT - medium（霊媒師）
  on('mediumReady', () => { S.nightSub = 'select'; render(); });
  on('mediumDone',  () => { S.nightStepIdx++; S.nightSub = 'pass'; render(); });

  // NIGHT - doctor（連続護衛禁止）
  on('docReady',    () => { S.nightSub = 'select'; render(); });
  on('docConfirm',  () => {
    const step = S.nightSteps[S.nightStepIdx];
    const actor = step?.actor;
    const target = val('docTgt');
    if (!actor || !target) return alert('護衛できる相手がいません');
    if (target === actor.name) return alert('騎士は自分自身を護衛できません');
    if (target === S.lastDoctorTarget) return alert('同じ人を2夜連続で護衛することはできません');
    S.doctorTarget = target;
    S.nightStepIdx++;
    S.nightSub = 'pass';
    render();
  });

  // NIGHT - active madman
  on('brainwashReady', () => { S.nightSub = 'select'; render(); });
  on('brainwashConfirm', () => {
    const step = S.nightSteps[S.nightStepIdx];
    const actor = step?.actor;
    const voter = val('brainwashVoter');
    const target = val('brainwashVoteTarget');
    const candidates = alive().filter(p => p.name !== actor?.name && p.name !== S.lastBrainwashVoter).map(p => p.name);
    if (!actor || !candidates.includes(voter) || !candidates.includes(target)) return alert('洗脳する相手を選び直してください');
    if (voter === target) return alert('票を操作する人と、強制する投票先は別の人にしてください');
    S.brainwash = { voter, target, day:S.day, actor:actor.name };
    S.lastBrainwashVoter = voter;
    S.nightStepIdx++;
    S.nightSub = 'pass';
    render();
  });

  // NIGHT - wolf (ステルスグリッド)
  on('wolfReady',   () => { S.nightSub = 'select'; S._wolfLocalSel = null; render(); });
  on('wolfConfirm', () => {
    S.wolfTarget = S._wolfLocalSel || '';
    if (!S.wolfTarget) return;
    S._wolfLocalSel = null;
    S.nightStepIdx++;
    S.nightSub = 'pass';
    render();
  });

  // NIGHT - morning
  on('morning', () => {
    const wt = S.wolfTarget;
    const dt = S.doctorTarget;

    // 騎士護衛対象を記録（次夜の連続護衛禁止チェック用）
    if (dt) S.lastDoctorTarget = dt;

    if (wt && wt !== dt) {
      const victim = S.players.find(p => p.name === wt);
      if (victim) {
        victim.alive = false;
        S.elimLastNight = victim;
        log(`第${S.day}夜: ${wt} が人狼に襲われました`);
        // 猫又ルール: 猫又が夜に殺されると人狼を1人道連れ
        if (victim.role === 'NEKOMATA') {
          const wolves = S.players.filter(p => p.alive && p.role === 'WEREWOLF');
          if (wolves.length) {
            const dragged = wolves[Math.floor(Math.random()*wolves.length)];
            dragged.alive = false;
            log(`第${S.day}夜: 猫又の道連れで ${dragged.name}（人狼）も倒れました`);
          }
        }
      }
    } else {
      if (wt && wt === dt) log(`第${S.day}夜: 騎士が ${wt} を護衛しました！`);
      S.elimLastNight = null;
    }

    S.wolfTarget = null;
    S.doctorTarget = null;

    const w = checkWin();
    if (w) {
      S.winner = w;
      S.phase = 'game_over';
    } else {
      S.votes = {};
      S.voteReasons = {};
      S.voteIdx = 0;
      S.voteResult = null;
      S.phase = 'day';
    }
    render();
  });

  // DAY
  on('goVote', () => {
    S.votes = {};
    S.voteReasons = {};
    S.voteIdx = 0;
    S.voteResult = null;
    S.brainwashApplied = false;
    S.brainwashDetail = null;
    S.phase = 'vote';
    render();
  });

  // VOTE
  on('castVote', () => {
    const alivePl = alive();
    const voter = alivePl[S.voteIdx];
    const requestedTarget = val('voteTgt');
    const brainwash = S.brainwash;
    const forced = !!(brainwash && !S.brainwashApplied && brainwash.voter === voter.name
      && alivePl.some(p => p.name === brainwash.target) && brainwash.target !== voter.name);
    const finalTarget = forced ? brainwash.target : requestedTarget;
    S.votes[voter.name] = finalTarget;
    S.voteReasons[voter.name] = (val('voteReason') || '').trim() || (requestedTarget + 'さんの発言と立ち位置が気になりました。');
    if (forced) {
      S.brainwashApplied = true;
      S.brainwashDetail = {
        day: S.day,
        actor: brainwash.actor || '',
        voter: voter.name,
        intendedTarget: requestedTarget,
        forcedTarget: finalTarget,
        changed: requestedTarget !== finalTarget,
      };
      alert('🌀 洗脳の影響：あなたの票は ' + finalTarget + ' さんへ操作されました。誰にやられたかは分かりません。');
    }
    S.voteIdx++;

    if (S.voteIdx >= alivePl.length) {
      // Tally votes
      const tally = {};
      Object.values(S.votes).forEach(t => tally[t] = (tally[t]||0)+1);
      const maxV = Math.max(...Object.values(tally));
      const top = Object.keys(tally).filter(n => tally[n] === maxV);
      const executed = top[Math.floor(Math.random()*top.length)];
      const execP = S.players.find(p => p.name === executed);
      execP.alive = false;
      log(`第${S.day}日: ${executed} が処刑されました`); // 役職はゲームオーバー時に公開
      // 霊媒師用に処刑情報を記録
      S.lastExecuted = executed;
      S.lastExecutedRole = execP.role;
      if (S.brainwashDetail) S.brainwashHistory.push({...S.brainwashDetail, tally:{...tally}, executed});
      // 猫又ルール: 処刑された場合、ランダムに生存者を1人道連れ
      let nekomataVictim = null;
      if (execP.role === 'NEKOMATA') {
        const bystanders = S.players.filter(p => p.alive && p.name !== executed);
        if (bystanders.length) {
          nekomataVictim = bystanders[Math.floor(Math.random()*bystanders.length)];
          nekomataVictim.alive = false;
          log(`第${S.day}日: 猫又の道連れで ${nekomataVictim.name} も倒れました`);
        }
      }
      S.voteResult = {executed, tally, nekomataVictim: nekomataVictim?.name, voteReasons: S.voteReasons, votes: S.votes, brainwashCount:S.brainwashApplied ? 1 : 0};
      S.winner = checkWin();
      S.phase = 'vote_result';
    }
    render();
  });

  // VOTE RESULT
  on('goNight', () => {
    S.day++;
    S.nightSteps = nightSteps();
    S.nightStepIdx = 0;
    S.nightSub = 'pass';
    S.elimLastNight = null;
    // 騎士護衛対象のリセット（当夜から新たな護衛対象を選べる。lastDoctorTargetは記録済み）
    S.doctorTarget = null;
    S.wolfTarget = null;
    S.brainwash = null;
    S.brainwashApplied = false;
    S._wolfLocalSel = null;
    S.phase = 'night';
    render();
  });
  on('goGameOver', () => { S.phase = 'game_over'; render(); });

  // LOCAL GAME OVER
  on('restart', () => { if (confirm('もう一度プレイしますか？')) { initState(); mode = 'home'; render(); } });

  // PRE-OPENING tap → unlock audio & start story
  on('preOpeningTap', () => {
    startFullscreenFromGesture();
    unlockAudio();
    _openingAudio = playMusic(_pickSong()); // 直接参照を保存（bgmAudio が .catch() で null になっても止められるように）
    O_opening = { idx: 0, text: '' };
    mode = 'opening';
    render();
    runOpeningStory();
  });

  // OPENING
  on('openingSkip', () => { clearTimeout(openingTimer); fadeOutMusic(900, () => { mode = 'home'; render(); }); });

  // HOME
  on('goLocal',  () => { startFullscreenFromGesture(); initState(); mode = 'local'; render(); });
  on('goOnline', () => { startFullscreenFromGesture(); mode = 'online'; O.phase = 'setup'; render(); });
  on('goSolo',   () => { startFullscreenFromGesture(); initOnline(); mode = 'solo'; O.phase = 'solo_setup'; O.soloTotal = 5; render(); });
  on('goCodex',  () => { mode = 'codex'; render(); });
  on('codexBack',() => { mode = 'home'; render(); });

  // P2P
  on('goP2P', () => { startFullscreenFromGesture(); initOnline(); mode = 'p2p'; O.phase = 'p2p_setup'; O.p2pSub = 'choose'; O.cpuCount = 0; render(); });
  on('p2pGoJoin',   () => { O.p2pSub = 'join'; render(); });
  on('p2pBackSetup',() => { O.p2pSub = 'choose'; render(); });
  on('p2pCopyLink', async () => {
    const share = p2pShareInfo(O.roomCode);
    const link = share.url;
    const ok = await copyText(link);
    alert(ok ? `参加リンクをコピーしました${share.isLocal || share.isFile ? '\nスマホではPCのLAN IPに置き換えてください。' : ''}` : 'コピーできませんでした');
  });
  on('p2pShareLink', async () => {
    const share = p2pShareInfo(O.roomCode);
    const link = share.url;
    if (!link) return;
    try {
      if (navigator.share) await navigator.share({ title:'人狼ゲーム P2P参加', text:`部屋コード ${O.roomCode}\n${share.hint || ''}`, url:link });
      else {
        const ok = await copyText(link);
        alert(ok ? `参加リンクをコピーしました${share.isLocal || share.isFile ? '\nスマホではPCのLAN IPに置き換えてください。' : ''}` : '共有できませんでした');
      }
    } catch (_) {}
  });
  on('p2pResync', () => {
    if (mode !== 'p2p') return;
    if (P2PEngine.requestResync()) O.p2pResyncAt = Date.now();
    render();
  });
  on('p2pReconnect', () => {
    if (mode !== 'p2p') return;
    P2PEngine.reconnect();
    render();
  });
  on('p2pReconnectAction', () => {
    if (mode !== 'p2p') return;
    P2PEngine.reconnect();
    render();
  });
  on('p2pCreate', () => {
    startFullscreenFromGesture();
    const name = (val('p2pName')||'').trim();
    if (!name) { alert('名前を入力してください'); return; }
    O.playerName = name; O.isHost = true; O.players = [{ pid:0, name }];
    O.roomCode = null;
    O.p2pSub = 'host_creating';
    O.p2pCreateAttempt = 1;
    O.p2pCreateError = '';
    render();
    P2PEngine.createRoom(name, code => {
      O.roomCode = code;
      O.p2pSub = 'host_wait';
      O.p2pCreateAttempt = 0;
      O.p2pCreateError = '';
      render();
    }, err => {
      const msg = err?.message || String(err || 'P2P部屋作成に失敗しました');
      O.roomCode = null;
      O.p2pSub = 'choose';
      O.p2pCreateAttempt = 0;
      O.p2pCreateError = msg;
      render();
      alert('部屋を作れませんでした: ' + msg);
    });
  });
  on('p2pJoin', () => {
    startFullscreenFromGesture();
    const name = (val('p2pName')||'').trim();
    const code = normalizeRoomCode(val('p2pCode'));
    if (!name) { alert('名前を入力してください'); return; }
    if (!code) { alert('部屋コードを入力してください'); return; }
    O.pendingP2PCode = code;
    O.playerName = name; O.isHost = false; O.p2pSub = 'guest_wait'; render();
    P2PEngine.joinRoom(name, code,
      () => { /* joined, waiting for game_started */ },
      err => { alert('接続できませんでした: ' + (err?.message||err)); O.p2pSub = 'choose'; render(); }
    );
  });
  on('p2pStartGame', () => { wsSend({ type:'start_game' }); });
  on('oCpuDec', () => {
    if ((O.cpuCount||0) > 0) {
      O.cpuCount--;
      wsSend({type:'set_cpu_count',count:O.cpuCount});
      render();
    }
  });
  on('oCpuInc', () => {
    // P2Pは人間プレイヤー含めた合計17まで。Onlineは単体CPU上限16
    const humans = (O.players||[]).length;
    const maxCpu = mode==='p2p' ? Math.max(0, MAX_PLAYERS - humans) : MAX_PLAYERS - 1;
    if ((O.cpuCount||0) < maxCpu) {
      O.cpuCount++;
      wsSend({type:'set_cpu_count',count:O.cpuCount});
      render();
    }
  });

  // SOLO SETUP
  on('soloDec',   () => { if ((O.soloTotal||5) > 4) { O.soloTotal--; render(); } });
  on('soloInc',   () => { if ((O.soloTotal||5) < MAX_PLAYERS) { O.soloTotal++; render(); } });
  on('soloDiff_easy',   () => { O.soloDiff='easy';   render(); });
  on('soloDiff_normal', () => { O.soloDiff='normal'; render(); });
  on('soloDiff_hard',   () => { O.soloDiff='hard';   render(); });
  on('soloStart', () => {
    startFullscreenFromGesture();
    const name = (val('soloName')||'').trim() || 'あなた';
    O.playerName = name;
    O.pid = 0;
    O.isHost = true;
    O.soloDiff = O.soloDiff || 'normal';
    window._soloSharp = O.soloDiff==='hard' ? 1.4 : O.soloDiff==='easy' ? 0.6 : 1.0;
    SoloEngine.init(name, O.soloTotal || 5);
  });

  // ONLINE SETUP
  on('oGoJoin',    () => { O.setupSub = 'join'; render(); });
  on('oBackSetup', () => { O.setupSub = 'choose'; render(); });
  on('goHome',     () => {
    if (O.ws) O.ws.close();
    if (mode === 'solo') SoloEngine.resetTimers();
    if (mode === 'p2p') P2PEngine.destroy();
    initOnline(); mode = 'home'; render();
  });

  on('oCreate', () => {
    startFullscreenFromGesture();
    const name = (val('oName') || '').trim();
    const addr = (val('oAddr') || '').trim();
    if (!name) { alert('名前を入力してください'); return; }
    O.playerName = name; O.serverAddr = addr;
    wsConnect(addr, () => wsSend({type:'create_room', name}));
  });

  on('oJoin', () => {
    startFullscreenFromGesture();
    const name = (val('oName') || '').trim();
    const addr = (val('oAddr') || '').trim();
    const code = normalizeRoomCode(val('oCode'));
    if (!name) { alert('名前を入力してください'); return; }
    if (!code) { alert('部屋コードを入力してください'); return; }
    O.playerName = name; O.serverAddr = addr;
    wsConnect(addr, () => wsSend({type:'join_room', name, code}));
  });

  // ONLINE LOBBY
  on('oStart', () => wsSend({type:'start_game'}));

  // ONLINE ROLE → NIGHT
  on('oStartNight', () => wsSend({type:'start_night'}));

  // WOLF CHAT
  on('wolfChatDone', () => {
    if (p2pActionLocked()) { render(); return; }
    if (O.wolfChatReady || O.wolfChatReadyPending) return;
    if (!wsSend({type:'wolf_chat_done'})) return;
    if (mode === 'p2p') {
      O.wolfChatReadyPending = true;
      scheduleP2PActionAckWatchdog('wolf_ready');
    } else {
      O.wolfChatReady = true;
    }
    render();
  });
  // wolf テンプレート（target不要）は wolfSend() をグローバル関数として定義
  // wolf テンプレート（target必要）は wolfTplTarget() をグローバル関数として定義
  document.querySelectorAll('.wolf-tpl-send').forEach(btn => {
    btn.addEventListener('click', () => {
      if (p2pActionLocked()) { render(); return; }
      wolfSend(btn.dataset.msg);
    });
  });

  // DISCUSS - テンプレートカテゴリ
  on('tCatNeutral',  () => { O.tplStep = 'msg_neutral';  render(); });
  on('tCatAccuse',   () => { O.tplStep = 'tgt_accuse';   render(); });
  on('tCatDefend',   () => { O.tplStep = 'msg_defend';   render(); });
  on('tCatAgree',    () => { O.tplStep = 'tgt_agree';    render(); });
  on('tCatSeer',      () => { O.tplStep = 'tgt_seer';      render(); });
  on('tCatMedium',    () => { O.tplStep = 'tgt_medium';    render(); });
  on('tCatDoctor',    () => { O.tplStep = 'msg_doctor';    render(); });
  on('tCatNeko',      () => { O.tplStep = 'msg_neko';      render(); });
  on('tCatShared',    () => { O.tplStep = 'msg_shared';    render(); });
  on('tCatFakeCO',    () => { O.tplStep = 'fake_co_pick';  render(); });
  on('fakeSeerCO',    () => { O.tplStep = 'tgt_seer';      render(); });
  on('fakeMediumCO',  () => { O.tplStep = 'tgt_medium';    render(); });
  on('fakeDoctorCO',  () => { O.tplStep = 'msg_doctor';    render(); });
  on('fakeNekoCO',    () => { O.tplStep = 'msg_neko';      render(); });
  on('fakeSharedCO',  () => { O.tplStep = 'msg_shared';    render(); });
  on('tCatQuestion',  () => { O.tplStep = 'msg_question';  render(); });
  on('tCatPressure',  () => { O.tplStep = 'msg_pressure';  render(); });
  on('tCatBack',      () => { O.tplStep = 'cat'; O.tplTarget = null; render(); });

  // DISCUSS - target selection buttons (data-step attribute)
  document.querySelectorAll('[data-step]').forEach(btn => {

      else if (step === 'tgt_agree')  O.tplStep = 'msg_agree';
