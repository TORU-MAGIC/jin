function tplFill(text, name) { return text.replace(/\{n\}/g, name); }

// ========== CPU BRAIN（上級者思考の中央モジュール） ==========
// SoloEngine／P2PEngine 両方の R を扱う（R.players, R.day, R.discRound, R.seerKnown など共通フィールドを使う）
const BRAIN = (function(){
  function rand(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
  function alive(R){ return R.players.filter(p=>p.alive); }
  function others(R, p){ return alive(R).filter(x=>x.name!==p.name); }
  function topAcc(R, pls){ let m=0,b=null; pls.forEach(p=>{const c=R.suspicion?.[p.name]||0;if(c>m){m=c;b=p;}}); return b; }
  function topAccLow(R, pls){ // 疑われていない順
    let m=Infinity,b=null; pls.forEach(p=>{const c=R.suspicion?.[p.name]||0;if(c<m){m=c;b=p;}}); return b;
  }
  function applyPersonaQuirk(R, cpu, candidates){
    const target = personaChooseTarget(R, cpu, candidates, 'speak');
    if (!target) return null;
    const chance = personaActionChance(cpu, 'pushProb', 0.38);
    if (Math.random() <= chance) {
      const bump = getCpuPersona(cpu.name)?.action?.bump || 0.7;
      bumpSuspicion(R, target.name, bump);
      return target;
    }
    return null;
  }


  const ROLE_CLAIM_LIMITS = Object.freeze({ SEER:1, MEDIUM:1, DOCTOR:1, SHARED:2, NEKOMATA:1 });
  const ROLE_LABELS = Object.freeze({
    SEER:'占い師', MEDIUM:'霊媒師', DOCTOR:'騎士', SHARED:'共有者', NEKOMATA:'猫又', VILLAGER:'村人'
  });

  function cpuPrecision(){
    const sharp = typeof window !== 'undefined' && Number.isFinite(window._soloSharp) ? window._soloSharp : 1;
    return Math.max(0.55, Math.min(1.45, sharp));
  }
  function tinyNoise(){ return Math.random() * Math.max(0.04, 0.35 - cpuPrecision() * 0.16); }
  function voteTally(R){
    const tally = {};
    Object.values(R.votes || {}).forEach(name => { if (name) tally[name] = (tally[name] || 0) + 1; });
    return tally;
  }
  function addCase(row, amount, reason){
    if (!row) return;
    row.score += amount;
    if (reason && !row.reasons.includes(reason) && row.reasons.length < 4) row.reasons.push(reason);
  }
  function pickByScore(players, scoreOf){
    return [...(players || [])]
      .map(player => ({ player, score:scoreOf(player) }))
      .sort((a,b) => b.score - a.score || a.player.name.localeCompare(b.player.name))[0]?.player || null;
  }
  function publicRoleGroups(R){
    const live = new Set(alive(R).map(p => p.name));
    const groups = {};
    Object.entries(R.claims || {}).forEach(([name, role]) => {
      if (!live.has(name)) return;
      if (!groups[role]) groups[role] = [];
      groups[role].push(name);
    });
    return groups;
  }
  function claimReliability(R, name, role, groups){
    let score = 0.85;
    const group = groups?.[role] || [];
    const expected = ROLE_CLAIM_LIMITS[role] || 1;
    const history = R.aiClaimHistory?.[name] || [];
    if (new Set(history.map(item => item.role)).size > 1) score -= 1.45;
    if (group.length === expected) score += 0.28;
    if (group.length > expected) score -= 0.32 * (group.length - expected);
    if (role === 'SEER') {
      const co = (R.seerCOs || []).find(item => item.name === name);
      const results = co?.results || [];
      score += Math.min(0.4, results.length * 0.12);
      const seen = {};
      results.forEach(result => {
        if (!result?.target) return;
        if (seen[result.target] !== undefined && seen[result.target] !== result.isWolf) score -= 1.25;
        seen[result.target] = result.isWolf;
      });
    }
    score -= Math.min(0.7, (R.aiContradictions?.[name] || 0) * 0.15);
    return Math.max(-1.2, Math.min(1.8, score));
  }
  function detectDiscussionStance(text){
    const value = String(text || '');
    const explicitTrust = /(人狼|黒)\s*(?:ではない|じゃない|では無|じゃ無)|怪しくない|吊りたくない|疑ってない/.test(value);
    const suspect = /怪しい|疑|黒|人狼|投票|処刑|吊|矛盾|嘘|騙|不自然|沈黙|発言少な|第一候補|優先/.test(value);
    const trust = /信頼|信用|白|村人|安全|守|かば|無実|怪しくない|吊りたくない|村目/.test(value);
    if (trust && (!suspect || explicitTrust)) return 'trust';
    return suspect ? 'suspect' : 'neutral';
  }
  function rememberPublicMessage(R, name, text){
    initR(R);
    const clean = String(text || '').trim();
    if (!clean || !name) return;
    const last = R.aiPublicMessages[R.aiPublicMessages.length - 1];
    if (last && last.name === name && last.text === clean && last.day === R.day && last.round === R.discRound) return;

    const explicit = detectExplicitRoleClaim(clean);
    if (explicit) {
      const history = R.aiClaimHistory[name] || (R.aiClaimHistory[name] = []);
      if (!history.length || history[history.length - 1].role !== explicit) {
        history.push({ role:explicit, day:R.day, round:R.discRound || 1 });
      }
    }

    const kind = detectDiscussionStance(clean);
    const targets = alive(R).filter(player => player.name !== name && clean.includes(player.name)).map(player => player.name);
    if (!R.aiStances[name]) R.aiStances[name] = {};
    targets.forEach(target => {
      if (kind === 'neutral') return;
      const previous = R.aiStances[name][target];
      if (previous && previous.kind !== kind && previous.day === R.day) {
        R.aiContradictions[name] = (R.aiContradictions[name] || 0) + 1;
      }
      R.aiStances[name][target] = { kind, day:R.day, round:R.discRound || 1 };
    });

    R.aiPublicMessages.push({ name, text:clean, day:R.day, round:R.discRound || 1, kind, targets });
    if (R.aiPublicMessages.length > 120) R.aiPublicMessages.splice(0, R.aiPublicMessages.length - 120);
  }
  function buildPublicBoard(R, observer=null){
    initR(R);
    const players = alive(R);
    const byName = new Map(players.map(player => [player.name, {
      player, name:player.name, score:0, reasons:[], blackEvidence:0, whiteEvidence:0,
      claim:R.claims?.[player.name] || '', speech:R.speakCount?.[player.name] || 0
    }]));
    const groups = publicRoleGroups(R);
    const rowOf = name => byName.get(name);

    players.forEach(player => {
      const row = rowOf(player.name);
      const suspicion = R.suspicion?.[player.name] || 0;
      const cover = R.coverCount?.[player.name] || 0;
      const contradictions = R.aiContradictions?.[player.name] || 0;
      if (suspicion) addCase(row, Math.min(2.2, suspicion * 0.32), '発言からの疑い');
      if (cover) addCase(row, -Math.min(1.25, cover * 0.26), '擁護されている');
      if (contradictions) addCase(row, Math.min(2.6, contradictions * 1.15), '発言の整合が崩れた');
      const history = R.aiClaimHistory?.[player.name] || [];
      if (new Set(history.map(item => item.role)).size > 1) addCase(row, 1.7, 'COの内容が変わった');
      if (R.day >= 2 && !row.speech) addCase(row, 0.62, '発言が少ない');
    });

    Object.entries(groups).forEach(([role, names]) => {
      const limit = ROLE_CLAIM_LIMITS[role] || 1;
      if (names.length > limit) {
        names.forEach(name => addCase(rowOf(name), 0.95 + (names.length - limit) * 0.28, `${ROLE_LABELS[role] || role}COが重複`));
      } else if (names.length === 1 && role !== 'VILLAGER') {
        addCase(rowOf(names[0]), -0.12, `単独の${ROLE_LABELS[role] || role}CO`);
      }
    });

    Object.entries(R.aiStances || {}).forEach(([speaker, stances]) => {
      Object.entries(stances || {}).forEach(([target, stance]) => {
        const row = rowOf(target);
        if (!row || !stance) return;
        if (stance.kind === 'suspect') addCase(row, 0.26, `${speaker}の疑い`);
        if (stance.kind === 'trust') addCase(row, -0.18, `${speaker}の信用`);
      });
    });
    Object.entries(R.aiStances || {}).forEach(([from, stances]) => {
      Object.entries(stances || {}).forEach(([to, stance]) => {
        if (stance.kind !== 'trust' || R.aiStances?.[to]?.[from]?.kind !== 'trust') return;
        addCase(rowOf(from), 0.75, '相互にかばい合い');
        addCase(rowOf(to), 0.75, '相互にかばい合い');
      });
    });

    const reportsByTarget = {};
    (R.seerCOs || []).forEach(co => {
      const speaker = players.find(player => player.name === co.name);
      if (!speaker) return;
      const reliability = claimReliability(R, co.name, 'SEER', groups);
      (co.results || []).forEach(result => {
        const row = rowOf(result.target);
        if (!row) return;
        if (!reportsByTarget[result.target]) reportsByTarget[result.target] = { black:[], white:[] };
        if (result.isWolf) {
          const amount = Math.max(0.45, 1.45 + reliability * 0.7);
          row.blackEvidence += amount;
          reportsByTarget[result.target].black.push(co.name);
          addCase(row, amount, `${co.name}の黒結果`);
        } else {
          const amount = Math.max(0.35, 0.95 + reliability * 0.45);
          row.whiteEvidence += amount;
          reportsByTarget[result.target].white.push(co.name);
          addCase(row, -amount, `${co.name}の白結果`);
        }
      });
    });
    Object.values(reportsByTarget).forEach(report => {
      if (!report.black.length || !report.white.length) return;
      [...report.black, ...report.white].forEach(name => addCase(rowOf(name), 0.9, '占い結果が対立'));
    });

    const tally = voteTally(R);
    Object.entries(tally).forEach(([name, count]) => {
      if (count >= 2) addCase(rowOf(name), Math.min(0.55, count * 0.12), '票が集まっている');
    });
    Object.entries(R.votes || {}).forEach(([voter, target]) => {
      if (R.aiStances?.[voter]?.[target]?.kind === 'trust') addCase(rowOf(voter), 1.05, '信用先への投票');
    });
    (R.voteHistory || []).forEach(history => {
      const preliminary = history.preVotes || history.pre_votes || {};
      const finalVotes = history.votes || {};
      Object.entries(preliminary).forEach(([voter, target]) => {
        if (!target || !finalVotes[voter] || finalVotes[voter] === target) return;
        addCase(rowOf(voter), 0.9, '仮投票を変更');
      });
    });

    const ranking = [...byName.values()].sort((a,b) => b.score - a.score || a.name.localeCompare(b.name));
    const trusted = [...byName.values()].sort((a,b) => a.score - b.score || a.name.localeCompare(b.name))[0] || null;
    return { byName, ranking, trusted, groups, tally, observer:observer?.name || '' };
  }
  function shortEvidence(row){
    if (!row) return '発言と投票のつながりが薄い';
    return row.reasons.find(reason => !['発言からの疑い', '票が集まっている'].includes(reason))
      || row.reasons[0] || '発言と投票のつながりが薄い';
  }
  function chooseStrategicVoteTarget(R, cpu, candidates=null){
    initR(R);
    const pool = (candidates || others(R, cpu)).filter(player => player && player.alive && player.name !== cpu.name);
    if (!pool.length) return null;
    const board = buildPublicBoard(R, cpu);
    const ownBlack = cpu.role === 'SEER'
      ? pool.filter(player => R.seerKnown?.[player.name] === true) : [];
    if (ownBlack.length) return pickByScore(ownBlack, player => (board.byName.get(player.name)?.score || 0) + 4 + tinyNoise());

    const isWolf = cpu.role === 'WEREWOLF';
    const isMad = cpu.role === 'MADMAN' || cpu.role === 'MADMAN_ACTIVE';
    const wolfNames = isWolf ? new Set(alive(R).filter(player => player.role === 'WEREWOLF').map(player => player.name)) : new Set();
    const legal = pool.filter(player => !wolfNames.has(player.name));
    if (!legal.length) return null;

    const publicLeader = [...legal].sort((a,b) => (board.tally[b.name] || 0) - (board.tally[a.name] || 0) || a.name.localeCompare(b.name))[0];
    if (isMad) {
      return pickByScore(legal, player => {
        const row = board.byName.get(player.name);
        return -(row?.score || 0) + (row?.claim ? 0.22 : 0) - (board.tally[player.name] || 0) * 0.08 + tinyNoise();
      });
    }
    if (isWolf) {
      const plan = R.wolfFakeSeerPlan;
      return pickByScore(legal, player => {
        const row = board.byName.get(player.name);
        let score = (row?.score || 0) * 0.9 + (board.tally[player.name] || 0) * 0.48;
        if (plan?.fakeTarget === player.name) score += 1.45;
        if (row?.claim === 'SEER' || row?.claim === 'MEDIUM') score += Math.max(0, row.score) * 0.25;
        if ((row?.score || 0) < -0.5) score -= 0.7;
        return score + tinyNoise();
      });
    }
    return pickByScore(legal, player => {
      const row = board.byName.get(player.name);
      let score = (row?.score || 0) + Math.max(0, row?.blackEvidence || 0) * 1.25 - Math.max(0, row?.whiteEvidence || 0) * 1.1;
      score += (board.tally[player.name] || 0) * 0.28;
      if (publicLeader?.name === player.name && (row?.score || 0) >= ((board.ranking[0]?.score || 0) - 0.7)) score += 0.72;
      return score + tinyNoise();
    });
  }
  function buildDiscussionPlan(R, cpu){
    const board = buildPublicBoard(R, cpu);
    const candidates = others(R, cpu);
    const target = chooseStrategicVoteTarget(R, cpu, candidates);
    if (!target) return null;
    const row = board.byName.get(target.name);
    const second = board.ranking.find(item => item.name !== cpu.name && item.name !== target.name && candidates.some(player => player.name === item.name));
    const confidence = Math.max(0.28, Math.min(0.95, 0.52 + ((row?.score || 0) - (second?.score || 0)) / 4));
    const evidence = shortEvidence(row);

    if (cpu.role === 'SHARED') {
      return {
        kind:'lead', target:target.name, confidence:Math.max(0.55, confidence),
        text:`共有として、今日は${target.name}さんを第一候補に置きます。${evidence}。反対なら別候補と理由をセットで出してください。`
      };
    }
    if (cpu.role === 'WEREWOLF') {
      const wolves = alive(R).filter(player => player.role === 'WEREWOLF' && player.name !== cpu.name);
      const exposedMate = wolves.map(player => ({ player, row:board.byName.get(player.name) }))
        .sort((a,b) => (b.row?.score || 0) - (a.row?.score || 0))[0];
      if (exposedMate?.row && exposedMate.row.score >= (row?.score || 0) - 0.15) {
        return {
          kind:'redirect', target:target.name, confidence:Math.max(0.56, confidence),
          text:`${exposedMate.player.name}さんを急いで吊る根拠はまだ弱いです。先に${target.name}さんの${evidence}を確認したいです。`
        };
      }
    }
    if (cpu.role === 'MADMAN' || cpu.role === 'MADMAN_ACTIVE') {
      return {
        kind:'accuse', target:target.name, confidence,
        text:`今日は${target.name}さんを優先して見たいです。${evidence}。ここを残す場合の白要素を、誰か具体的に出してください。`
      };
    }
    if ((row?.score || 0) >= 1.05) {
      return {
        kind:'accuse', target:target.name, confidence,
        text:`${target.name}さんを第一候補にします。${evidence}。この点が説明できないなら、投票先をここに寄せたいです。`
      };
    }
    const compare = second ? ` ${second.name}さんとの比較で、どちらを残すべきかも聞きたいです。` : '';
    return {
      kind:'question', target:target.name, confidence,
      text:`いまは${target.name}さんの発言を確認したいです。${evidence}。${compare}`.trim()
    };
  }
  function maybeUseBoardPlan(R, cpu, minConfidence=0.55){
    const plan = buildDiscussionPlan(R, cpu);
    if (!plan) return '';
    const round = R.discRound || 1;
    const required = minConfidence + (round === 1 ? 0.08 : 0);
    if (plan.confidence < required) return '';
    const chance = round >= 2 ? 0.94 : 0.74;
    if (Math.random() > chance) return '';
    R.aiLastPlan[cpu.name] = plan;
    if (plan.target && plan.kind !== 'question') bumpSuspicion(R, plan.target, 0.38);
    return plan.text;
  }


  function chooseSeerNightTarget(R, seer, al){
    initR(R);
    const pool = (al || alive(R)).filter(player => player && player.alive && player.name !== seer.name);
    if (!pool.length) return null;
    const known = R.seerKnown || {};
    const candidates = pool.filter(player => known[player.name] === undefined);
    const unknowns = candidates.length ? candidates : pool;
    const board = buildPublicBoard(R, seer);
    const groups = board.groups;
    return pickByScore(unknowns, player => {
      const row = board.byName.get(player.name);
      const claim = R.claims?.[player.name] || '';
      const contested = claim && (groups[claim] || []).length > (ROLE_CLAIM_LIMITS[claim] || 1) ? 1.0 : 0;
      const quiet = Math.max(0, 2 - (R.speakCount?.[player.name] || 0)) * 0.24;
      return (row?.score || 0) * 1.18 + contested + quiet + tinyNoise();
    });
  }


  function chooseDoctorGuardTarget(R, doc, al){
    initR(R);
    const pool = (al || alive(R)).filter(player => player && player.alive && player.name !== doc.name && player.name !== R.lastDoctorTarget);
    if (!pool.length) return null;
    const board = buildPublicBoard(R, doc);
    return pickByScore(pool, player => {
      const row = board.byName.get(player.name);
      const claim = R.claims?.[player.name] || '';
      const reliability = claim ? claimReliability(R, player.name, claim, board.groups) : 0;
      const roleValue = claim === 'SEER' ? 3.4 : claim === 'MEDIUM' ? 2.25 : claim === 'SHARED' ? 1.85 : claim === 'NEKOMATA' ? 0.8 : 0;
      const publicTrust = Math.max(0, -(row?.score || 0)) * 0.58;
      const influence = (R.speakCount?.[player.name] || 0) * 0.14 + (R.coverCount?.[player.name] || 0) * 0.48;
      return roleValue * Math.max(0.28, reliability) + publicTrust + influence + tinyNoise();
    });
  }

  // ── R 初期化（メモリ追加） ─────────────────────────────
  function initR(R){
    if (!R.suspicion) R.suspicion = {};
    if (!R.claims) R.claims = {};            // {name: 'SEER'|'DOCTOR'|'MEDIUM'} (本人CO履歴)
    if (!R.seerCOs) R.seerCOs = [];          // [{name, day, target?, isWolf?}]
    if (!R.mediumCOs) R.mediumCOs = [];      // [{name, day, target?, role?}]
    if (!R.docCOs) R.docCOs = [];
    if (!R.coverCount) R.coverCount = {};    // {name: 何回かばわれたか}
    if (!R.lastSpoke) R.lastSpoke = {};      // {name: 直近の発言タイプ}
    if (!R.speakCount) R.speakCount = {};    // {name: 発言数}
    if (!R.discThisRound) R.discThisRound = new Set();
    if (!R.wolfFakeSeerPlan) R.wolfFakeSeerPlan = null; // 人狼チームの騙り計画 {fakerName, fakeTarget}
    if (!R.voteHistory) R.voteHistory = [];  // [{day, votes:{voter:target}}]
    if (!R.preVotes) R.preVotes = {};
    if (!R.preVoteChanges) R.preVoteChanges = {};
    if (!R.aiPublicMessages) R.aiPublicMessages = [];
    if (!R.aiStances) R.aiStances = {};
    if (!R.aiContradictions) R.aiContradictions = {};
    if (!R.aiClaimHistory) R.aiClaimHistory = {};
    if (!R.aiLastPlan) R.aiLastPlan = {};
    if (!R.aiVotePlans) R.aiVotePlans = {};
    // 旧 accuCount との互換: suspicion を主用に
    if (!R.accuCount) R.accuCount = R.suspicion;
  }

  function bumpSuspicion(R, name, w=1){
    if (!name) return;
    R.suspicion[name] = (R.suspicion[name]||0) + w;
    R.accuCount[name] = R.suspicion[name]; // alias 互換
  }
  function bumpCover(R, name, w=1){
    if (!name) return;
    R.coverCount[name] = (R.coverCount[name]||0) + w;
    R.suspicion[name] = Math.max(0, (R.suspicion[name]||0) - w*0.6);
    R.accuCount[name] = R.suspicion[name];
  }

  // ── 発言からCO・結果を抽出（メッセージ解析） ───────────
  function parseClaim(R, name, text){
    if (!text) return;
    initR(R);
    const hasNegateWolf = /(人狼|黒)\s*(?:ではない|じゃない|では無|じゃ無)/.test(text)
                       || /人狼じゃ(ない|なさそう)/.test(text);

    const explicitClaim = detectExplicitRoleClaim(text);
    if (explicitClaim === 'SEER') {
      if (!R.claims[name]) R.claims[name] = 'SEER';
      if (!R.seerCOs.find(c=>c.name===name)) R.seerCOs.push({name, day:R.day, results:[]});
    } else if (explicitClaim === 'DOCTOR') {
      if (!R.claims[name]) R.claims[name] = 'DOCTOR';
      if (!R.docCOs.find(c=>c.name===name)) R.docCOs.push({name, day:R.day});
    } else if (explicitClaim === 'MEDIUM') {
      if (!R.claims[name]) R.claims[name] = 'MEDIUM';
      if (!R.mediumCOs.find(c=>c.name===name)) R.mediumCOs.push({name, day:R.day, results:[]});
    } else if (explicitClaim === 'NEKOMATA') {
      if (!R.claims[name]) R.claims[name] = 'NEKOMATA';
    } else if (explicitClaim === 'SHARED') {
      if (!R.claims[name]) R.claims[name] = 'SHARED';
    }

    // 占い結果は CO 済 or 「占い」キーワード含むときだけ解析（否定文除外）
    const isSeerContext = R.claims[name]==='SEER' || /占い/.test(text);
    if (isSeerContext && !hasNegateWolf) {
      // 黒判定: 「○○さんは人狼」「○○さんに黒」「○○さんを占って黒」など
      const wolfM = text.match(/([^\s、。を]+?)さん(?:は|を|に|へ).{0,8}?(人狼(?:でした|です|だった)?|黒(?:でした|判定|です)?)/);
      if (wolfM) {
        const tgt = wolfM[1];
        const co = R.seerCOs.find(c=>c.name===name);
        if (co && !co.results.find(r=>r.target===tgt && r.day===R.day)) {
          co.results.push({day:R.day, target:tgt, isWolf:true});
        }
        bumpSuspicion(R, tgt, 3);
      } else {
        // 白判定: 「○○さんは白でした」「○○さんは村人陣営」など
        const safeM = text.match(/([^\s、。を]+?)さん(?:は|を|に|へ).{0,8}?(白(?:でした|です|判定)|村人陣営|村人でした|安全(?:でした|です)?|信頼(?:できます)?)/);
        if (safeM) {
          const tgt = safeM[1];
          const co = R.seerCOs.find(c=>c.name===name);
          if (co && !co.results.find(r=>r.target===tgt && r.day===R.day)) {
            co.results.push({day:R.day, target:tgt, isWolf:false});
          }
          bumpCover(R, tgt, 1.5);
        }
      }
    }

    // 霊媒結果
    if (R.claims[name]==='MEDIUM' && !hasNegateWolf) {
      const wolfM = text.match(/([^\s、。を]+?)さん.{0,8}?(人狼(?:でした|です)|黒(?:でした|判定)?)/);
      if (wolfM) {
        const tgt = wolfM[1];
        const co = R.mediumCOs.find(c=>c.name===name);
        if (co && !co.results.find(r=>r.target===tgt)) co.results.push({day:R.day, target:tgt, role:'WEREWOLF'});
      }
    }

    // かばう系の検出
    const coverM = text.match(/([^\s、。を]+?)さん(?:は|を).{0,12}?(人狼(?:ではない|じゃない)|怪しくない|信頼でき|白だと思|処刑(?:するの)?は反対|吊りたくない|村人っぽい|村目線|無実|疑う(?:のは|べきじゃ)|疑ってない)/);
    if (coverM) bumpCover(R, coverM[1], 1);

    // 疑う発言（否定文・かばう文は除外）
    if (!hasNegateWolf && !coverM) {
      alive(R).forEach(p=>{
        if (p.name===name) return;
        if (text.includes(p.name) && /怪しい|疑|黒|人狼|投票|処刑|吊|矛盾|嘘|騙|不自然|沈黙|発言少な/.test(text)) {
          bumpSuspicion(R, p.name, 1);
        }
      });
    }
    R.speakCount[name] = (R.speakCount[name]||0)+1;
    rememberPublicMessage(R, name, text);
  }

  // ── 人狼チームの「騙り占い師」計画を立てる ─────────────
  function planWolfFakeSeer(R){
    if (R.wolfFakeSeerPlan) return;
    const wolves = alive(R).filter(p=>p.role==='WEREWOLF' && p.isCpu);
    if (!wolves.length) return;
    // 大規模戦（10人以上）ならパーソナリティ問わず騙りを行う確率上昇
    const total = R.players.length;
    let tryProb = total >= 10 ? 0.85 : total >= 7 ? 0.55 : 0.30;
    tryProb = Math.min(0.95, tryProb * (window._soloSharp || 1)); // 難易度で騙り頻度を調整
    if (Math.random() > tryProb) return;
    // 騙り役は bluffer か aggressive がベスト
    const faker = wolves.find(w=>w.personality==='bluffer') || wolves.find(w=>w.personality==='aggressive') || rand(wolves);
    // 偽占い対象は村人寄りの一人
    const vill = alive(R).filter(p=>p.role!=='WEREWOLF' && p.name!==faker.name);
    if (!vill.length) return;
    const board = buildPublicBoard(R, faker);
    const personaTarget = personaChooseTarget(R, faker, vill, 'fake_claim');
    const fakeTarget = pickByScore(vill, player => {
      const row = board.byName.get(player.name);
      const personaBonus = personaTarget?.name === player.name ? 0.35 : 0;
      return -(row?.score || 0) * 0.78 + (R.coverCount?.[player.name] || 0) * 0.35 + personaBonus + tinyNoise();
    }) || rand(vill);
    R.wolfFakeSeerPlan = { fakerName: faker.name, fakeTarget: fakeTarget.name };
  }

  // ── 発言生成（メイン） ─────────────────────────────────
  function speak(R, cpu){
    initR(R);
    delete R.aiLastPlan[cpu.name];
    const pers = cpu.personality || 'logical';
    const day = R.day;
    const round = R.discRound || 1;
    const acc = R.suspicion[cpu.name]||0;
    const wasAcc = acc > 0;
    const ot = others(R, cpu);
    const al = alive(R);
    applyPersonaQuirk(R, cpu, ot);

    // 寡黙キャラも、根拠がそろった局面では必要な一言を出す。
    if (pers==='quiet' && Math.random()<0.28) {
      const boardLine = maybeUseBoardPlan(R, cpu, 0.62);
      if (boardLine) return personagizeSpeech(R, cpu, boardLine);
      return personagizeSpeech(R, cpu, rand(TPL.neutral));
    }

    let text = '';

    // ── 人狼・狂人ロジック ──
    if (isWolfSideRole(cpu.role)) {
      text = speakWolfSide(R, cpu, pers, round, wasAcc, ot);
    }
    // ── 占い師ロジック ──
    else if (cpu.role==='SEER') {
      text = speakSeer(R, cpu, pers, day, round, wasAcc, ot);
    }
    // ── 霊媒師ロジック ──
    else if (cpu.role==='MEDIUM') {
      text = speakMedium(R, cpu, pers, day, round, wasAcc, ot);
    }
    // ── 騎士ロジック ──
    else if (cpu.role==='DOCTOR') {
      text = speakDoctor(R, cpu, pers, day, round, wasAcc, ot);
    }
    // ── 共有者ロジック ──
    else if (cpu.role==='SHARED') {
      text = speakShared(R, cpu, pers, day, round, wasAcc, ot);
    }
    // ── 猫又ロジック ──
    else if (cpu.role==='NEKOMATA') {
      text = speakNekomata(R, cpu, pers, day, round, wasAcc, ot);
    }
    // ── 村人ロジック ──
    else {
      text = speakVillager(R, cpu, pers, day, round, wasAcc, ot);
    }
    return personagizeSpeech(R, cpu, text);
  }

  // === 人狼／狂人 ===
  function speakWolfSide(R, cpu, pers, round, wasAcc, ot){
    const isMad = cpu.role==='MADMAN' || cpu.role==='MADMAN_ACTIVE';
    const myTeam = isMad ? [cpu.name] : alive(R).filter(p=>p.role==='WEREWOLF').map(p=>p.name);
    const vill = ot.filter(p=>!myTeam.includes(p.name));

    // 1) 自分が疑われていたら、まず防御＋他者誘導
    if (wasAcc && Math.random()<0.7) {
      if (vill.length && Math.random()<0.5) {
        // 反撃: 別の村人を疑う方向に誘導
        const tgt = topAccLow(R, vill) || rand(vill);
        bumpSuspicion(R, tgt.name, 1);
        return tplFill(rand(TPL.accuse), tgt.name);
      }
      return rand(TPL.defend);
    }

    if (cpu.role==='MADMAN_ACTIVE' && R.day >= 2 && Math.random() < 0.18) {
      return '洗脳されたCOです。投票が自分の意思と違う先へ操作されました。誰にやられたかは分かりません。';
    }

    // 2) 騙り占い師として動く？
    planWolfFakeSeer(R);
    if (R.wolfFakeSeerPlan && R.wolfFakeSeerPlan.fakerName===cpu.name) {
      // 既に占い師COしているか？
      if (!R.claims[cpu.name]) {
        R.claims[cpu.name] = 'SEER';
        R.seerCOs.push({name:cpu.name, day:R.day, results:[]});
        // 初日CO: 結果なし。2日目以降: 偽の黒判定を真の村人に当てる
        if (R.day <= 1) return rand(TPL.co_seer_blank);
        const fakeTgt = R.wolfFakeSeerPlan.fakeTarget;
        const co = R.seerCOs.find(c=>c.name===cpu.name);
        if (co) co.results.push({day:R.day, target:fakeTgt, isWolf:true});
        bumpSuspicion(R, fakeTgt, 3);
        return tplFill(rand(TPL.co_seer_wolf), fakeTgt);
      }
      // 既にCO済 → 続きの偽結果や同調
      if (R.day >= 2 && Math.random()<0.45) {
        const fakeTgt = R.wolfFakeSeerPlan.fakeTarget;
        return tplFill(rand(TPL.co_seer_wolf), fakeTgt);
      }
    }

    // 3) 仲間の人狼が疑われていたらかばう
    const teamMates = alive(R).filter(p=>!isMad && p.role==='WEREWOLF' && p.name!==cpu.name);
    const threatenedMate = teamMates.find(m=>(R.suspicion[m.name]||0) >= 2);
    if (threatenedMate && Math.random()<0.55) {
      bumpCover(R, threatenedMate.name, 1);
      return tplFill(rand(TPL.cover), threatenedMate.name);
    }

    // 4) 公開されている占いCOには、結果や発言の筋を見て反論する。
    const visibleSeer = (R.seerCOs || []).find(c => c.name !== cpu.name && alive(R).some(p => p.name === c.name));
    if (visibleSeer && Math.random()<0.16) {
      bumpSuspicion(R, visibleSeer.name, 0.7);
      return `${visibleSeer.name}さんの占いは、結果と今日の発言をセットで見直したいです。`;
    }

    const boardLine = maybeUseBoardPlan(R, cpu, 0.48);
    if (boardLine) return boardLine;

    // 5) 一般的に村人を疑う（巧妙に）
    if (vill.length) {
      const aggrProb = pers==='aggressive' ? 0.78 : pers==='bluffer' ? 0.65 : 0.55;
      if (Math.random() < aggrProb) {
        // 既に疑われている人にさらに疑いを乗せる（自然な多数派形成）
        const tgt = topAcc(R, vill) || rand(vill);
        bumpSuspicion(R, tgt.name, 1);
        // 理由付き
        const flavor = Math.random();
        if (flavor<0.25) return tplFill(rand(TPL.reason_silent), tgt.name);
        if (flavor<0.5)  return tplFill(rand(TPL.reason_pivot), tgt.name);
        if (flavor<0.7)  return tplFill(rand(TPL.vote_decl), tgt.name);
        return tplFill(rand(TPL.accuse), tgt.name);
      }
    }

    // 6) たまに白の村人をかばって誠実そうに見せる
    if (vill.length && Math.random()<0.20) {
      const tgt = topAccLow(R, vill);
      if (tgt) { bumpCover(R, tgt.name, 1); return tplFill(rand(TPL.cover), tgt.name); }
    }

    return rand([...TPL.neutral, ...TPL.question]);
  }

  // === 占い師 ===
  function speakSeer(R, cpu, pers, day, round, wasAcc, ot){
    // 自分以外の占いCOがあれば、真占い師には対抗が見えている。
    const fakeSeerExists = (R.seerCOs || []).some(c => c.name !== cpu.name && alive(R).some(p => p.name === c.name));

    // 既に自分でCO済か
    const alreadyCO = R.claims[cpu.name]==='SEER';

    const known = Object.entries(R.seerKnown||{});
    const wolfHit = known.find(([n,iw])=>iw===true);
    const safeHit = known.find(([n,iw])=>iw===false);
    const blackPressure = !!wolfHit && (
      fakeSeerExists || wasAcc || day >= 2 || round >= 2 || Math.random() < 0.86
    );

    // CO戦略
    const totalPlayers = R.players.length;
    const shouldCO = (
      fakeSeerExists ||                  // 騙り対抗COは即時
      blackPressure ||                    // 黒を引いたら基本CO。ただし少しだけ伏せる駆け引きあり
      (day >= 2 && known.length) ||        // 2日目以降は基本CO
      (pers==='aggressive' && round===1) || // 攻撃型は初日CO
      (totalPlayers >= 10 && day >= 1)     // 大規模戦は初日CO推奨
    );

    if (shouldCO && !alreadyCO) {
      R.claims[cpu.name] = 'SEER';
      if (!R.seerCOs.find(c=>c.name===cpu.name)) R.seerCOs.push({name:cpu.name, day, results:[]});
      // 結果がある場合
      if (wolfHit && blackPressure) {
        const co = R.seerCOs.find(c=>c.name===cpu.name);
        if (co) co.results.push({day, target:wolfHit[0], isWolf:true});
        bumpSuspicion(R, wolfHit[0], 4);
        return tplFill(rand(TPL.co_seer_wolf), wolfHit[0]);
      }
      if (safeHit) {
        const safeUnderPressure = (R.suspicion?.[safeHit[0]]||0) >= 2;
        const revealSafe = fakeSeerExists || day >= 2 || wasAcc || safeUnderPressure || Math.random() < 0.35;
        if (!revealSafe) return rand(TPL.seer_hold);
        const co = R.seerCOs.find(c=>c.name===cpu.name);
        if (co) co.results.push({day, target:safeHit[0], isWolf:false});
        bumpCover(R, safeHit[0], 2);
        return tplFill(rand(TPL.co_seer_safe), safeHit[0]);
      }
      return rand(TPL.co_seer_blank);
    }

    // CO済の場合は時々追加情報を出す
    if (alreadyCO) {
      // まだ公開していない結果があれば公開
      const myCO = R.seerCOs.find(c=>c.name===cpu.name);
      const reportedTargets = new Set((myCO?.results||[]).map(r=>r.target));
      const unreported = known.filter(([n])=>!reportedTargets.has(n));
      if (unreported.length) {
        const black = unreported.find(([,iw])=>iw);
        const [tgt, iw] = black || rand(unreported);
        const targetUnderPressure = (R.suspicion?.[tgt]||0) >= 2;
        const reveal = iw
          ? (day >= 2 || round >= 2 || wasAcc || Math.random() < 0.88)
          : (targetUnderPressure || day >= 2 || Math.random() < 0.48);
        if (!reveal) return rand(TPL.seer_hold);
        if (myCO) myCO.results.push({day, target:tgt, isWolf:iw});
        if (iw) { bumpSuspicion(R, tgt, 3); return tplFill(rand(TPL.co_seer_wolf), tgt); }
        bumpCover(R, tgt, 1.5); return tplFill(rand(TPL.co_seer_safe), tgt);
      }
    }

    // CO してない or 報告すべき情報がない → 公開情報から村目線の推理を行う
    const boardLine = maybeUseBoardPlan(R, cpu, 0.62);
    if (boardLine) return boardLine;
    if (known.length && !alreadyCO && Math.random()<0.25) return rand(TPL.seer_hold);
    if (wasAcc) return rand(TPL.defend);
    if (ot.length && Math.random()<0.35) {
      const tgt = topAcc(R, ot) || rand(ot);
      return tplFill(rand(TPL.accuse), tgt.name);
    }
    return rand([...TPL.neutral, ...TPL.ask_co]);
  }

  // === 霊媒師 ===
  function speakMedium(R, cpu, pers, day, round, wasAcc, ot){
    const alreadyCO = R.claims[cpu.name]==='MEDIUM';
    // 自分以外の霊媒COがあれば、対抗として情報を出す。
    const fakeMediumExists = (R.mediumCOs || []).some(c => c.name !== cpu.name && alive(R).some(p => p.name === c.name));
    // 処刑があってかつ霊媒結果を持っていたら CO推奨
    const hasResult = R.lastExecuted && R.lastExecutedRole;
    const shouldCO = fakeMediumExists || (hasResult && day>=2) || (pers==='aggressive' && hasResult);

    if (shouldCO && !alreadyCO) {
      R.claims[cpu.name] = 'MEDIUM';
      R.mediumCOs.push({name:cpu.name, day, results:[]});
      if (hasResult) {
        const isWolf = R.lastExecutedRole==='WEREWOLF';
        const co = R.mediumCOs.find(c=>c.name===cpu.name);
        if (co) co.results.push({day, target:R.lastExecuted, role:R.lastExecutedRole});
        if (isWolf) return tplFill(rand(TPL.medium_result_wolf), R.lastExecuted);
        return tplFill(rand(TPL.medium_result_safe), R.lastExecuted);
      }
      return rand(TPL.co_medium);
    }
    // 通常は隠れる。ただし根拠がある局面では村目線の整理をする。
    const boardLine = maybeUseBoardPlan(R, cpu, 0.62);
    if (boardLine) return boardLine;
    if (wasAcc) return rand(TPL.defend);
    if (ot.length && Math.random()<0.35) {
      const tgt = topAcc(R, ot) || rand(ot);
      return tplFill(rand(TPL.accuse), tgt.name);
    }
    return rand([...TPL.neutral, ...TPL.ask_co]);
  }

  // === 騎士 ===

  function speakDoctor(R, cpu, pers, day, round, wasAcc, ot){
    const alreadyCO = R.claims[cpu.name]==='DOCTOR';
    // 騎士は基本隠れる。疑われたら防御COする。
    if (wasAcc && (R.suspicion[cpu.name]||0) >= 2 && !alreadyCO && Math.random()<0.55) {
      R.claims[cpu.name] = 'DOCTOR';
      R.docCOs.push({name:cpu.name, day});
      return rand(TPL.co_doctor);
    }
    if (pers==='aggressive' && day>=2 && !alreadyCO && Math.random()<0.20) {
      R.claims[cpu.name] = 'DOCTOR';
      R.docCOs.push({name:cpu.name, day});
      return rand(TPL.co_doctor);
    }
    if (wasAcc) return rand(TPL.defend);

    const boardLine = maybeUseBoardPlan(R, cpu, 0.58);
    if (boardLine) return boardLine;

    // 占い師COは真偽を決め打ちせず、公開結果と発言の整合で守る価値を測る。
    const board = buildPublicBoard(R, cpu);
    const visibleSeer = (R.seerCOs || [])
      .filter(c => alive(R).some(p => p.name === c.name))
      .sort((a,b) => claimReliability(R, b.name, 'SEER', board.groups) - claimReliability(R, a.name, 'SEER', board.groups))[0];
    if (visibleSeer && Math.random()<0.30) {
      bumpCover(R, visibleSeer.name, 0.7);
      return `${visibleSeer.name}さんの占い結果は、今日の議論で一度は軸にしたいです。`;
    }
    if (ot.length && Math.random()<0.32) {
      const tgt = chooseStrategicVoteTarget(R, cpu, ot) || topAcc(R, ot) || rand(ot);
      return tplFill(rand(TPL.accuse), tgt.name);
    }
    return rand([...TPL.neutral, ...TPL.question]);
  }

  // === 共有者 ===

  function speakShared(R, cpu, pers, day, round, wasAcc, ot){
    const alreadyCO = R.claims[cpu.name]==='SHARED';
    const shouldCO = !alreadyCO && (wasAcc || day>=2 || round>=2 || Math.random()<0.42);
    if (shouldCO) {
      R.claims[cpu.name] = 'SHARED';
      return rand(TPL.co_shared);
    }

    const boardLine = maybeUseBoardPlan(R, cpu, 0.34);
    if (boardLine) return boardLine;

    const board = buildPublicBoard(R, cpu);
    const top = chooseStrategicVoteTarget(R, cpu, ot);
    if (top && (board.byName.get(top.name)?.score || 0) > 0.55) {
      bumpSuspicion(R, top.name, 0.42);
      return `${top.name}さんを第一候補で見ています。${shortEvidence(board.byName.get(top.name))}を、投票前に説明してください。`;
    }
    if (wasAcc) return rand(TPL.defend);
    return rand([
      '共有視点では、疑い先を広げすぎず上位候補を絞りたいです 🤝',
      '今日は発言量より、誰が誰を疑ったかの流れを重視します 🤝',
      '投票前に、怪しい位置と信用できる位置を分けて整理しましょう 🤝',
      ...TPL.question
    ]);
  }

  // === 猫又 ===
  function speakNekomata(R, cpu, pers, day, round, wasAcc, ot){
    // 普通の村人として振る舞う。終盤たまに脅し気味に。
    if (wasAcc && day>=3 && Math.random()<0.35) {
      return '私を処刑するなら覚悟しろ、道連れがいる 🐱⚡';
    }
    return speakVillager(R, cpu, pers, day, round, wasAcc, ot);
  }

  // === 村人 ===
  function speakVillager(R, cpu, pers, day, round, wasAcc, ot){
    if (wasAcc) {
      if (Math.random()<0.65) return rand(TPL.defend);
    }
    const boardLine = maybeUseBoardPlan(R, cpu, pers==='analytical' ? 0.43 : 0.55);
    if (boardLine) return boardLine;
    // 直近の占い情報があれば、それに基づいて投票を呼びかけ
    const trueSeers = R.seerCOs.filter(c=>{
      const p = R.players.find(x=>x.name===c.name);
      return p && p.alive;
    });
    if (trueSeers.length && Math.random()<0.30) {
      // 黒判定された人がいればそれに投票宣言
      const co = trueSeers[0];
      const blackResult = (co.results||[]).find(r=>r.isWolf);
      if (blackResult) {
        bumpSuspicion(R, blackResult.target, 2);
        return tplFill(rand(TPL.vote_decl), blackResult.target);
      }
    }
    // パーソナリティ別ロジック
    if (pers==='analytical' && Math.random()<0.45) {
      // 矛盾・パターン指摘
      const tgt = topAcc(R, ot);
      if (tgt) {
        const flavor = Math.random();
        if (flavor<0.4) return tplFill(rand(TPL.reason_pivot), tgt.name);
        if (flavor<0.7) return tplFill(rand(TPL.reason_silent), tgt.name);
        return tplFill(rand(TPL.reason_defensive), tgt.name);
      }
    }
    if (pers==='follower' && Math.random()<0.55) {
      // 多数派に同調
      const tgt = topAcc(R, ot);
      if (tgt) {
        if (Math.random()<0.5) return tplFill(rand(TPL.agree), tgt.name);
        return tplFill(rand(TPL.support), tgt.name);
      }
    }
    if (pers==='cautious') {
      // 慎重派: かばう寄り
      if (Math.random()<0.40) {
        const safest = topAccLow(R, ot);
        if (safest) { bumpCover(R, safest.name, 1); return tplFill(rand(TPL.cover), safest.name); }
      }
      if (Math.random()<0.30) return rand(TPL.disagree);
      return rand([...TPL.neutral, ...TPL.question]);
    }
    if (pers==='aggressive') {
      const tgt = topAcc(R, ot) || rand(ot);
      if (tgt) { bumpSuspicion(R, tgt.name, 1); return tplFill(rand(TPL.accuse), tgt.name); }
      return rand(TPL.pressure);
    }
    if (pers==='talkative') {
      // よく喋る: いろんなテンプレを混ぜる
      const pool = [...TPL.neutral, ...TPL.question, ...TPL.ask_co];
      if (ot.length && Math.random()<0.45) {
        const tgt = topAcc(R, ot) || rand(ot);
        bumpSuspicion(R, tgt.name, 0.5);
        return tplFill(rand(TPL.accuse), tgt.name);
      }
      return rand(pool);
    }
    if (pers==='quiet') {
      return rand(TPL.neutral);
    }
    if (pers==='bluffer' && day===1 && round===1 && Math.random()<0.18) {
      // bluffer の村人はまれに占い師騙り（村人騙りは普通NGだが多様性のため）
      // → やめておく。村人騙りは混乱を招くだけなので
    }
    // logical: バランス型・推理重視
    if (ot.length && Math.random()<0.45) {
      const tgt = topAcc(R, ot) || rand(ot);
      bumpSuspicion(R, tgt.name, 1);
      const flavor = Math.random();
      if (flavor<0.3) return tplFill(rand(TPL.reason_silent), tgt.name);
      if (flavor<0.55) return tplFill(rand(TPL.reason_pivot), tgt.name);
      if (flavor<0.75) return tplFill(rand(TPL.accuse), tgt.name);
      return tplFill(rand(TPL.vote_decl), tgt.name);
    }
    if (Math.random()<0.25) return rand(TPL.disagree);
    return rand([...TPL.neutral, ...TPL.question, ...TPL.ask_co]);
  }

  // ── 投票決定（上級者ロジック） ─────────────────────────

  function vote(R, cpu){
    initR(R);
    const candidates = others(R, cpu);
    if (!candidates.length) return null;
    const target = chooseStrategicVoteTarget(R, cpu, candidates)
      || personaChooseTarget(R, cpu, candidates, 'vote')
      || topAcc(R, candidates)
      || rand(candidates);
    if (target) {
      const board = buildPublicBoard(R, cpu);
      const row = board.byName.get(target.name);
      R.aiVotePlans[cpu.name] = {
        target:target.name, day:R.day, score:row?.score || 0,
        reason:shortEvidence(row)
      };
    }
    return target;
  }


  function voteReason(R, cpu, target) {
    initR(R);
    const name = typeof target === 'string' ? target : target?.name;
    if (!name) return '';
    const board = buildPublicBoard(R, cpu);
    const row = board.byName.get(name);
    const isWolfSide = isWolfSideRole(cpu.role);
    const styled = reason => personagizeVoteReason(cpu, name, reason, true);
    const preliminary = R.preVotes?.[cpu.name];
    if (preliminary && preliminary !== name) {
      return styled(`${preliminary}さんへの仮投票から、議論で出た情報を踏まえて${name}さんへ変更します。理由は${shortEvidence(row)}です。`);
    }
    if (cpu.role === 'SEER' && R.seerKnown?.[name] === true) {
      return styled(`${name}さんは自分の占い結果で黒です。盤面を進めるため、今日はここに投票します。`);
    }
    if (!isWolfSide && (row?.blackEvidence || 0) > 0.6) {
      return styled(`${name}さんには公開された黒結果があります。結果を出した人の発言も含めて、今日はここを確認します。`);
    }
    if (row?.reasons?.length) {
      const reason = shortEvidence(row);
      return styled(isWolfSide
        ? `${name}さんは${reason}があり、村の投票先として成立します。今日はここへ投票します。`
        : `${name}さんは${reason}が残っています。発言と投票の整合を確認するため、今日はここに投票します。`);
    }
    return styled(isWolfSide
      ? `${name}さんを残すより、ここで票をまとめる方が自然だと判断しました。`
      : `${name}さんの立ち位置がまだ見えにくいため、情報を増やす投票です。`);
  }

  // ── 人狼の夜の襲撃対象（智略つき） ─────────────────────

  function wolfNightTarget(R, hunter=null){
    initR(R);
    const al = alive(R);
    const wolves = al.filter(player => player.role === 'WEREWOLF');
    if (!wolves.length) return null;
    const wolfNames = new Set(wolves.map(player => player.name));
    const leadWolf = hunter || wolves.find(player => player.isCpu && getCpuPersona(player.name)) || wolves[0];
    const vill = al.filter(player => !wolfNames.has(player.name));
    if (!vill.length) return null;

    const board = buildPublicBoard(R, leadWolf);
    const publicThreats = new Set();
    (R.seerCOs || []).forEach(co => {
      (co.results || []).forEach(result => {
        if (result.isWolf && wolfNames.has(result.target)) publicThreats.add(co.name);
      });
    });
    const personaTarget = personaChooseTarget(R, leadWolf, vill, 'wolf_night');
    const target = pickByScore(vill, player => {
      const row = board.byName.get(player.name);
      const claim = R.claims?.[player.name] || '';
      const reliability = claim ? claimReliability(R, player.name, claim, board.groups) : 0;
      const roleValue = claim === 'SEER' ? 3.6 : claim === 'MEDIUM' ? 2.2 : claim === 'SHARED' ? 1.6 : claim === 'DOCTOR' ? 0.8 : 0;
      const influence = (R.speakCount?.[player.name] || 0) * 0.18 + (R.coverCount?.[player.name] || 0) * 0.72 + Math.max(0, -(row?.score || 0)) * 0.58;
      let score = roleValue * Math.max(0.35, reliability) + influence;
      if (publicThreats.has(player.name)) score += 5.2;
      if (personaTarget?.name === player.name) score += 0.35;
      if (R.nightReport?.guarded && R.nightReport.target === player.name) score -= 1.2;
      return score + tinyNoise();
    });
    if (target) R.wolfLastTarget = target.name;
    return target;
  }

  function chooseBrainwashTargets(R, madman, al){
    initR(R);
    const pool = (al || alive(R)).filter(player => player && player.alive && player.name !== madman?.name);
    if (pool.length < 2) return null;
    const board = buildPublicBoard(R, madman);
    const forcedTarget = pickByScore(pool, player => {
      const row = board.byName.get(player.name);
      return (row?.score || 0) * 0.72 + (board.tally[player.name] || 0) * 0.38 + (row?.claim ? 0.18 : 0) + tinyNoise();
    });
    if (!forcedTarget) return null;
    const voters = pool.filter(player => player.name !== forcedTarget.name);
    const voter = pickByScore(voters, player => {
      const row = board.byName.get(player.name);
      return Math.max(0, -(row?.score || 0)) * 0.7 + (R.speakCount?.[player.name] || 0) * 0.11 + tinyNoise();
    });
    return voter ? { voter, target:forcedTarget } : null;
  }
  return { initR, parseClaim, speak, vote, voteReason, wolfNightTarget, chooseSeerNightTarget, chooseDoctorGuardTarget, chooseBrainwashTargets, bumpSuspicion, bumpCover, buildPublicBoard, chooseStrategicVoteTarget };
})();

// ========== PROGRESSION & DETECTIVE SCORE（ソロの成長・中毒性レイヤー） ==========
// localStorage に戦績を保存し、推理スコア→経験値→探偵ランクへ成長させる。
// マルチプレイには一切影響しない（mode==='solo' のときだけ呼ばれる）。
const PROGRESS = (() => {
  const KEY = 'jinrou_profile_v2';

  const RANKS = [
    { min: 1,  name: '村の新入り',   icon: '🌱', color:'#94a3b8' },
    { min: 3,  name: '見習い探偵',   icon: '🔍', color:'#60a5fa' },
    { min: 5,  name: '一人前の探偵', icon: '🕵️', color:'#34d399' },
    { min: 8,  name: '名探偵',       icon: '🎩', color:'#a78bfa' },
    { min: 12, name: '人狼ハンター', icon: '🏹', color:'#fbbf24' },
    { min: 17, name: '月夜の賢者',   icon: '🌙', color:'#f472b6' },
    { min: 24, name: '伝説の村長',   icon: '👑', color:'#f59e0b' },
  ];
  function rankFor(level){ let r=RANKS[0]; for(const x of RANKS){ if(level>=x.min) r=x; } return r; }
  function reqForNext(level){ return 80 + (level-1)*45; }
  function levelInfo(totalXp){
    let level=1, rem=Math.max(0, totalXp|0);
    while(rem >= reqForNext(level) && level<200){ rem-=reqForNext(level); level++; }
    return { level, intoLevel:rem, neededForNext:reqForNext(level), rank:rankFor(level), totalXp:Math.max(0,totalXp|0) };
  }

  function blank(){
    return { totalXp:0, gamesPlayed:0, wins:0, streak:0, bestStreak:0,
             roleWins:{}, achievements:[], perfectReads:0,
             daily:{ date:null, id:null, done:false }, dailyCombo:0, dailyLastDate:null };
  }
  function load(){
    try { const j = JSON.parse(localStorage.getItem(KEY)); if(j&&typeof j==='object'){ return Object.assign(blank(), j); } } catch(e){}
    return blank();
  }
  function save(p){ try { localStorage.setItem(KEY, JSON.stringify(p)); } catch(e){} }

  function todayStr(d){ d=d||new Date(); const z=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`; }
  function hash(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))|0; } return Math.abs(h); }

  // デイリーミッション（役職に依存せず達成可能なものを中心に）
  const MISSIONS = [
    { id:'win',     label:'今日の勝利を掴め',                bonus:60, check:(c)=>c.won },
    { id:'catch',   label:'投票で人狼陣営を処刑に追い込め',  bonus:60, check:(c)=>c.voteHits>=1 },
    { id:'note',    label:'捜査ノートで人狼を見抜け',        bonus:60, check:(c)=>c.correctSuspects>=1 },
    { id:'survive', label:'最後まで生き延びろ',              bonus:55, check:(c)=>c.survived },
    { id:'clean',   label:'無実の村人を誤認せず推理せよ',    bonus:70, check:(c)=>c.correctSuspects>=1 && c.wrongSuspects===0 },
    { id:'streak2', label:'2連勝を達成せよ',                 bonus:80, check:(c)=>c.won && c.streakAfter>=2 },
  ];
  function missionFor(dateStr){ dateStr=dateStr||todayStr(); return MISSIONS[hash(dateStr)%MISSIONS.length]; }

  const ACHIEVEMENTS = [
    { id:'first_game', icon:'🎮', name:'初陣',         desc:'はじめてゲームを完了した',            test:(p,c)=>p.gamesPlayed>=1 },
    { id:'first_win',  icon:'🏆', name:'初勝利',       desc:'はじめて勝利した',                    test:(p,c)=>c.won },
    { id:'streak3',    icon:'🔥', name:'三連勝',       desc:'3連勝を達成',                         test:(p,c)=>p.streak>=3 },
    { id:'streak5',    icon:'💥', name:'五連勝',       desc:'5連勝を達成',                         test:(p,c)=>p.streak>=5 },
    { id:'perfect',    icon:'🧠', name:'完全推理',     desc:'6人以上の戦で全人狼を的中＆誤認ゼロ', test:(p,c)=>c.players>=6 && c.wolvesTotal>=1 && c.correctSuspects>=c.wolvesTotal && c.wrongSuspects===0 },
    { id:'seer_win',   icon:'🔮', name:'占星術の冴え', desc:'占い師で勝利',                        test:(p,c)=>c.won && c.myRole==='SEER' },
    { id:'wolf_win',   icon:'🐺', name:'月夜の狩人',   desc:'人狼陣営で勝利',                      test:(p,c)=>c.won && c.myTeam==='wolf' },
    { id:'guardian',   icon:'🛡️', name:'鉄壁の守護',   desc:'騎士で護衛を成功させ勝利',            test:(p,c)=>c.won && c.myRole==='DOCTOR' && c.guard>=1 },
    { id:'survivor',   icon:'🍀', name:'生存者',       desc:'7人以上の戦で生き残って勝利',         test:(p,c)=>c.won && c.survived && c.players>=7 },
    { id:'detective',  icon:'🎩', name:'名探偵',       desc:'名探偵ランクに到達',                  test:(p,c)=>levelInfo(p.totalXp).level>=8 },
    { id:'daily3',     icon:'📅', name:'皆勤賞',       desc:'デイリーを3日連続で達成',             test:(p,c)=>p.dailyCombo>=3 },
    { id:'veteran',    icon:'🎖️', name:'歴戦の村人',   desc:'20ゲームをプレイ',                    test:(p,c)=>p.gamesPlayed>=20 },
  ];

  // 推理スコアの内訳を計算
  function computeScore(c){
    const lines = [];
    const add = (label, pts) => { if(Math.round(pts)!==0) lines.push({label, pts:Math.round(pts)}); };
    add(c.won ? '🏆 勝利ボーナス' : '🎌 参加ボーナス', c.won ? 120 : 25);
    if (c.survived) add('🍀 最後まで生存', 25);
    let noteNet = c.correctSuspects*30 + c.correctTrusts*12 - c.wrongSuspects*12 - c.wrongTrusts*18;
    if (noteNet!==0 || c.markCount>0) add(`🕵️ 捜査ノート（的中${c.correctSuspects}・誤認${c.wrongSuspects}）`, noteNet);
    if (c.voteHits>0) add(`🗳️ ${c.myTeam==='wolf'?'村人を欺く投票':'人狼への的中投票'} ×${c.voteHits}`, c.voteHits*18);
    if (c.myRole==='SEER'   && c.seerHits>0) add(`🔮 占いで人狼を発見 ×${c.seerHits}`, c.seerHits*14);
    if (c.myRole==='DOCTOR' && c.guard>0)    add(`💊 護衛成功 ×${c.guard}`, c.guard*18);
    const subtotal = lines.reduce((a,b)=>a+b.pts,0);
    const diffMult = c.diff==='hard'?1.3 : c.diff==='easy'?0.8 : 1.0;
    if (diffMult!==1) add(`⚙️ 難易度補正（${c.diff==='hard'?'むずかしい':'やさしい'}）`, subtotal*(diffMult-1));
    const total = Math.max(5, Math.round(subtotal*diffMult));
    return { lines, total };
  }

  function recordGame(ctx){
    const p = load();
    const isWolfTeam = r => isWolfSideRole(r);
    const me = (ctx.players||[]).find(x=>x.name===ctx.myName) || {};
    const survived = !!me.alive;
    const myTeam = (ROLES[ctx.myRole]||{}).team || 'village';
    const won = myTeam === ctx.winner;
    const others = (ctx.players||[]).filter(x=>x.name!==ctx.myName);
    const wolvesTotal = others.filter(x=>isWolfTeam(x.role)).length;
    const nb = ctx.notebook||{};
    let correctSuspects=0, wrongSuspects=0, correctTrusts=0, wrongTrusts=0, markCount=0;
    const notebookReview = [];
    others.forEach(x=>{
      const m = nb[x.name]; if(!m) return; markCount++;
      const wolf = isWolfTeam(x.role);
      const correct = m==='suspect' ? wolf : !wolf;
      if(m==='suspect'){ wolf?correctSuspects++:wrongSuspects++; }
      else if(m==='trust'){ wolf?wrongTrusts++:correctTrusts++; }
      notebookReview.push({ name:x.name, role:x.role, mark:m, wolf, correct });
    });
    const roleOf = n => { const f=(ctx.players||[]).find(x=>x.name===n); return f?f.role:null; };
    let voteHits=0;
    (ctx.humanVotes||[]).forEach(t=>{ const r=roleOf(t); if(r==null) return;
      if(myTeam==='wolf'){ if(!isWolfTeam(r)) voteHits++; } else { if(isWolfTeam(r)) voteHits++; } });
    const streakAfter = won ? (p.streak+1) : 0;
    const sc = computeScore({ won, survived, myTeam, myRole:ctx.myRole,
      correctSuspects, wrongSuspects, correctTrusts, wrongTrusts, markCount,
      voteHits, seerHits:ctx.seerHits||0, guard:ctx.guard||0, diff:ctx.diff||'normal' });

    // デイリー
    const tStr = todayStr();
    const mission = missionFor(tStr);
    let dailyJustDone=false, dailyBonus=0;
    if (p.daily.date !== tStr) p.daily = { date:tStr, id:mission.id, done:false };
    if (!p.daily.done && mission.check({ won, survived, voteHits, correctSuspects, wrongSuspects, streakAfter })) {
      p.daily.done = true; dailyJustDone=true; dailyBonus = mission.bonus;
      const y = todayStr(new Date(Date.now()-86400000));
      p.dailyCombo = (p.dailyLastDate===y) ? (p.dailyCombo+1) : 1;
      p.dailyLastDate = tStr;
    }

    // プロフィール更新
    const before = levelInfo(p.totalXp);
    const xpGained = sc.total + dailyBonus;
    p.totalXp += xpGained;
    p.gamesPlayed += 1;
    if (won) { p.wins+=1; p.streak+=1; p.bestStreak=Math.max(p.bestStreak,p.streak);
               p.roleWins[ctx.myRole]=(p.roleWins[ctx.myRole]||0)+1; }
    else p.streak = 0;
    if (correctSuspects>=wolvesTotal && wolvesTotal>=1 && wrongSuspects===0 && (ctx.players||[]).length>=6) p.perfectReads+=1;

    // 実績
    const achCtx = { won, survived, myRole:ctx.myRole, myTeam, players:(ctx.players||[]).length,
      wolvesTotal, correctSuspects, wrongSuspects, guard:ctx.guard||0 };
    const newAch = [];
    ACHIEVEMENTS.forEach(a=>{ if(!p.achievements.includes(a.id) && a.test(p, achCtx)){ p.achievements.push(a.id); newAch.push(a); } });

    const after = levelInfo(p.totalXp);
    save(p);
    return {
      scoreLines: sc.lines, scoreTotal: sc.total,
      xpGained, dailyBonus, dailyJustDone, mission, dailyDone:p.daily.done,
      before, after, leveledUp: after.level>before.level, rankChanged: after.rank.name!==before.rank.name,
      won, survived, streak:p.streak, bestStreak:p.bestStreak, newAchievements:newAch,
      gamesPlayed:p.gamesPlayed, wins:p.wins,
      winRate: p.gamesPlayed?Math.round(p.wins/p.gamesPlayed*100):0,
      achTotal:ACHIEVEMENTS.length, achHave:p.achievements.length,
      notebookReview,
      notebookStats:{ markCount, correctSuspects, wrongSuspects, correctTrusts, wrongTrusts },
    };
  }

  function summary(){
    const p = load();
    const info = levelInfo(p.totalXp);
    const tStr = todayStr();
    const mission = missionFor(tStr);
    return { profile:p, info, mission, dailyDone:(p.daily.date===tStr && p.daily.done),
      winRate: p.gamesPlayed?Math.round(p.wins/p.gamesPlayed*100):0,
      achTotal:ACHIEVEMENTS.length, achHave:p.achievements.length,
      achievements: ACHIEVEMENTS.map(a=>({...a, have:p.achievements.includes(a.id)})) };
  }
  function reset(){ save(blank()); }

  return { recordGame, summary, levelInfo, rankFor, missionFor, todayStr, RANKS, ACHIEVEMENTS, reset };
})();
