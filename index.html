<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="人狼ゲーム">
<meta name="theme-color" content="#06080d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/werewolf-solo-portraits-v2-famous.png">
<title>🐺 人狼ゲーム</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #06080d;
  min-height: 100vh;
  min-height: 100dvh;
  font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Segoe UI', sans-serif;
  color: #e2e8f0;
  overflow-x: hidden;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -2;
  background:
    linear-gradient(180deg, rgba(4,7,13,.32), rgba(4,7,13,.82) 58%, rgba(4,7,13,.96)),
    radial-gradient(circle at 52% 24%, rgba(234,179,8,.16), transparent 28%),
    url("assets/village-night-bg-optimized.jpg") center / cover no-repeat;
  transform: scale(1.02);
}
body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    linear-gradient(90deg, rgba(0,0,0,.38), transparent 22%, transparent 78%, rgba(0,0,0,.45)),
    radial-gradient(circle at 50% 12%, transparent 0 22%, rgba(0,0,0,.38) 78%);
}
#app {
  max-width: 480px;
  margin: 0 auto;
  padding: 1rem 1rem calc(3rem + env(safe-area-inset-bottom));
  min-height: 100vh;
  min-height: 100dvh;
  animation: fadeIn 0.25s ease;
  position: relative;
}
body.fullscreen-active #app {
  padding-top: calc(0.8rem + env(safe-area-inset-top));
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* Typography */
h1 { font-size: 2rem; font-weight: 800; }
h2 { font-size: 1.4rem; font-weight: 700; }
h3 { font-size: 1.1rem; font-weight: 600; }
p  { line-height: 1.6; }

/* Divider */
.div { border: none; border-top: 1px solid rgba(255,255,255,0.08); margin: 1.2rem 0; }

/* Section label */
.sec-label {
  color: #64748b;
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 600;
  margin: 1.2rem 0 0.5rem;
}

/* Cards */
.card {
  background: rgba(7,11,18,0.74);
  border-radius: 8px;
  padding: 1.2rem;
  border: 1px solid rgba(226,232,240,0.12);
  margin: 0.6rem 0;
  box-shadow: 0 16px 42px rgba(0,0,0,.24);
  backdrop-filter: blur(12px);
}
.card-colored {
  border-radius: 8px;
  padding: 1.2rem;
  margin: 0.6rem 0;
  box-shadow: 0 16px 42px rgba(0,0,0,.24);
  backdrop-filter: blur(12px);
}

/* Buttons */
.btn {
  display: block;
  width: 100%;
  padding: 0.85rem 1rem;
  border: none;
  border-radius: 12px;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  margin: 0.5rem 0;
  transition: opacity 0.15s, transform 0.1s;
  letter-spacing: 0.02em;
}
.btn:active { transform: scale(0.97); opacity: 0.85; }
.btn-primary { background: linear-gradient(135deg, #6b21a8, #4338ca); color: #fff; }
.btn-danger  { background: linear-gradient(135deg, #7f1d1d, #7c3aed); color: #fff; }
.btn-success { background: linear-gradient(135deg, #064e3b, #0369a1); color: #fff; }
.btn-night   { background: rgba(99,102,241,0.15); color: #a5b4fc; border: 1px solid #4338ca; }
.btn-ghost   { background: rgba(255,255,255,0.06); color: #94a3b8; border: 1px solid rgba(255,255,255,0.1); }

.fullscreen-start-card {
  border: 1px solid rgba(14,165,233,.38);
  background: rgba(8,47,73,.38);
  box-shadow: 0 14px 34px rgba(2,132,199,.12);
}
.fullscreen-start-card .btn {
  margin: 0;
  background: linear-gradient(135deg, #0f766e, #1d4ed8);
}
.fullscreen-start-note {
  color: #94a3b8;
  font-size: .74rem;
  line-height: 1.55;
  margin: .55rem 0 0;
  text-align: center;
}
.quality-alert {
  border: 1px solid rgba(251,191,36,.44);
  background: rgba(69,44,7,.72);
  box-shadow: 0 14px 34px rgba(251,191,36,.1);
}
.quality-alert-title {
  color: #fde68a;
  font-size: .9rem;
  font-weight: 900;
  margin: 0 0 .25rem;
}
.quality-alert-text {
  color: #fef3c7;
  font-size: .78rem;
  line-height: 1.55;
  margin: 0 0 .65rem;
}
.quality-alert-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: .45rem;
}
.quality-alert-actions .btn {
  margin: 0;
  padding: .66rem .5rem;
  font-size: .84rem;
}
.quality-fallback {
  max-width: 480px;
  margin: 0 auto;
  padding: 1.2rem;
  min-height: 100dvh;
  display: flex;
  align-items: center;
}

/* Phase header */
.ph {
  text-align: center;
  padding: 1.5rem 0 0.5rem;
  text-shadow: 0 2px 24px rgba(0,0,0,.65);
}
.ph .icon { font-size: 3rem; margin-bottom: 0.3rem; }
.ph h1 { margin: 0.2rem 0; }
.ph .sub { color: #64748b; font-size: 0.95rem; margin: 0; }

/* Inputs */
input[type="text"], select {
  width: 100%;
  padding: 0.65rem 0.9rem;
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.13);
  border-radius: 9px;
  color: #e2e8f0;
  font-size: 0.95rem;
  margin: 0.25rem 0 0.5rem;
  outline: none;
  transition: border-color 0.15s;
}
input[type="text"]:focus, select:focus { border-color: #6b21a8; }
select option { background: #1e1b4b; }
label { color: #94a3b8; font-size: 0.85rem; display: block; margin-bottom: 0.15rem; }

/* Player name grid */
.name-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 0.6rem; }
.name-grid .name-item input { font-size: 0.9rem; }

/* Role counter grid */
.role-grid { display: flex; gap: 0.5rem; flex-wrap: wrap; }
.role-item {
  flex: 1;
  min-width: 70px;
  text-align: center;
  padding: 0.7rem 0.4rem;
  background: rgba(255,255,255,0.05);
  border-radius: 10px;
}
.role-item .ri { font-size: 1.6rem; }
.role-item .rc { font-size: 1.4rem; font-weight: 800; }
.role-item .rn { font-size: 0.75rem; color: #94a3b8; }

/* Count control */
.count-ctrl {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1.5rem;
  margin: 0.5rem 0;
}
.cnt-btn {
  width: 46px; height: 46px;
  border-radius: 50%;
  background: rgba(255,255,255,0.09);
  border: 1px solid rgba(255,255,255,0.18);
  color: #fff;
  font-size: 1.5rem;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  user-select: none;
  transition: background 0.15s;
}
.cnt-btn:active { background: rgba(255,255,255,0.18); }
.cnt-val { font-size: 2.8rem; font-weight: 800; color: #fff; min-width: 64px; text-align: center; }

/* Role reveal card */
.role-reveal-card {
  text-align: center;
  padding: 2.2rem 1.5rem;
  border-radius: 8px;
  border: 2px solid;
  margin: 1rem 0;
  box-shadow: 0 18px 48px rgba(0,0,0,.32);
  backdrop-filter: blur(12px);
}
.rrc-icon { font-size: 5rem; margin: 0.5rem 0; }
.rrc-name { font-size: 2.6rem; font-weight: 900; margin: 0.2rem 0; }
.rrc-team { font-size: 0.85rem; color: #94a3b8; }
.rrc-desc { font-size: 0.92rem; color: #cbd5e1; margin-top: 0.9rem; line-height: 1.65; }
.rrc-tips { text-align:left; background:rgba(0,0,0,.28); border-radius:12px; padding:.75rem 1rem; margin-top:.9rem; }
.rrc-tips-title { font-size:.76rem; font-weight:700; color:#94a3b8; letter-spacing:.07em; margin-bottom:.5rem; }
.rrc-tips-item { font-size:.82rem; color:#b0bec5; line-height:1.65; padding:.1rem 0 .1rem 1.2rem; position:relative; }
.rrc-tips-item::before { content:'💡'; position:absolute; left:0; }
/* 人狼仲間バー */
.wolf-ally-bar { display:flex; align-items:center; flex-wrap:wrap; gap:.45rem;
  background:rgba(239,68,68,.1); border:1px solid rgba(239,68,68,.3);
  border-radius:10px; padding:.5rem .85rem; margin-bottom:.6rem; font-size:.83rem; }
.wolf-ally-label { color:#f87171; font-weight:700; white-space:nowrap; }
.wolf-ally-chip { background:rgba(239,68,68,.18); color:#fca5a5; border-radius:20px;
  padding:.15rem .6rem; font-size:.8rem; }

/* Chips */
.chips { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.4rem 0; }
.chip {
  padding: 0.3rem 0.75rem;
  border-radius: 20px;
  font-size: 0.88rem;
  background: rgba(255,255,255,0.09);
  color: #e2e8f0;
}
.chip.disconnected,
.vote-avatar-btn.disconnected {
  opacity: 0.62;
  filter: grayscale(0.7);
  border-color: rgba(245,158,11,0.65) !important;
  box-shadow: inset 0 0 0 1px rgba(245,158,11,0.25);
}
.conn-badge {
  display: inline-flex;
  align-items: center;
  margin-left: 0.3rem;
  padding: 0.08rem 0.34rem;
  border-radius: 999px;
  border: 1px solid rgba(245,158,11,0.48);
  background: rgba(245,158,11,0.13);
  color: #fbbf24;
  font-size: 0.62rem;
  font-weight: 900;
  line-height: 1.3;
  white-space: nowrap;
}
.p2p-presence-list {
  display: flex;
  flex-wrap: wrap;
  gap: 0.35rem;
  margin: 0.45rem 0 0.2rem;
}
.p2p-presence-item {
  display: inline-flex;
  align-items: center;
  gap: 0.28rem;
}
.p2p-offline-age {
  color: #fbbf24;
  font-size: 0.68rem;
  font-weight: 800;
  white-space: nowrap;
}
.btn:disabled,
.vote-ready-btn:disabled,
.send-btn:disabled,
.tpl-btn:disabled,
.quick-fill:disabled,
.tpl-cat:disabled {
  opacity: 0.46;
  cursor: not-allowed;
  filter: grayscale(0.35);
}
.free-chat-bar input:disabled {
  opacity: 0.58;
  cursor: not-allowed;
}

/* Player row (game over) */
.player-row {
  display: flex;
  align-items: center;
  padding: 0.6rem 1rem;
  background: rgba(255,255,255,0.04);
  border-radius: 10px;
  margin: 0.3rem 0;
  border-left: 4px solid;
}
.pr-icon { font-size: 1.3rem; margin-right: 0.7rem; }
.pr-name { flex: 1; font-weight: 600; }
.pr-role { font-size: 0.85rem; margin-right: 0.8rem; }
.pr-status { font-size: 0.8rem; color: #475569; }

/* Vote bar */
.vote-bar { font-family: 'Courier New', monospace; font-size: 0.88rem; margin: 0.3rem 0; color: #94a3b8; }
.vote-bar.executed { color: #f87171; font-weight: 700; }

/* Progress text */
.progress { text-align: center; color: #475569; font-size: 0.85rem; margin: 0.4rem 0; }

/* Pass screen */
.pass-screen {
  text-align: center;
  padding: 2rem 1.5rem;
  border-radius: 14px;
  border: 1px solid;
  margin: 0.8rem 0;
}
.pass-screen h3 { margin: 0 0 0.5rem; }
.pass-screen h2 { color: #fff; margin: 0.3rem 0; }
.pass-screen .hint { color: #475569; font-size: 0.85rem; margin: 0; }

/* Log */
details summary { color: #64748b; cursor: pointer; padding: 0.5rem 0; font-size: 0.9rem; }
details summary:hover { color: #94a3b8; }
.log-entry { color: #64748b; font-size: 0.83rem; padding: 0.2rem 0 0.2rem 0.5rem; border-left: 2px solid rgba(255,255,255,0.08); margin: 0.2rem 0; }
/* Chat feed */
.chat-feed {
  max-height: min(46vh, 430px);
  min-height: 230px;
  overflow-y: auto;
  background: rgba(2,6,12,0.72);
  border: 1px solid rgba(226,232,240,.1);
  border-radius: 8px;
  padding: 0.75rem;
  margin: 0.5rem 0;
  scroll-behavior: auto;
  overflow-anchor: none;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.04), 0 18px 44px rgba(0,0,0,.22);
  backdrop-filter: blur(10px);
}
.chat-msg { margin: 0.45rem 0; padding: 0.6rem 0.7rem; background: rgba(255,255,255,0.07); border-radius: 8px; }
.chat-name { color: #818cf8; font-weight: 700; font-size: 0.82rem; margin-right: 0.45rem; }
.chat-text { color: #e2e8f0; font-size: 0.94rem; line-height: 1.65; }
.chat-typing { color: #94a3b8; font-size: 0.82rem; padding: 0.45rem 0.6rem; font-style: italic; }
.wolf-msg { background: rgba(239,68,68,0.1); border-left: 3px solid #ef444488; }
.wolf-msg .chat-name { color: #f87171; }
/* ── Opening Story ── */
.story-overlay{position:fixed;inset:0;background:linear-gradient(180deg,rgba(2,6,12,.24),rgba(2,6,12,.92) 68%,#02040a),url("assets/village-night-bg-optimized.jpg") center / cover no-repeat;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;}
.story-moon{font-size:4.5rem;margin-bottom:1.5rem;}
.story-text{color:#c8d8f4;font-size:1.1rem;line-height:2;max-width:380px;min-height:4rem;transition:opacity .4s ease;}
.story-cursor{display:inline-block;width:2px;height:1em;background:#a5b4fc;margin-left:2px;vertical-align:middle;opacity:.7;}
.story-progress{width:180px;height:3px;background:rgba(255,255,255,.08);border-radius:2px;margin-top:1.2rem;overflow:hidden;}
.story-progress-bar{height:100%;background:linear-gradient(90deg,#6b21a8,#4338ca);transition:width .5s;}
.story-skip{margin-top:2rem;padding:.5rem 1.6rem;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:20px;color:#64748b;font-size:.82rem;cursor:pointer;transition:color .2s;}
.story-skip:hover{color:#94a3b8;}

/* ── Kill Drama Overlay ── */
.kill-overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:900;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;animation:killFadeIn .5s ease;}
@keyframes killFadeIn{from{opacity:0;}to{opacity:1;}}
.kill-icon{font-size:5rem;}
.kill-title{color:#ef4444;font-size:.9rem;font-weight:700;letter-spacing:.12em;margin-bottom:.4rem;margin-top:1.2rem;}
.kill-name{font-size:2.5rem;font-weight:900;color:#fff;margin:.2rem 0;}
.kill-role{color:#94a3b8;font-size:1.05rem;}
.kill-tap{color:#475569;font-size:.8rem;margin-top:1.8rem;}

/* ── Confetti ── */
.confetti-wrap{position:fixed;inset:0;pointer-events:none;z-index:800;overflow:hidden;}
.cp{position:absolute;width:9px;height:9px;border-radius:2px;animation:cpFall linear forwards;}
@keyframes cpFall{from{transform:translateY(-20px) rotate(0deg);opacity:1;}to{transform:translateY(110vh) rotate(720deg);opacity:.1;}}

/* ── P2P badge ── */
.p2p-badge{display:inline-flex;align-items:center;gap:.3rem;background:rgba(16,185,129,.14);border:1px solid #10b98144;border-radius:6px;padding:.15rem .5rem;font-size:.74rem;color:#34d399;margin-left:.3rem;}
.p2p-dot{width:6px;height:6px;border-radius:50%;background:#34d399;animation:p2pPulse 1.5s ease-in-out infinite;}
@keyframes p2pPulse{0%,100%{opacity:1;}50%{opacity:.2;}}

/* ── Wolf Secret Chat ── */
.secret-bar{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);border-radius:10px;padding:.6rem 1rem;margin-bottom:.7rem;text-align:center;}
.secret-tag{display:inline-flex;align-items:center;gap:.3rem;background:rgba(239,68,68,.2);border-radius:16px;padding:.2rem .7rem;font-size:.76rem;color:#f87171;font-weight:700;}

/* ── Animations ── */
@keyframes roleReveal{from{opacity:0;}to{opacity:1;}}
.role-reveal-card{animation:roleReveal .4s ease;}
@keyframes voteDrama{from{opacity:0;}to{opacity:1;}}
.vote-drama{animation:voteDrama .4s ease;}
@keyframes phaseIn{from{opacity:0;}to{opacity:1;}}
#app>*{animation:phaseIn .2s ease;}

/* ── Character Avatars ── */
.avatar-grid{display:flex;flex-wrap:wrap;gap:.5rem;margin:.4rem 0;}
.avatar-card{display:flex;flex-direction:column;align-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:.6rem .4rem;min-width:72px;max-width:80px;cursor:pointer;transition:background .15s;}
.avatar-card:hover{background:rgba(255,255,255,.12);}
.avatar-card.selected{border:2px solid #6b21a8;background:rgba(107,33,168,.15);}
.avatar-card.dead{opacity:.4;filter:grayscale(1);}
.av-emoji{font-size:2.2rem;line-height:1;}
.av-label{font-size:.72rem;color:#94a3b8;font-weight:600;margin-top:.2rem;text-align:center;}
.av-hint{font-size:.62rem;color:#475569;margin-top:.1rem;text-align:center;line-height:1.3;}
.av-status{font-size:.65rem;margin-top:.2rem;text-align:center;}

/* ── Role Claim Badge ── */
.claim-badge{display:inline-flex;align-items:center;gap:.2rem;font-size:.72rem;padding:.1rem .4rem;border-radius:10px;margin-left:.3rem;font-weight:700;}
.claim-badge .claim-icon{font-size:.9rem;line-height:1;}
.claim-badge.compact{gap:.12rem;margin-left:.25rem;padding:.08rem .32rem;font-size:.66rem;}
.claim-unverified{background:rgba(251,191,36,.15);color:#fbbf24;border:1px solid #fbbf2433;}
.claim-confirmed{background:rgba(129,140,248,.2);color:#a5b4fc;border:1px solid #818cf855;}
.claim-dead-wolf{background:rgba(239,68,68,.2);color:#f87171;border:1px solid #ef444455;}
.co-chat-panel{background:rgba(7,11,18,.72);border:1px solid rgba(251,191,36,.26);border-radius:8px;margin:.45rem 0;padding:.65rem;box-shadow:0 14px 34px rgba(0,0,0,.22);backdrop-filter:blur(12px);}
.co-chat-head{display:flex;align-items:center;justify-content:space-between;gap:.5rem;color:#fbbf24;font-size:.82rem;font-weight:900;margin-bottom:.45rem;}
.co-chat-count{color:#94a3b8;font-size:.72rem;font-weight:700;}
.co-chat-feed{display:flex;flex-direction:column;gap:.38rem;max-height:170px;overflow-y:auto;scroll-behavior:auto;overflow-anchor:none;}
.co-chat-empty{color:#64748b;font-size:.8rem;line-height:1.6;padding:.25rem .35rem;}
.co-msg{display:flex;gap:.5rem;align-items:flex-start;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.16);border-radius:8px;padding:.5rem .55rem;}
.co-msg-name{display:flex;align-items:center;gap:.25rem;flex-wrap:wrap;color:#f8fafc;font-size:.82rem;font-weight:900;margin-bottom:.12rem;}
.co-msg-text{color:#e2e8f0;font-size:.86rem;line-height:1.55;word-break:break-word;}

/* ── Death List ── */
.death-list{background:rgba(0,0,0,.3);border:1px solid rgba(239,68,68,.2);border-radius:12px;padding:.7rem .8rem;margin:.5rem 0;}
.death-entry{display:flex;align-items:center;gap:.5rem;padding:.3rem 0;border-bottom:1px solid rgba(255,255,255,.04);}
.death-entry:last-child{border-bottom:none;}
.de-avatar{font-size:1.4rem;}
.de-name{flex:1;font-size:.88rem;font-weight:600;color:#94a3b8;text-decoration:line-through;}
.de-role{font-size:.8rem;}

/* ── Chat Message with Avatar ── */
.chat-msg{margin:.45rem 0;padding:.62rem .72rem;background:rgba(255,255,255,.07);border-radius:8px;display:flex;align-items:flex-start;gap:.65rem;}
.cm-av{flex-shrink:0;line-height:1;}
.cm-body{flex:1;}
.cm-name{color:#c4b5fd;font-weight:800;font-size:.83rem;display:flex;align-items:center;gap:.28rem;flex-wrap:wrap;}
.cm-text{color:#f8fafc;font-size:.94rem;line-height:1.68;margin-top:.18rem;word-break:break-word;}
.wolf-msg{background:rgba(239,68,68,.1);border-left:3px solid #ef444488;}
.wolf-msg .cm-name{color:#f87171;}
.seer-claim-msg{background:rgba(129,140,248,.1);border-left:3px solid #818cf888;}
.my-msg{background:rgba(99,102,241,.12);border-left:3px solid #6b21a8;}
.portrait{display:inline-block;background-image:url("assets/werewolf-solo-portraits-v2-famous-1024.jpg");background-size:400% 400%;background-repeat:no-repeat;background-color:#111827;border:1px solid rgba(255,255,255,.18);box-shadow:0 6px 18px rgba(0,0,0,.35);image-rendering:auto;overflow:hidden;vertical-align:middle;}
.portrait-chat{width:38px;height:38px;border-radius:50%;}
.portrait-chip{width:22px;height:22px;border-radius:50%;margin-right:.25rem;flex-shrink:0;}
.portrait-lg{width:76px;height:76px;border-radius:8px;}
.portrait-xl{width:112px;height:112px;border-radius:8px;}
.portrait-emoji{display:none;}

/* Template picker */
.tpl-cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem; margin: 0.5rem 0; }
.tpl-cat { padding: 0.75rem 0.5rem; background: rgba(99,102,241,0.13); border: 1px solid #4338ca55;
  border-radius: 10px; color: #a5b4fc; font-size: 0.9rem; cursor: pointer; text-align: center; }
.tpl-cat:active { background: rgba(99,102,241,0.28); }
.tpl-btn { display: block; width: 100%; padding: 0.7rem 1rem; margin: 0.3rem 0;
  background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
  border-radius: 10px; color: #e2e8f0; font-size: 0.9rem; cursor: pointer; text-align: left; }
.tpl-btn:active { background: rgba(255,255,255,0.16); }
.tpl-section-label { color: #64748b; font-size: 0.78rem; margin: 0.8rem 0 0.3rem; }
.cpu-badge { font-size: 0.7rem; background: rgba(99,102,241,0.2); color: #818cf8;
  border-radius: 4px; padding: 0.1rem 0.35rem; margin-left: 0.3rem; }
/* ── Music indicator ── */
.music-bar{background:rgba(251,191,36,.1);border:1px solid #fbbf2433;border-radius:10px;padding:.4rem .8rem;display:flex;align-items:center;gap:.5rem;margin:.3rem 0;}
@keyframes musicPulse{0%,100%{opacity:1;}50%{opacity:.25;}}
/* ── Free chat input bar ── */
.chat-compose{position:relative;background:linear-gradient(180deg,rgba(9,13,22,.76),rgba(9,13,22,.94));border:1px solid rgba(226,232,240,.12);border-radius:8px;padding:.5rem;margin:.45rem 0 .2rem;box-shadow:0 14px 34px rgba(0,0,0,.26);backdrop-filter:blur(14px);}
.quick-chat-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.32rem;margin-bottom:.42rem;}
.quick-chat-row select{grid-column:span 3;margin:0;padding:.44rem .55rem;font-size:.82rem;background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.12);}
.quick-fill{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#cbd5e1;border-radius:7px;padding:.42rem .34rem;font-size:.76rem;font-weight:700;cursor:pointer;white-space:nowrap;}
.quick-fill:active{background:rgba(255,255,255,.14);}
.free-chat-bar{display:flex;gap:.4rem;margin:0;}
.free-chat-bar input{flex:1;min-width:0;padding:.66rem .75rem;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:8px;color:#f8fafc;font-size:.95rem;outline:none;line-height:1.3;}
.free-chat-bar input:focus{border-color:#fbbf24;box-shadow:0 0 0 2px rgba(251,191,36,.12);}
.free-chat-bar input::placeholder{color:#475569;}
.free-chat-bar .send-btn{padding:.62rem .9rem;border:none;border-radius:8px;background:linear-gradient(135deg,#b45309,#0369a1);color:#fff;font-size:.88rem;font-weight:800;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.free-chat-bar .send-btn:active{opacity:.8;}
/* ── Quick agree button ── */
.quick-agree{background:rgba(99,102,241,.18);border:1px solid #4338ca55;color:#a5b4fc;font-size:.66rem;padding:.1rem .32rem;border-radius:6px;cursor:pointer;margin-left:.3rem;vertical-align:middle;line-height:1.4;}
.quick-agree:active{background:rgba(99,102,241,.38);}
/* ── Vote Ready Bar ── */
.vote-ready-bar{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:.55rem .7rem;margin:.45rem 0;}
.vote-ready-bar.all-ready{background:rgba(34,197,94,.12);border-color:#22c55e88;animation:musicPulse .9s ease-in-out infinite;}
.vote-ready-btn{flex:1;padding:.6rem .8rem;border:none;border-radius:9px;font-size:.88rem;font-weight:700;cursor:pointer;transition:opacity .15s,transform .1s;}
.vote-ready-btn:active{transform:scale(.96);}
.vote-ready-btn.ready{background:rgba(34,197,94,.18);border:1px solid #22c55e55;color:#4ade80;cursor:default;}
.vote-ready-btn.not-ready{background:linear-gradient(135deg,#065f46,#0369a1);color:#fff;}
.vote-ready-dots{display:flex;gap:.25rem;flex-wrap:wrap;margin-top:.3rem;}
/* ── CO quick button ── */
.co-quick-panel{background:rgba(129,140,248,.09);border:1px solid rgba(129,140,248,.24);border-radius:8px;padding:.46rem;margin:0 0 .42rem;}
.co-quick-head{display:flex;align-items:center;justify-content:space-between;gap:.4rem;color:#a5b4fc;font-size:.76rem;font-weight:900;margin-bottom:.34rem;}
.co-quick-status{color:#64748b;font-size:.68rem;font-weight:700;white-space:nowrap;}
.co-quick-btns{display:flex;flex-wrap:wrap;gap:.3rem;margin:.3rem 0 0;}
.co-quick-panel select{width:100%;margin:0 0 .32rem;padding:.42rem .55rem;font-size:.8rem;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:7px;color:#e2e8f0;}
.co-btn{display:inline-flex;align-items:center;gap:.2rem;background:rgba(129,140,248,.14);border:1px solid #818cf855;color:#a5b4fc;font-size:.78rem;padding:.34rem .58rem;border-radius:8px;cursor:pointer;font-weight:800;}
.co-btn.primary{background:rgba(251,191,36,.14);border-color:#fbbf2466;color:#fde68a;}
.co-btn.fake{background:rgba(124,58,237,.14);border-color:#7c3aed66;color:#c4b5fd;}
.co-btn:active{background:rgba(129,140,248,.3);}
.co-dedicated-panel{background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.25);border-radius:8px;padding:.5rem;margin:0 0 .48rem;}
.co-dedicated-head{display:flex;align-items:center;justify-content:space-between;gap:.5rem;color:#fde68a;font-size:.8rem;font-weight:900;margin-bottom:.38rem;}
.co-dedicated-note{color:#94a3b8;font-size:.68rem;font-weight:700;white-space:nowrap;}
.co-oneclick-btn{width:100%;border:1px solid rgba(251,191,36,.55);border-radius:8px;background:linear-gradient(135deg,#b45309,#7c2d12);color:#fff;padding:.66rem .8rem;margin:0 0 .42rem;font-size:.92rem;font-weight:900;cursor:pointer;box-shadow:0 10px 24px rgba(0,0,0,.24);}
.co-oneclick-btn:active{opacity:.86;transform:translateY(1px);}
.co-oneclick-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.co-draft-bar{display:flex;gap:.4rem;align-items:stretch;}
.co-draft{flex:1;min-width:0;min-height:54px;max-height:116px;resize:vertical;padding:.58rem .68rem;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:8px;color:#f8fafc;font-size:.9rem;line-height:1.45;outline:none;font-family:inherit;}
.co-draft:focus{border-color:#fbbf24;box-shadow:0 0 0 2px rgba(251,191,36,.12);}
.co-draft::placeholder{color:#64748b;}
.co-draft:disabled{opacity:.58;cursor:not-allowed;}
.co-send-btn{width:5.4rem;border:none;border-radius:8px;background:linear-gradient(135deg,#d97706,#7c2d12);color:#fff;font-size:.86rem;font-weight:900;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.co-send-btn:active{opacity:.84;}
.co-send-btn:disabled{opacity:.5;cursor:not-allowed;}
@media (max-width:520px){.co-draft-bar{flex-direction:column}.co-send-btn{width:100%;padding:.62rem .9rem}.co-dedicated-head{align-items:flex-start;flex-direction:column;gap:.15rem}.co-dedicated-note{white-space:normal}}
/* ── Stealth night target grid ── */
.night-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem;margin:1rem 0;}
.night-card{position:relative;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.08);border-radius:14px;padding:.9rem .4rem;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;}
.night-card:active{transform:scale(.95);}
.night-card.selected{border-color:#6b21a8;background:rgba(107,33,168,.18);}
.night-card .nc-emoji{font-size:2.2rem;line-height:1;margin-bottom:.3rem;}
.night-card .nc-name{font-size:.78rem;color:#94a3b8;font-weight:600;word-break:break-all;}
.night-card .nc-check{position:absolute;top:.3rem;right:.35rem;font-size:.9rem;opacity:0;}
.night-card.selected .nc-check{opacity:1;}
/* ── Progression / Detective Rank ── */
.levelup-banner{background:linear-gradient(135deg,#6b21a8,#4338ca);color:#fff;text-align:center;font-weight:800;padding:.7rem;border-radius:12px;margin:.5rem 0;animation:musicPulse 1.4s ease-in-out infinite;box-shadow:0 0 24px #6b21a866;}
.note-btn{display:flex;align-items:center;gap:.5rem;width:100%;text-align:left;border-radius:9px;padding:.4rem .6rem;margin:.2rem 0;color:#e2e8f0;cursor:pointer;transition:border-color .15s,background .15s;}
.xp-bar{background:rgba(255,255,255,.08);border-radius:8px;height:10px;overflow:hidden;margin:.35rem 0;}
.xp-bar > div{height:100%;background:linear-gradient(90deg,#6b21a8,#818cf8);transition:width .8s ease;}
@keyframes scorePop{0%{transform:scale(.6);opacity:0;}60%{transform:scale(1.12);}100%{transform:scale(1);opacity:1;}}
.score-pop{animation:scorePop .5s ease;}
/* ── Case file / reasoning layer ── */
.case-file{background:rgba(7,11,18,.78);border:1px solid rgba(251,191,36,.2);border-radius:8px;padding:.7rem .8rem;margin:.5rem 0;box-shadow:0 14px 34px rgba(0,0,0,.22);backdrop-filter:blur(12px);}
.case-file summary{list-style:none;color:#fbbf24;font-size:.84rem;font-weight:900;display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:0;cursor:pointer;}
.case-file summary::-webkit-details-marker{display:none;}
.case-file-body{display:grid;gap:.52rem;margin-top:.65rem;}
.case-stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:.38rem;}
.case-stat{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:.45rem .35rem;text-align:center;}
.case-stat strong{display:block;color:#f8fafc;font-size:1.05rem;line-height:1.1;}
.case-stat span{display:block;color:#64748b;font-size:.68rem;margin-top:.12rem;}
.case-mini-title{color:#94a3b8;font-size:.72rem;font-weight:800;letter-spacing:.05em;margin-bottom:.25rem;}
.case-chip-row{display:flex;flex-wrap:wrap;gap:.28rem;}
.case-chip{display:inline-flex;align-items:center;gap:.18rem;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:7px;color:#cbd5e1;font-size:.72rem;font-weight:700;padding:.18rem .45rem;}
.case-chip.suspect{background:rgba(239,68,68,.12);border-color:#ef444455;color:#fca5a5;}
.case-chip.trust{background:rgba(34,197,94,.12);border-color:#22c55e55;color:#86efac;}
.case-empty{color:#64748b;font-size:.78rem;line-height:1.5;}
.dawn-intel{background:rgba(15,23,42,.74);border:1px solid rgba(96,165,250,.22);border-radius:8px;padding:.65rem .75rem;margin:.45rem 0;color:#cbd5e1;font-size:.82rem;line-height:1.6;}
.dawn-intel strong{color:#93c5fd;}
.ai-intel-panel{background:rgba(15,23,42,.78);border:1px solid rgba(251,191,36,.24);border-radius:8px;padding:.65rem .72rem;margin:.45rem 0;color:#cbd5e1;}
.ai-intel-head{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.45rem;color:#fbbf24;font-size:.82rem;font-weight:800;}
.ai-intel-grid{display:grid;grid-template-columns:1fr;gap:.55rem;}
.ai-summary{font-size:.78rem;line-height:1.65;color:#94a3b8;margin:0;}

.ai-rank-row{display:grid;grid-template-columns:auto 1fr auto;gap:.45rem;align-items:center;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:7px;padding:.38rem .45rem;}
.ai-rank-num{color:#f87171;font-size:.72rem;font-weight:900;}
.ai-rank-name{font-size:.82rem;font-weight:800;color:#fff;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.trust-name{color:#e2e8f0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.trust-bar{height:8px;border-radius:99px;background:linear-gradient(90deg,rgba(239,68,68,.35),rgba(251,191,36,.25));overflow:hidden;border:1px solid rgba(255,255,255,.08);}

.trust-num{color:#86efac;text-align:right;font-weight:800;}
.heat-panel{background:linear-gradient(135deg,rgba(239,68,68,.12),rgba(251,191,36,.07));border:1px solid rgba(251,146,60,.28);border-radius:8px;padding:.72rem .8rem;margin:.5rem 0;color:#cbd5e1;box-shadow:0 14px 34px rgba(0,0,0,.22);backdrop-filter:blur(12px);}
.heat-head{display:flex;align-items:center;justify-content:space-between;gap:.55rem;color:#fed7aa;font-size:.82rem;font-weight:900;margin-bottom:.48rem;}
.heat-meter{height:10px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;border:1px solid rgba(255,255,255,.09);margin:.48rem 0 .42rem;}
.heat-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#34d399,#fbbf24,#ef4444);box-shadow:0 0 16px rgba(251,191,36,.24);}
.heat-grid{display:grid;gap:.42rem;margin-top:.45rem;}
.heat-line{font-size:.76rem;color:#cbd5e1;line-height:1.5;border-top:1px solid rgba(255,255,255,.06);padding-top:.36rem;}
.heat-line:first-child{border-top:none;padding-top:0;}
.heat-question{background:rgba(15,23,42,.48);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:.45rem .55rem;color:#f8fafc;font-size:.76rem;line-height:1.48;}
.spotlight-panel{background:linear-gradient(135deg,rgba(2,132,199,.13),rgba(234,88,12,.10));border:1px solid rgba(125,211,252,.25);border-radius:8px;padding:.74rem .8rem;margin:.5rem 0;color:#dbeafe;box-shadow:0 16px 36px rgba(0,0,0,.24);backdrop-filter:blur(12px);}
.spotlight-head{display:flex;align-items:center;justify-content:space-between;gap:.55rem;color:#bae6fd;font-size:.82rem;font-weight:900;margin-bottom:.42rem;}
.spotlight-tag{display:inline-flex;align-items:center;justify-content:center;min-width:4.2rem;border-radius:999px;background:rgba(14,165,233,.16);border:1px solid rgba(125,211,252,.25);color:#fef3c7;font-size:.7rem;font-weight:900;padding:.16rem .48rem;white-space:nowrap;}

.spotlight-box span{display:block;color:#cbd5e1;font-size:.76rem;}
.spotlight-question{border-top:1px solid rgba(255,255,255,.08);padding-top:.4rem;margin-top:.4rem;color:#f8fafc;font-size:.78rem;line-height:1.55;}
.spotlight-note{color:#93c5fd;font-size:.72rem;line-height:1.45;margin-top:.36rem;}
.contradiction-panel{background:linear-gradient(135deg,rgba(127,29,29,.24),rgba(15,23,42,.72));border:1px solid rgba(248,113,113,.28);border-radius:8px;padding:.72rem .78rem;margin:.5rem 0;color:#fecaca;box-shadow:0 14px 34px rgba(0,0,0,.24);}

.secret-mission-head{display:flex;align-items:center;justify-content:space-between;gap:.55rem;color:#bbf7d0;font-size:.82rem;font-weight:900;margin-bottom:.42rem;}

.pre-vote-panel{background:linear-gradient(135deg,rgba(120,53,15,.24),rgba(30,41,59,.66));border:1px solid rgba(251,191,36,.3);border-radius:8px;padding:.74rem .8rem;margin:.5rem 0;color:#fef3c7;box-shadow:0 14px 34px rgba(0,0,0,.22);}
.pre-vote-head{display:flex;align-items:center;justify-content:space-between;gap:.55rem;color:#fde68a;font-size:.82rem;font-weight:900;margin-bottom:.45rem;}

  { emoji:'🎸', label:'ピコ太郎',         hint:'奇抜な吟遊詩人。軽口で疑いを逸らす、ウン、ペンパイナップルアップルペン', src:'assets/pikotaro-werewolf-v2.png' },

function fallbackAvatarIndex(name, players) {
  const total = CHARACTER_AVATARS.length;
  if (!total) return 0;
  const idx = (players || []).findIndex(p => (p.name || p) === name);
  if (idx >= 0) return idx % total;
  const key = String(name || '');
  const genericNumber = key.match(/^(?:プレイヤー|ゲスト|P|実機P)\s*([0-9０-９]+)/);
  if (genericNumber) {
    const n = parseInt(genericNumber[1].replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)), 10);
    if (Number.isFinite(n) && n > 0) {
      let fallback = (n - 1) % total;
      if (CHARACTER_AVATARS[fallback]?.label === 'ザコシショウ') fallback = (fallback + 1) % total;
      return fallback;
    }
  }
  let hash = 0;
  for (let i = 0; i < key.length; i++) {
    hash = ((hash << 5) - hash + key.charCodeAt(i)) | 0;
  }
  let fallback = (hash >>> 0) % total;
  const looksGenericPlayerName = /^(プレイヤー|ゲスト|P\d|実機P)/.test(key);
  if (looksGenericPlayerName && CHARACTER_AVATARS[fallback]?.label === 'ザコシショウ') {
    fallback = (fallback + 1) % total;
  }
  return fallback;
}

function getAvatar(name, players) {
  const player = (players||[]).find(p => (p.name||p) === name);
  if (player && typeof player.avatarIndex === 'number' && CHARACTER_AVATARS[player.avatarIndex]) {
    return CHARACTER_AVATARS[player.avatarIndex];
  }
  if (player && player.avatarLabel) {
    const assigned = CHARACTER_AVATARS.find(a => a.label === player.avatarLabel);
    if (assigned) return assigned;
  }
  const matched = CHARACTER_AVATARS.find(a => a.label === name);
  if (matched) return matched;
  return CHARACTER_AVATARS[fallbackAvatarIndex(name, players)];
}

function assignOnlineAvatars(players) {
  const total = CHARACTER_AVATARS.length;
  const used = new Set();
  const nameToIndex = new Map(CHARACTER_AVATARS.map((a, i) => [a.label, i]));
  const exactCharacterIndex = p => nameToIndex.get(p?.name);
  const shuffled = (() => {
    const arr = Array.from({length: total}, (_, i) => i);
    for (let i=arr.length-1;i>0;i--) {
      const j = Math.floor(Math.random() * (i+1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  })();
  const nextIndex = () => {
    const fresh = shuffled.find(i => !used.has(i));
    const idx = fresh ?? Math.floor(Math.random() * total);
    used.add(idx);
    return idx;
  };
  [...(players || [])]
    .sort((a, b) => {
      const aExact = Number(Number.isInteger(exactCharacterIndex(a)));
      const bExact = Number(Number.isInteger(exactCharacterIndex(b)));
      if (aExact !== bExact) return bExact - aExact;
      return Number(!!b?.isCpu) - Number(!!a?.isCpu);
    })
    .forEach(p => {
      // 名前がキャラ名と一致する場合は、人間/CPUを問わずその画像を予約する。
      // 例: プレイヤー名が「ボブ」なら、別人にボブ画像を渡さない。
      const named = exactCharacterIndex(p);
      const idx = Number.isInteger(named) && !used.has(named) ? named : nextIndex();
      used.add(idx);
      p.avatarIndex = idx;
      p.avatarLabel = CHARACTER_AVATARS[idx]?.label || '';
    });
  return players;
}

// プールから取り出す（なければ新規作成）
function _getAudio(src) {
  if (_primedPool[src]) {

    try { a.muted = false; a.currentTime = 0; a.volume = 0.55; } catch(e) {} // プール取得時に muted 解除
    return a;
  }
  return new Audio(src);
}

function _pickSong() {
  if (_usedSongs.length >= SONGS.length) _usedSongs = [];
  const avail = SONGS.map((_,i)=>i).filter(i=>!_usedSongs.includes(i));
  const idx = avail[Math.floor(Math.random()*avail.length)];
  _usedSongs.push(idx);
  return SONGS[idx];
}

function _safeSong(src) {
  return SONGS.includes(src) ? src : _pickSong();
}

function stopMusic() {
  // _openingAudio が bgmAudio と別要素になっている場合（.catch() で bgmAudio が null になった後）も止める
  if (_openingAudio && _openingAudio !== bgmAudio) {
    const oa = _openingAudio;
    _openingAudio = null;
    try { oa.onended = null; } catch(e) {}
    try { oa.pause(); } catch(e) {}
  } else {
    _openingAudio = null;
  }
  if (!bgmAudio) return;
  const a = bgmAudio;
  bgmAudio = null;
  try { a.onended = null; } catch(e) {}
  try { a.pause(); } catch(e) {}
  // src='' はiOSで誤動作（再生継続やエラーイベント発火）するため使用しない
}

// 通常再生（プールから取得）
function playMusic(src, onEnd=null, retryCount=0) {
  stopMusic();
  const safeSrc = _safeSong(src);
  const a = _getAudio(safeSrc);
  bgmAudio = a;
  a.volume = _bgmMuted ? 0 : 0.55; // ミュート中は音量0で再生（onended は正常発火させる）
  if (onEnd) a.onended = () => { if (bgmAudio===a) { bgmAudio=null; onEnd(); } };
  const failover = () => {
    if (bgmAudio !== a) return;
    bgmAudio = null;
    if (retryCount < SONGS.length - 1) playMusic(_pickSong(), onEnd, retryCount + 1);
  };
  a.onerror = failover;
  a.play().catch(failover);
  return a;
}

// 同期再生: startedAt(ms) の時刻から再生位置を合わせる（同室複数スマホ対応）
function playMusicSync(src, startedAt, onEnd=null, retryCount=0) {
  stopMusic();
  const safeSrc = _safeSong(src);
  const a = _getAudio(safeSrc);
  bgmAudio = a;
  a.volume = _bgmMuted ? 0 : 0.55; // ミュート中は音量0で再生（onended は正常発火させる）
  if (onEnd) a.onended = () => { if (bgmAudio===a) { bgmAudio=null; onEnd(); } };
  const failover = () => {
    if (bgmAudio !== a) return;
    bgmAudio = null;
    if (retryCount < SONGS.length - 1) playMusicSync(_pickSong(), Date.now() + 150, onEnd, retryCount + 1);
  };
  a.onerror = failover;
  // _didPlay フラグで canplay + タイムアウト二重発火（iOSでの2重再生）を防ぐ
  let _didPlay = false;
  const doPlay = () => {
    if (_didPlay) return;
    _didPlay = true;
    const offset = Math.max(0, (Date.now() - startedAt) / 1000);
    if (isFinite(a.duration) && a.duration > 1 && offset < a.duration - 2) {
      try { a.currentTime = offset; } catch(e) {}
    }
    a.play().catch(failover);
  };
  // readyState >= 2 (HAVE_CURRENT_DATA) なら即再生、そうでなければ canplay 待ち
  if (a.readyState >= 2) {
    doPlay();
  } else {
    a.addEventListener('canplay', doPlay, { once: true });
    setTimeout(() => { if (bgmAudio===a && a.paused) doPlay(); }, 2000);
    a.load();
  }
  return a;
}

function fadeOutMusic(duration=1500, onDone=null) {
  // bgmAudio が null でも _openingAudio にフォールバック（.catch() で参照が切れた場合に対応）
  const a = bgmAudio || _openingAudio;
  if (!a) { if (onDone) onDone(); return; }
  if (bgmAudio === a) bgmAudio = null;
  _openingAudio = null;
  try { a.onended = null; } catch(e) {} // フェード中に onended が発火しないようにする
  const startVol = (a.volume > 0) ? a.volume : 0.55;
  const steps = 30;
  const ms = Math.max(30, duration/steps);
  let step = 0;
  const id = setInterval(() => {
    step++;
    try { a.volume = Math.max(0, startVol*(1-step/steps)); } catch(e){}
    if (step >= steps) {
      clearInterval(id);
      try{a.pause();}catch(e){}
      if (onDone) onDone();
    }
  }, ms);
}

// ========== チャット速度設定 ==========
// 議論チャットの表示速度。大きいほどゆっくり。プレイヤーが画面から変更可能。
const CHAT_SPEED_KEY = 'jinrou_chatSpeed_v2';
let chatSpeedMult = 1.75; // 既定をかなりゆっくりめに調整
function cycleChatSpeed() {
  // 超熟読(2.25) → 熟読(1.75) → ゆっくり(1.35) → 標準(1.05) → 超熟読 …
  chatSpeedMult = chatSpeedMult >= 2.15 ? 1.75 : (chatSpeedMult >= 1.65 ? 1.35 : (chatSpeedMult >= 1.25 ? 1.05 : 2.25));
  try { localStorage.setItem(CHAT_SPEED_KEY, String(chatSpeedMult)); } catch(e){}
}
function chatSpeedLabel() {
  return chatSpeedMult >= 2.15 ? '📖 超熟読' : chatSpeedMult >= 1.65 ? '📖 熟読' : chatSpeedMult >= 1.25 ? 'ゆっくり' : '標準';
}
// 起動時に保存済み速度を復元
try { const _s = parseFloat(localStorage.getItem(CHAT_SPEED_KEY)); if (_s>0) chatSpeedMult = _s; } catch(e){}
// CPUが「考え中」になる時間。速度設定の影響は控えめ（主な調整は readPause 側で行う）
function typingDelay(personality) {
  const base = personality==='aggressive' ? (1400+Math.random()*900) : (1700+Math.random()*1300);
  return Math.round(base * (0.85 + 0.18*chatSpeedMult));
}
// 発言を読む間（テキスト長に比例。速度設定をそのまま反映する主レバー）
function readPause(text) {
  const len = text ? text.length : 12;
  const raw = 1700 + len * 112;
  return Math.round(Math.max(3200, Math.min(12000, raw * chatSpeedMult)));
}

let _chatVoiceEnabled = true;
let _lastSpokenChatKey = '';
let _lastSpokenChatAt = 0;
let _chatVoiceUnlocked = false;
let _chatVoiceUnlocking = false;
let _pendingChatSpeech = [];
let _chatVoicePreferred = null;
let _chatVoicesLoadedAt = 0;

function canUseChatVoice() {
  return typeof window !== 'undefined'
    && 'speechSynthesis' in window
    && typeof window.SpeechSynthesisUtterance !== 'undefined';
}

function scoreChatVoice(voice) {
  const name = `${voice.name || ''} ${voice.voiceURI || ''}`;
  const lang = (voice.lang || '').toLowerCase();
  let score = lang.startsWith('ja') ? 100 : 0;
  if (/google|microsoft|apple|siri|kyoko|otoya|nanami|sayaka|haruka|ichiro|premium|enhanced|natural|online/i.test(name)) score += 35;
  if (/compact|eloquence|robot|default/i.test(name)) score -= 20;
  if (voice.localService === false) score += 8;
  return score;
}

function refreshChatVoices() {
  if (!canUseChatVoice()) return [];
  let voices = [];
  try { voices = window.speechSynthesis.getVoices() || []; } catch(e) {}
  if (voices.length) {
    _chatVoicesLoadedAt = Date.now();
    _chatVoicePreferred = voices
      .filter(v => (v.lang || '').toLowerCase().startsWith('ja'))
      .sort((a,b) => scoreChatVoice(b) - scoreChatVoice(a))[0] || null;
  }
  return voices;
}

function getChatVoice() {
  if (!_chatVoicePreferred || Date.now() - _chatVoicesLoadedAt > 5000) refreshChatVoices();
  return _chatVoicePreferred;
}

function chatVoiceLabel() {
  if (!canUseChatVoice()) return '🔇 非対応';
  if (!_chatVoiceUnlocked) return '🔊 音声ON';
  return _chatVoicePreferred ? '🔊 自然音声' : '🔊 音声ON';
}

function chatVoiceStatus() {
  const supported = canUseChatVoice();
  const voice = supported ? getChatVoice() : null;
  return {
    supported,
    unlocked: _chatVoiceUnlocked,
    pending: _pendingChatSpeech.length,
    voiceName: voice ? (voice.name || voice.voiceURI || '日本語音声') : '',
    lang: voice ? (voice.lang || '') : ''
  };
}

function renderChatVoiceAssistPanel() {
  const st = chatVoiceStatus();
  if (!st.supported) {
    return `<div class="voice-assist warn">
      <div class="voice-assist-title">この端末はチャット音声に非対応です</div>
      <p class="voice-assist-text">Chrome / Safari の最新版、または端末の読み上げ音声設定を確認してください。P2Pでも音声は各スマホ側で再生されます。</p>
    </div>`;
  }
  const cls = st.unlocked ? 'ok' : 'warn';
  const title = st.unlocked ? 'チャット音声は有効です' : 'スマホ音声を有効化';
  const voiceLine = st.voiceName
    ? `使用中: ${esc(st.voiceName)}${st.lang ? ` / ${esc(st.lang)}` : ''}`
    : '端末の日本語音声を使用します';
  const pendingLine = st.pending ? ` 未再生の発言が${st.pending}件あります。` : '';
  const text = st.unlocked
    ? `${voiceLine}。${pendingLine}`
    : 'スマホでは最初のタップ後に音声が有効になります。聞こえない端末はこのボタンで解除とテスト再生をしてください。';
  return `<div class="voice-assist ${cls}">
    <div class="voice-assist-title">${title}</div>
    <p class="voice-assist-text">${text}</p>
    <button class="voice-assist-btn" id="btnChatVoiceEnable">${st.unlocked ? '音声テスト' : '音声を有効化してテスト'}</button>
  </div>`;
}

function flushPendingChatSpeech() {
  if (!_pendingChatSpeech.length || !_chatVoiceUnlocked) return;
  const pending = _pendingChatSpeech.splice(-8);
  pending.forEach((item, i) => {
    setTimeout(() => speakChatMessage(item.name, item.text), i * 280);
  });
}

function unlockChatVoice() {
  if (!_chatVoiceEnabled || !canUseChatVoice() || _chatVoiceUnlocked || _chatVoiceUnlocking) return;
  _chatVoiceUnlocking = true;
  const finish = () => {
    _chatVoiceUnlocked = true;
    _chatVoiceUnlocking = false;
    flushPendingChatSpeech();
  };
  try {
    if (typeof window.speechSynthesis.resume === 'function') window.speechSynthesis.resume();
    refreshChatVoices();
    const utter = new window.SpeechSynthesisUtterance('。');
    const voice = getChatVoice();
    if (voice) utter.voice = voice;
    utter.lang = 'ja-JP';
    utter.volume = 0;
    utter.rate = 1;
    utter.onend = finish;
    utter.onerror = finish;
    window.speechSynthesis.speak(utter);
    setTimeout(finish, 260);
  } catch(e) {
    finish();
  }
}

function installChatVoiceUnlock() {
  if (typeof window === 'undefined') return;
  refreshChatVoices();
  if (canUseChatVoice()) {
    try { window.speechSynthesis.addEventListener('voiceschanged', refreshChatVoices); } catch(e) {}
    setTimeout(refreshChatVoices, 400);
    setTimeout(refreshChatVoices, 1200);
  }
  ['pointerdown', 'touchstart', 'click', 'keydown'].forEach(type => {
    try {
      window.addEventListener(type, unlockChatVoice, { capture:true, passive:true });
    } catch(e) {
      window.addEventListener(type, unlockChatVoice, true);
    }
  });
}

function cleanSpeechText(text) {
  return String(text || '')
    .replace(/[🐺🔍👁🗳❓⚠️👀🔴🧐😤🃏✋👻🤫😶🚨🛡🔄🧮🎭⏱📋🎤👁️🙏😊📝🔮⏳⚪🧊🧭📈🔁🧠✅💙😡🤷⚖️🌟🚫🪤✨👍🤝💯🎯🙋🙌⚡💥🖤💊🐱🛑💔🌙]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

const SPEECH_NAME_READINGS = {
  '沢枝': 'さわえだ',
  '人狼': 'じんろう'
};

function applySpeechReadings(text) {
  let out = String(text || '');
  Object.entries(SPEECH_NAME_READINGS).forEach(([name, reading]) => {
    out = out.split(name).join(reading);
  });
  return out;
}

function speakChatMessage(name, text) {
  if (!_chatVoiceEnabled || !canUseChatVoice()) return;
  const clean = cleanSpeechText(text);
  if (!clean) return;
  const key = `${name}\n${clean}`;
  if (!_chatVoiceUnlocked) {
    _pendingChatSpeech.push({ name, text });
    if (_pendingChatSpeech.length > 12) _pendingChatSpeech.shift();
    return;
  }
  const now = Date.now();
  if (_lastSpokenChatKey === key && now - _lastSpokenChatAt < 2500) return;
  _lastSpokenChatKey = key;
  _lastSpokenChatAt = now;
  try {
    if (typeof window.speechSynthesis.resume === 'function') window.speechSynthesis.resume();
    const spokenName = applySpeechReadings(name);
    const spokenText = applySpeechReadings(clean);
    const utter = new window.SpeechSynthesisUtterance(`${spokenName}。${spokenText}`);
    const voice = getChatVoice();
    if (voice) utter.voice = voice;
    utter.lang = 'ja-JP';
    utter.rate = 0.94;
    utter.pitch = 1.0;
    utter.volume = 1.0;
    window.speechSynthesis.speak(utter);
  } catch(e) {}
}

function appendIncomingChatOnce(list, msg) {
  const last = list[list.length - 1];
  if (last && last.name === msg.name && last.text === msg.text) return false;
  list.push(msg);
  return true;
}

function appendDiscussMessageOnce(msg) {
  if (!appendIncomingChatOnce(O.discMsgs, msg)) return false;
  if (!O.intelMsgs) O.intelMsgs = [];
  appendIncomingChatOnce(O.intelMsgs, {...msg, day: O.day});
  speakChatMessage(msg.name, msg.text);
  if (!O.deadPlayers.find(d=>d.name===msg.name)) {
    const explicitClaim = detectExplicitRoleClaim(msg.text);
    if (explicitClaim) O.roleClaims[msg.name] = explicitClaim;
  }
  return true;
}

function detectExplicitRoleClaim(text) {
  const t = String(text || '').replace(/\s+/g, '');
  if (!t) return null;
  const rolePatterns = {
    SEER: [
      /(?:私|わたし|自分|僕|俺|うち)(?:が|は|の役職は)?占い師(?:です|だ|でした|である)?(?:。|、|!|！|$)/,
      /占い師(?:として)?(?:CO|カミングアウト)(?:します|する|しました|です|だ|。|、|!|！|$)/,
      /占い師として(?:名乗|宣言|報告|出ます|出る)/,
      /(?:CO|カミングアウト)(?:します|する|しました)?(?:。|、)?占い師(?:です|として|だ|。|、|!|！|$)/
    ],
    DOCTOR: [
      /(?:私|わたし|自分|僕|俺|うち)(?:が|は|の役職は)?騎士(?:です|だ|でした|である)?(?:。|、|!|！|$)/,
      /騎士(?:として)?(?:CO|カミングアウト)(?:します|する|しました|です|だ|。|、|!|！|$)/,
      /騎士として(?:名乗|宣言|報告|出ます|出る)/,
      /騎士です(?:。|、|!|！|$)/,
      /(?:CO|カミングアウト)(?:します|する|しました)?(?:。|、)?騎士(?:です|として|だ|。|、|!|！|$)/
    ],
    MEDIUM: [
      /(?:私|わたし|自分|僕|俺|うち)(?:が|は|の役職は)?霊媒師?(?:です|だ|でした|である)?(?:。|、|!|！|$)/,
      /霊媒師?(?:として)?(?:CO|カミングアウト)(?:します|する|しました|です|だ|。|、|!|！|$)/,
      /霊媒師?として(?:名乗|宣言|報告|出ます|出る)/,
      /(?:CO|カミングアウト)(?:します|する|しました)?(?:。|、)?霊媒師?(?:です|として|だ|。|、|!|！|$)/
    ],
    NEKOMATA: [
      /(?:私|わたし|自分|僕|俺|うち)(?:が|は|の役職は)?猫又(?:です|だ|でした|である)?(?:。|、|!|！|$)/,
      /猫又(?:として)?(?:CO|カミングアウト)(?:します|する|しました|です|だ|。|、|!|！|$)/,
      /猫又として(?:名乗|宣言|報告|出ます|出る)/,
      /猫又です(?:。|、|!|！|$)/,
      /猫又なので/,
      /(?:CO|カミングアウト)(?:します|する|しました)?(?:。|、)?猫又(?:です|として|だ|。|、|!|！|$)/
    ],
    SHARED: [
      /(?:私|わたし|自分|僕|俺|うち)(?:が|は|の役職は)?共有者?(?:です|だ|でした|である)?(?:。|、|!|！|$)/,
      /共有者?(?:として)?(?:CO|カミングアウト)(?:します|する|しました|です|だ|。|、|!|！|$)/,
      /共有者?として(?:名乗|宣言|報告|出ます|出る)/,
      /共有(?:です|CO|者CO)(?:。|、|!|！|$)/,
      /(?:CO|カミングアウト)(?:します|する|しました)?(?:。|、)?共有者?(?:です|として|だ|。|、|!|！|$)/
    ],
    VILLAGER: [
      /(?:私|わたし|自分|僕|俺|うち)(?:が|は|の役職は)?(?:村人|素村)(?:です|だ|でした|である)?(?:。|、|!|！|$)/,
      /(?:村人|素村)(?:として)?(?:CO|カミングアウト)(?:します|する|しました|です|だ|。|、|!|！|$)/,
      /(?:村人|素村)CO(?:します|する|しました|です|だ|。|、|!|！|$)/,
      /(?:私|わたし|自分|僕|俺|うち)?(?:は|が)?役職COはありません(?:。|、|!|！|$)/,
      /役職なし(?:です|だ|。|、|!|！|$)/
    ],
  };
  for (const [role, patterns] of Object.entries(rolePatterns)) {
    if (patterns.some(re => re.test(t))) return role;
  }
  return null;
}

function detectBrainwashClaim(text) {
  const t = String(text || '').replace(/\s+/g, '');
  return /洗脳(?:された|され|被害)|操作票|票(?:が|を).{0,12}(?:操作|強制)/.test(t);
}

function clampNum(v, min, max) {
  return Math.max(min, Math.min(max, Number.isFinite(v) ? v : min));
}

function analyzeDiscussionIntel() {
  const aliveList = O.alive || [];
  const aliveNames = aliveList.map(p => p.name);
  const scores = {};
  aliveNames.forEach(name => {
    scores[name] = { name, suspicion: 0, trust: 0, reasons: [] };
  });
  const add = (name, kind, amount, reason) => {
    const s = scores[name];
    if (!s) return;
    if (kind === 'trust') s.trust += amount;
    else s.suspicion += amount;
    if (reason && s.reasons.length < 3) s.reasons.push(reason);
  };
  const suspectRe = /怪しい|疑|黒|人狼|投票|処刑|吊|矛盾|嘘|騙|不自然|沈黙|発言少な|隠|違和感|怪し/;
  const trustRe = /信頼|信用|白|村人|安全|守って|かば|反対|村目線|無実|怪しくない|白確|仲間/;
  const intelMsgs = (O.intelMsgs && O.intelMsgs.length) ? O.intelMsgs : (O.discMsgs || []);
  intelMsgs.forEach(m => {
    const text = String(m.text || '');
    const claim = detectExplicitRoleClaim(text);
    if (claim) add(m.name, 'trust', 8, `${ROLES[claim]?.name || '役職'}CO`);
    aliveNames.forEach(name => {
      if (name === m.name || !text.includes(name)) return;
      if (suspectRe.test(text)) add(name, 'suspicion', 12, `${m.name}が疑い`);
      if (trustRe.test(text)) add(name, 'trust', 11, `${m.name}が信用`);
    });
  });
  Object.entries(O.notebook || {}).forEach(([name, mark]) => {
    if (mark === 'suspect') add(name, 'suspicion', 16, 'あなたの疑惑メモ');
    if (mark === 'trust') add(name, 'trust', 16, 'あなたの信用メモ');
  });
  const claimsByRole = {};
  Object.entries(O.roleClaims || {}).forEach(([name, role]) => {
    if (!aliveNames.includes(name)) return;
    if (!claimsByRole[role]) claimsByRole[role] = [];
    claimsByRole[role].push(name);
    add(name, 'trust', role === 'SHARED' ? 12 : 6, `${ROLES[role]?.name || '役職'}CO`);
  });
  Object.entries(claimsByRole).forEach(([role, names]) => {
    if (names.length <= 1) return;
    const penalty = role === 'SHARED' ? 16 : 12;
    names.forEach(name => add(name, 'suspicion', penalty, '対抗COあり'));
  });
  const voteMaps = [
    ...(O.voteHistory || []).map(v => v.votes),
    O.voteResult?.votes,
  ].filter(Boolean);
  voteMaps.forEach(votes => {
    Object.entries(votes || {}).forEach(([voter, target]) => {
      if (!aliveNames.includes(target)) return;
      add(target, 'suspicion', 9, `${voter}の投票`);
      const rb = rivalryBias(voter, target);
      if (rb) add(target, 'suspicion', Math.round(5 + rb * 3), `${voter}との因縁票`);
    });
  });
  [...(O.voteHistory || []), O.voteResult].forEach(history => {
    const preliminary = history?.preVotes || history?.pre_votes || {};
    const finalVotes = history?.votes || {};
    Object.entries(preliminary).forEach(([voter, target]) => {
      if (!aliveNames.includes(voter) || !target || !finalVotes[voter] || finalVotes[voter] === target) return;
      add(voter, 'suspicion', 8, '仮投票を変更');
    });
  });
  Object.entries(O.voteResult?.voteReasons || {}).forEach(([voter, reason]) => {
    const text = String(reason || '');
    aliveNames.forEach(name => {
      if (name === voter || !text.includes(name)) return;
      if (suspectRe.test(text) || /怪しい|疑|投票|処刑|吊|矛盾|黒|人狼|不自然/.test(text)) {
        add(name, 'suspicion', 7, `${voter}の投票理由`);
      }
    });
  });
  const rivalryPairs = activeRivalryPairs(aliveNames);
  rivalryPairs.forEach(pair => {
    add(pair.to, 'suspicion', Math.round(4 + pair.bias * 2), `${pair.from}との因縁`);
  });
  const rows = Object.values(scores).map(s => {
    const suspicionScore = clampNum(Math.round(34 + s.suspicion - s.trust * 0.42), 0, 100);
    const trustScore = clampNum(Math.round(58 + s.trust - s.suspicion * 0.48), 0, 100);
    return {
      name: s.name,
      suspicionScore,
      trustScore,
      reason: s.reasons[0] || '発言待ち',
    };
  });
  const ranking = [...rows].sort((a,b)=>b.suspicionScore-a.suspicionScore).slice(0, 5);
  const trusted = [...rows].sort((a,b)=>b.trustScore-a.trustScore)[0];
  const coCount = Object.keys(O.roleClaims || {}).filter(n => aliveNames.includes(n)).length;
  const msgCount = intelMsgs.length;
  const top = ranking[0];
  const summary = msgCount
    ? `発言${msgCount}件、CO${coCount}件。現在は${top ? `${top.name}さんへの疑い` : '疑い先'}が最も強く、${trusted ? `${trusted.name}さんが信用寄り` : '信用位置は未確定'}です。`
    : 'まだ議論データがありません。発言が増えると、疑惑と信用が蓄積されます。';
  const highlights = [];
  if (top) highlights.push(`最警戒: ${top.name}さん (${top.suspicionScore})`);
  if (trusted) highlights.push(`信用軸: ${trusted.name}さん (${trusted.trustScore})`);
  if (rivalryPairs[0]) highlights.push(`火種: ${rivalryPairs[0].from} → ${rivalryPairs[0].to}`);
  return { ranking, rows, summary, msgCount, highlights, rivalryPairs };
}

function analyzeDiscussionHeat() {
  const aliveNames = (O.alive || []).map(p => p.name || p).filter(Boolean);
  const msgs = ((O.intelMsgs && O.intelMsgs.length) ? O.intelMsgs : O.discMsgs) || [];
  const intel = analyzeDiscussionIntel();
  const top = intel.ranking?.[0];
  const claimsByRole = {};
  Object.entries(O.roleClaims || {}).forEach(([name, role]) => {
    if (!aliveNames.includes(name)) return;
    if (!claimsByRole[role]) claimsByRole[role] = [];
    claimsByRole[role].push(name);
  });
  const conflictRoles = Object.entries(claimsByRole).filter(([, names]) => names.length > 1);
  const lastVote = (O.voteHistory && O.voteHistory.length) ? O.voteHistory[O.voteHistory.length - 1] : O.voteResult;
  const voteTargets = Object.values(lastVote?.votes || {}).filter(Boolean);
  const uniqueVoteTargets = new Set(voteTargets).size;
  const rivalryPairs = activeRivalryPairs(aliveNames);
  const reasonCount = Object.keys(O.voteResult?.voteReasons || {}).filter(k => O.voteResult.voteReasons[k]).length;
  let heat = 18;
  heat += Math.min(28, msgs.length * 3);
  heat += conflictRoles.length * 18;
  heat += Math.min(18, uniqueVoteTargets * 4);
  heat += Math.min(14, rivalryPairs.length * 4);
  heat += top ? Math.max(0, top.suspicionScore - 55) * .45 : 0;
  heat += Math.min(10, reasonCount * 2);
  heat = clampNum(Math.round(heat), 0, 100);

  const flashpoints = [];
  if (top) flashpoints.push(`${top.name}さんに疑いが集中しています（疑惑${top.suspicionScore}）。`);
  conflictRoles.forEach(([role, names]) => {
    flashpoints.push(`${ROLES[role]?.name || role}COが${names.length}人で対立: ${names.join(' / ')}`);
  });
  if (uniqueVoteTargets >= 3) flashpoints.push(`前回投票が${uniqueVoteTargets}方向に割れ、便乗票や身内切りが疑われます。`);
  if (rivalryPairs[0]) flashpoints.push(`${rivalryPairs[0].from}さんと${rivalryPairs[0].to}さんの因縁が議論を荒らしています。`);
  if (!flashpoints.length && msgs.length) flashpoints.push('発言は増えていますが、まだ決定的な争点は薄めです。理由を深掘りすると場が動きます。');
  if (!flashpoints.length) flashpoints.push('まだ静かな立ち上がりです。最初のCO、投票理由、沈黙位置を確認しましょう。');

  const questions = [];
  if (top) questions.push(`${top.name}さんへ: いま一番疑っている相手と、その理由を一文で言わせる。`);
  if (conflictRoles[0]) questions.push(`${conflictRoles[0][1].join(' / ')}へ: COタイミングと結果を順番に確認する。`);
  if (lastVote?.votes) questions.push('票が集まった人へ: 自分投票者の中で一番便乗に見える人を指名させる。');

function analyzeLocalDiscussionHeat() {
  const players = S.players || [];
  const aliveNames = players.filter(p => p.alive).map(p => p.name);
  const voteResult = S.voteResult || {};
  const votes = voteResult.votes || S.votes || {};
  const voteTargets = Object.values(votes).filter(Boolean);
  const uniqueVoteTargets = new Set(voteTargets).size;
  const tallyEntries = Object.entries(voteResult.tally || {}).sort(([, a], [, b]) => b - a);
  const topVote = tallyEntries[0];
  const seerHistory = S.seerHistory || [];
  const wolfFinds = seerHistory.filter(r => r.isWolf);
  const deadCount = players.filter(p => !p.alive).length;
  const reasonCount = Object.keys(voteResult.voteReasons || S.voteReasons || {}).filter(Boolean).length;
  let heat = 18 + Math.min(22, (S.day || 1) * 7) + Math.min(18, deadCount * 5);
  heat += Math.min(18, uniqueVoteTargets * 5);
  heat += Math.min(14, seerHistory.length * 6);
  heat += Math.min(10, wolfFinds.length * 10);
  heat += Math.min(10, reasonCount * 2);
  heat = clampNum(Math.round(heat), 0, 100);

  const flashpoints = [];
  if (topVote) flashpoints.push(`${topVote[0]}さんに票が集まっています（${topVote[1]}票）。`);

  if (wolfFinds[0]) flashpoints.push(`占いで${wolfFinds[0].target}さんに黒判定が出ています。対抗や反応が争点です。`);

  if (wolfFinds[0]) questions.push(`${wolfFinds[0].target}さんへ: 黒判定への反論と、占い師をどう見ているかを聞く。`);

  if (aliveNames.length) questions.push('全員へ: 今日の吊り候補を一人だけ挙げ、理由を短く言わせる。');
  return { heat, flashpoints: flashpoints.slice(0, 4), questions: questions.slice(0, 4) };

function contradictionLabel(score) {
  if (score >= 86) return '危険';

}

function buildStatementLedger(msgs, names) {
  const aliveSet = new Set(names || []);
  const ledger = {};
  const ensure = name => {
    if (!ledger[name]) ledger[name] = { name, suspects:new Set(), trusts:new Set(), mentions:new Set(), claims:new Set(), count:0 };
    return ledger[name];
  };
  const suspectRe = /怪しい|疑|黒|人狼|投票|処刑|吊|矛盾|嘘|騙|不自然|沈黙|発言少な|違和感|怪し/;
  const trustRe = /信頼|信用|白|村人|安全|守って|かば|村目線|無実|怪しくない|白確|仲間/;
  (msgs || []).forEach(m => {
    const speaker = m.name || '';
    if (!speaker) return;
    const text = String(m.text || '');
    const row = ensure(speaker);
    row.count += 1;
    const claim = detectExplicitRoleClaim(text);
    if (claim) row.claims.add(claim);
    names.forEach(target => {
      if (target === speaker || !aliveSet.has(target) || !text.includes(target)) return;
      row.mentions.add(target);
      const trustHit = trustRe.test(text);
      const suspectHit = suspectRe.test(text) && !/怪しくない|無実|白っぽい|白い/.test(text);
      if (trustHit) row.trusts.add(target);
      if (suspectHit) row.suspects.add(target);
    });
  });
  return ledger;
}

  return `<div class="contradiction-panel">
    <div class="contradiction-head"><span>矛盾スキャナー</span><span class="contradiction-tag">${tag}</span></div>
    <div class="contradiction-list">${rows || empty}</div>
  </div>`;

function buildContradictionScan() {
  if (!['day','discuss','vote','vote_result'].includes(O.phase)) return null;
  const names = (O.alive || O.players || []).map(p => p.name || p).filter(Boolean);
  if (!names.length) return null;
  const msgs = ((O.intelMsgs && O.intelMsgs.length) ? O.intelMsgs : O.discMsgs) || [];
  const ledger = buildStatementLedger(msgs, names);
  const alerts = [];
  const add = (score, title, detail) => {
    if (!title || alerts.some(a => a.title === title && a.detail === detail)) return;
    alerts.push({ score: clampNum(Math.round(score), 0, 100), title, detail });
  };

  Object.values(ledger).forEach(row => {
    if (row.claims.size > 1) {
      add(92, `${row.name}さんのCOが揺れています`, `複数役職を匂わせています: ${[...row.claims].map(r => ROLES[r]?.name || r).join(' / ')}`);
    }
    [...row.suspects].forEach(target => {
      if (row.trusts.has(target)) {
        add(76, `${row.name}さんの評価がブレています`, `${target}さんを疑う発言と信用する発言が混在。理由を聞く価値あり。`);
      }
    });
  });

  const claimsByRole = {};
  Object.entries(O.roleClaims || {}).forEach(([name, role]) => {
    if (!names.includes(name)) return;
    if (!claimsByRole[role]) claimsByRole[role] = [];
    claimsByRole[role].push(name);
  });
  Object.entries(claimsByRole).forEach(([role, claimers]) => {
    if (claimers.length > 1) add(82, `${ROLES[role]?.name || role}COが対抗しています`, `${claimers.join(' / ')} の発言順、結果、投票先を比較。`);
  });

  const lastVote = (O.voteHistory && O.voteHistory.length) ? O.voteHistory[O.voteHistory.length - 1] : O.voteResult;
  const votes = lastVote?.votes || {};
  const tally = {};
  Object.values(votes).forEach(t => { if (t) tally[t] = (tally[t] || 0) + 1; });
  Object.entries(votes).forEach(([voter, target]) => {
    if (!target) return;
    const row = ledger[voter] || { suspects:new Set(), trusts:new Set(), mentions:new Set() };
    const suspected = [...row.suspects].filter(n => n !== target);
    if (row.trusts.has(target)) {
      add(78, `${voter}さんの投票が発言と逆です`, `${target}さんを信用寄りに見せた後で投票しています。`);
    } else if (suspected.length && !row.suspects.has(target)) {
      add(66, `${voter}さんの疑い先と投票先がズレています`, `発言では${suspected.slice(0,2).join(' / ')}さんを疑い、票は${target}さんへ。`);
    } else if (!row.mentions.has(target) && tally[target] >= 2) {
      add(54, `${voter}さんに便乗票の気配`, `${target}さんへ投票していますが、事前発言で触れた形跡が薄いです。`);
    }
  });

  const maxScore = alerts.reduce((m, a) => Math.max(m, a.score), 0);
  if (!alerts.length && !msgs.length && !Object.keys(votes).length) return null;
  return {
    maxScore,
    alerts: alerts.sort((a,b)=>b.score-a.score).slice(0, 4),
    emptyLine: msgs.length
      ? '発言と投票の大きな矛盾はまだ薄めです。次は投票理由とCOの変化を見ます。'
      : 'まだ発言データが少ないため、矛盾検出は控えめです。'
  };
}

function buildInferenceTrial() {
  if (!['day','discuss','vote','vote_result'].includes(O.phase)) return null;
  const names = (O.alive || O.players || []).map(p => p.name || p).filter(Boolean);
  if (names.length < 3) return null;
  const msgs = ((O.intelMsgs && O.intelMsgs.length) ? O.intelMsgs : O.discMsgs) || [];
  const intel = analyzeDiscussionIntel();
  const heat = analyzeDiscussionHeat();
  const scan = buildContradictionScan();
  const ledger = buildStatementLedger(msgs, names);
  const lastVote = (O.voteHistory && O.voteHistory.length) ? O.voteHistory[O.voteHistory.length - 1] : O.voteResult;
  const votes = lastVote?.votes || {};
  const tallyTop = Object.entries(lastVote?.tally || {}).sort(([,a],[,b]) => b-a)[0];
  const top = intel.ranking?.[0];
  const target = top?.name || tallyTop?.[0] || Object.values(votes).find(Boolean) || names[0];
  const trusted = [...(intel.rows || [])].filter(r => r.name !== target).sort((a,b)=>b.trustScore-a.trustScore)[0];
  const rivalry = activeRivalryPairs(names).find(p => p.to === target || p.from === target) || activeRivalryPairs(names)[0];
  const targetVoters = Object.entries(votes).filter(([, t]) => t === target).map(([v]) => v);
  const accuserFromSpeech = Object.values(ledger).filter(r => r.name !== target && r.suspects.has(target)).sort((a,b)=>b.count-a.count)[0]?.name;
  const accuser = accuserFromSpeech || targetVoters[0] || rivalry?.from || firstAvailableName(names, [target]);
  const defenderFromSpeech = Object.values(ledger).filter(r => r.name !== target && r.name !== accuser && r.trusts.has(target)).sort((a,b)=>b.count-a.count)[0]?.name;
  const defender = defenderFromSpeech || trusted?.name || firstAvailableName(names, [target, accuser]);
  const witness = targetVoters.find(n => n !== accuser && n !== defender)
    || (rivalry && firstAvailableName([rivalry.from, rivalry.to], [target, accuser, defender]))
    || firstAvailableName(names, [target, accuser, defender]);
  const conflictRoles = {};
  Object.entries(O.roleClaims || {}).forEach(([name, role]) => {
    if (!names.includes(name)) return;
    if (!conflictRoles[role]) conflictRoles[role] = [];
    conflictRoles[role].push(name);
  });
  const conflict = Object.entries(conflictRoles).find(([, claimers]) => claimers.length > 1 && claimers.includes(target));
  const contradictionMax = scan?.maxScore || 0;
  const tension = clampNum(Math.round(
    heat.heat * .38 +
    (top?.suspicionScore || 36) * .28 +
    contradictionMax * .22 +
    (conflict ? 10 : 0) +
    (targetVoters.length >= 2 ? 6 : 0) +
    (O.phase === 'vote' ? 6 : 0)
  ), 0, 100);

  let topic = `${target}さんを今日吊るべきか、残して情報を取るべきかを裁判形式で決めます。`;
  if (conflict) {
    topic = `${ROLES[conflict[0]]?.name || conflict[0]}CO裁判: ${conflict[1].join(' / ')} のどちらを信用するか。`;
  } else if (scan?.alerts?.[0]) {
    topic = `矛盾裁判: ${scan.alerts[0].title}。${scan.alerts[0].detail}`;
  } else if (rivalry && (rivalry.from === target || rivalry.to === target)) {
    topic = `因縁裁判: ${rivalry.from}さんと${rivalry.to}さんの対立が推理か感情かを見極めます。`;
  } else if ((msgs.length || 0) < Math.ceil(names.length * .65)) {
    topic = '沈黙裁判: 発言が薄い村で、吊り理由を全員から引き出します。';
  }

  const steps = [
    `${accuser || '追及役'}さん: ${target}さんを疑う理由を一つだけ選び、証拠を短く出す。`,
    `${target}さん: その疑いが推理・感情・便乗のどれかを切り分けて反論する。`,
    `${witness || '証人役'}さん: 投票、CO、発言のどれが一番信用できる情報かを宣言する。`,
    `${defender || '弁護役'}さん: ${target}さんを残すメリットがあるか、吊るなら代替候補がいるかを言う。`,
  ];
  const verdict = tension >= 64
    ? '判定条件: 被告の反論が弱い、または追及役の証拠が具体的なら吊り候補に固定。逆に追及理由が薄ければ追及役も疑い返し。'
    : '判定条件: まだ決め打たず、発言量と投票理由をそろえてから吊り先を固める。';

  return { label: trialLabel(tension), tension, target, accuser, defender, witness, topic, steps, verdict };
}

    add('投票先を割る', '今日は候補を一人に固定しすぎず、投票理由を出してから最後に合わせたいです。便乗票を見たいです。', 'vote');
  } else {

  }

  if (uniqueVoteTargets >= 3) add('票割れ確認', `前回の票が${uniqueVoteTargets}方向に割れています。票を変える人は、変える理由と新しい候補を先に出してください。`, 'vote');

  return {

    targetLine: target ? `${target}さんを軸に場を動かす` : '発言とCOを整理する',

  };

  let done = progress >= 80;

  if (black) {
    const blackVotes = Object.values(votes).filter(v => v === black.target).length;
    title = `黒判定を裁く: ${black.target}さんを吊るか残すか決める`;
    goal = '占い結果を鵜呑みにせず、黒先の反論と占い師の信用を比べる。';
    condition = `${black.target}さんへの票、または黒判定に触れた理由を残す。`;
    hint = '黒を吊らない場合は、代わりに誰を吊るのかまで言うと議論が締まります。';
    progress = clampNum(Math.round((blackVotes / Math.max(1, names.length)) * 70 + (reasonCount ? 30 : 0)), 0, 100);
    done = progress >= 75;
  } else if (target) {
    const targetVotes = Object.values(votes).filter(v => v === target).length;
    title = `最多票を検証する: ${target}さん票は自然か`;
    goal = '票が集まった理由を見て、便乗票と本気票を分ける。';
    condition = `${target}さんへの投票理由を一つ以上残す。`;
    hint = '票が集まった人より、最後に乗った人の理由を見ると人狼が見えます。';
    progress = clampNum(Math.round((targetVotes ? 45 : 0) + reasonCount * 18), 0, 100);
    done = progress >= 80;
  }

  return { title, goal, condition, hint, progress, status: missionStatus(done, progress) };
}

function renderLocalSecretMissionPanel() {
  return renderSecretMission(buildLocalSecretMission());
}

function renderPreVotePanel(actionLocked=false) {
  if (O.phase !== 'discuss') return '';
  const aliveNames = (O.alive || []).map(p => p.name || p).filter(Boolean);
  const myName = O.playerName;
  if (!myName || !aliveNames.includes(myName) || aliveNames.length < 2) return '';
  const targets = aliveNames.filter(name => name !== myName);
  const preVotes = O.preVotes || {};
  const changes = O.preVoteChanges || {};
  const mine = preVotes[myName] || '';
  const draft = targets.includes(O.preVoteTargetDraft) ? O.preVoteTargetDraft : mine;
  const changed = Number(changes[myName] || 0);
  const canChange = !!mine && changed < 1;
  const canSend = !actionLocked && !O.preVotePending && (!mine || canChange);
  const rows = aliveNames.map(name => {
    const target = preVotes[name] || '';
    const isMine = name === myName;
    const changeMark = Number(changes[name] || 0) > 0 ? '<span class="pre-vote-change">票替え</span>' : '';
    const mineMark = isMine ? '<span class="pre-vote-mine">あなた</span>' : '';
    return `<div class="pre-vote-row${isMine?' mine':''}">
      <b>${esc(name)}</b><span>→</span>
      <span class="${target?'pre-vote-target':'pre-vote-empty'}">${target ? esc(target) : '未宣言'}</span>
      ${changeMark || mineMark}
    </div>`;
  }).join('');
  const options = [
    `<option value="" ${draft?'':'selected'}>相手を選択</option>`,
    ...targets.map(name => `<option value="${esc(name)}" ${draft===name?'selected':''}>${esc(name)}</option>`)
  ].join('');
  const label = actionLocked ? '再接続中' : O.preVotePending ? '受理待ち...' : mine ? (canChange ? '票替えを宣言' : '票替え済み') : '仮投票を宣言';
  return `<section class="pre-vote-panel">
    <div class="pre-vote-head"><span>🌙 月下の仮投票</span><span class="pre-vote-status">公開 ${Object.keys(preVotes).length}/${aliveNames.length}</span></div>
    <div class="pre-vote-list">${rows}</div>
    <div class="pre-vote-form">
      <select id="preVoteTarget" ${canSend?'':'disabled'}>${options}</select>
      <button id="preVoteSend" class="pre-vote-send" ${canSend?'':'disabled'}>${label}</button>
    </div>
  </section>`;
}

function renderVoteReasons(reasons) {

  return `<div class="vote-reasons">

function renderRivalryPanel() {

function renderDawnNewspaper() {
  if (!['day','discuss','vote','vote_result'].includes(O.phase)) return '';
  const lines = [];
  const victim = O.eliminatedLastNight;
  if (victim?.name) lines.push(`昨夜の犠牲者は ${victim.name} さん。村の空気が一段重くなりました。`);

function playerStateByName(name) {

    || (O.alive || []).find(p => p.name === name)
    || null;
}

function isP2PDisconnected(nameOrPlayer) {
  const p = typeof nameOrPlayer === 'string' ? playerStateByName(nameOrPlayer) : nameOrPlayer;
  if (!p) return false;
  const byRoster = typeof nameOrPlayer !== 'string' && p.name ? playerStateByName(p.name) : null;
  return !!(p.disconnected || byRoster?.disconnected);

function connectionBadge(nameOrPlayer) {

}

function playerChipHtml(player, opts={}) {

function disconnectedPlayers() {
  return (O.players || []).filter(p => p.disconnected);
}

function disconnectedNames() {
  return disconnectedPlayers().map(p => p.name);
}

function disconnectedAgeText(player) {
  const at = Number(player?.disconnectedAt || 0);

function renderP2PPresenceStrip() {
