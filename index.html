}
initOnline();

function wsConnect(addr, onOpen) {
  const url = addr.startsWith('ws') ? addr : `ws://${addr}`;
  try {
    O.ws = new WebSocket(url);
  } catch(e) { alert('接続できませんでした: ' + e.message); return; }
  O.ws.onopen = onOpen;
  O.ws.onmessage = e => { try { handleServer(JSON.parse(e.data)); } catch(err) {} };
  O.ws.onerror = () => { alert('WebSocket エラー。サーバーが起動しているか確認してください。'); };
  O.ws.onclose = () => {
    if (O.phase !== 'game_over' && O.phase !== 'setup') {
      alert('サーバーとの接続が切れました');
      initOnline(); mode = 'home'; render();
    }
  };
}

function wsSend(msg) {
  if (mode === 'solo')  { SoloEngine.handle(msg); return true; }
  if (mode === 'p2p')   return P2PEngine.wsSendP2P(msg);
  if (O.ws && O.ws.readyState === WebSocket.OPEN) { O.ws.send(JSON.stringify(msg)); return true; }
  return false;
}

function handleServer(data) {
  if (data && data.type) O.p2pLastType = data.type;
  if (data && data.p2p_seq) {
    O.p2pSyncSeq = data.p2p_seq;
    O.p2pSyncAt = Date.now();
  }
  switch(data.type) {
    case 'room_created':
      O.roomCode = data.code; O.pid = data.pid; O.isHost = true;
      O.players = data.players; O.phase = 'lobby'; break;
    case 'room_joined':
      O.roomCode = data.code; O.pid = data.pid; O.isHost = false;
      clearP2PConnectionWarning(true);
      O.players = data.players; O.cpuCount = data.cpu_count ?? O.cpuCount ?? 0; O.phase = 'lobby'; break;
    case 'player_joined': case 'player_left':
      O.players = data.players; O.cpuCount = data.cpu_count ?? O.cpuCount ?? 0; syncAlivePresence(); break;
    case 'player_reconnected':
      clearP2PConnectionWarning(true);
      pushP2PEvent('reconnected', data.name || '');
      O.players = data.players || O.players; syncAlivePresence(); break;
    case 'became_host':
      O.isHost = true; break;
    case 'cpu_count_updated':
      O.cpuCount = data.count; break;
    case 'game_started':
      O.myRole = data.role; O.wolfPartners = data.wolf_partners || []; O.sharedPartners = data.shared_partners || [];
      O.players = data.players; O.isHost = data.is_host || O.isHost;
      clearP2PConnectionWarning(false);
      O.nightActionPending = false;
      O.wolfChatReadyPending = false;
      O.voteReadyPending = false;
      clearP2PActionAckWatchdog();
      O.phase = 'role';
      if (['solo','p2p','online'].includes(mode)) {
        O.notebook = {}; O._scored = false; O.gameRecap = null; O.brainwashNotice = null; O.brainwashHistory = [];
        O.myVotes = []; O.mySeerHits = 0; O.myGuardSuccess = 0; O._myLastGuard = null;
        O.intelMsgs = []; O.voteHistory = []; O.lastVoteResult = null;
        O.preVotes = {}; O.preVoteChanges = {}; O.preVotePending = false; O.preVoteTargetDraft = '';
        if (!data.p2p_seq) { O.p2pSyncSeq = 0; O.p2pSyncAt = 0; }
      }
      syncAlivePresence();
      break;
    case 'p2p_heartbeat':
      O.p2pHeartbeatAt = Date.now();
      clearP2PConnectionWarning(false);
      O.p2pHostPhase = data.phase || O.p2pHostPhase || '';
      if (mode === 'p2p' && !O.isHost) {
        try { P2PEngine.wsSendP2P({ type:'heartbeat_ack', phase:O.phase || '', seen_seq:O.p2pSyncSeq || 0 }); } catch(e) {}
        const hostPhase = data.phase || '';
        const localPhase = O.phase || '';
        const syncPhases = ['role','wolf_chat','night','discuss','vote','vote_result','game_over'];
        const recoverableLocalPhases = ['setup','p2p_setup','lobby', ...syncPhases];
        if (hostPhase && localPhase && hostPhase !== localPhase && syncPhases.includes(hostPhase) && recoverableLocalPhases.includes(localPhase)) {
          p2pAutoResync('phase_mismatch');
        }
        scheduleP2PWatchdog();
      }
      break;
    case 'p2p_resync': {
      O.p2pResyncAt = Date.now();
      pushP2PEvent('p2p_resync', data.phase || '');
      clearP2PConnectionWarning(true);
      O.roomCode = data.roomCode || O.roomCode;
      O.day = data.day || O.day || 0;
      O.players = data.players || O.players || [];
      O.alive = data.alive || O.alive || [];
      O.myRole = data.role || O.myRole;
      O.wolfPartners = data.wolf_partners || O.wolfPartners || [];
      O.sharedPartners = data.shared_partners || O.sharedPartners || [];
      if (mode === 'p2p') O.isHost = !!data.is_host;
      O.nightReport = data.night_report || O.nightReport || null;
      O.eliminatedLastNight = data.eliminated || O.eliminatedLastNight || null;
      O.preVotes = data.pre_votes || {};
      O.preVoteChanges = data.pre_vote_changes || {};
      O.preVotePending = false;
      O.preVoteTargetDraft = O.preVotes[O.playerName] || '';
      O.voteReadyNames = data.vote_ready_names || [];
      O.voteReadyTotal = data.vote_ready_total ?? O.voteReadyTotal ?? 0;
      O.voteReadyAll = !!data.vote_ready_all;
      O.voteReadyPending = false;
      O.voteDone = data.vote_done ?? O.voteDone ?? 0;
      O.voteTotal = data.vote_total ?? O.voteTotal ?? 0;
      if (data.phase !== 'night') O.nightActionPending = false;
      if (data.phase !== 'wolf_chat') O.wolfChatReadyPending = false;
      if (data.phase !== 'discuss') O.voteReadyPending = false;
      clearP2PActionAckWatchdog();

      if (data.phase === 'wolf_chat') {
        O.wolfPartnerNames = data.wolf_names || O.wolfPartnerNames || [];
        O.wolfChatReady = !!data.wolf_chat_ready;
        O.wolfChatReadyPending = false;
        O.phase = 'wolf_chat';
      } else if (data.phase === 'night') {
        O.nightActionNeeded = data.action_needed || null;
        O.nightActionDone = !!data.night_action_done;
        O.nightActionPending = false;
        O.phase = 'night';
      } else if (data.phase === 'discuss') {
        O.discMsgs = data.disc_msgs || [];
        O.intelMsgs = (data.disc_msgs || []).map(m => ({...m, day: O.day}));
        O.discRound = data.disc_round || 1;
        O.discTotalRounds = data.disc_total_rounds || 2;
        O.currentSpeaker = data.current_speaker || null;
        O.isMyDiscTurn = data.waiting_for === O.playerName;
        O.tplStep = O.isMyDiscTurn ? 'cat' : null;
        O.phase = 'discuss';
      } else if (data.phase === 'vote') {
        O.voteSubmitted = !!data.vote_submitted;
        O.voteAckAt = O.voteSubmitted ? Date.now() : 0;
        if (O.voteSubmitted) {
          clearVoteAckWatchdog();
          O.voteAckWarningAt = 0;
        } else {
          clearVoteAckWatchdog();
          O.voteSentAt = 0;
          O.voteAckWarningAt = 0;
          O.voteAckRetryAt = 0;
          O.voteAckRetryCount = 0;
        }
        O.voteResult = null;
        O.phase = 'vote';
      } else if (data.phase === 'vote_result' || data.phase === 'game_over') {
        clearVoteAckWatchdog();
        const vr = data.vote_result;
        if (vr) {
          O.voteResult = {
            executed: vr.executed,
            role: vr.role,
            tally: vr.tally || {},
            nekomataVictim: vr.nekomataVictim,
            voteReasons: vr.voteReasons || {},
            votes: vr.votes || {},
            preVotes: vr.preVotes || vr.pre_votes || {},
          };
          if (Array.isArray(vr.brainwashHistory)) O.brainwashHistory = vr.brainwashHistory;
          O.lastVoteResult = O.voteResult;
        }
        O.winner = data.winner || null;
        if (data.phase === 'game_over') {
          O.finalPlayers = (data.players || []).map(p => ({name:p.name || '?', role:p.role, alive:!!p.alive, disconnected:!!p.disconnected, disconnectedAt:p.disconnectedAt||null}));
          O.log = data.log || O.log || [];
        }
        O.phase = data.phase;
      } else {
        O.phase = data.phase || O.phase;
      }
      syncAlivePresence();
      break;
    }
    case 'wolf_chat_start':
      O.wolfPartnerNames = data.wolf_names || [];
      O.wolfChatMsgs = []; O.wolfChatReady = false; O.wolfChatReadyPending = false;
      clearP2PActionAckWatchdog();
      // alive リストをプレイヤー全員で初期化（夜前なので全員生存）
      if (!O.alive || !O.alive.length) O.alive = O.players.map(p=>({ name: p.name }));
      syncAlivePresence();
      O.phase = 'wolf_chat'; break;
    case 'wolf_chat_ready_ack':
      pushP2PEvent('wolf_ready_ack', '');
      clearP2PActionAckWatchdog();
      O.wolfChatReady = true;
      O.wolfChatReadyPending = false;
      break;
    case 'wolf_chat_msg':
      if (appendIncomingChatOnce(O.wolfChatMsgs, {name: data.name, text: data.text})) {
        speakChatMessage(data.name, data.text);
      }
      break;
    case 'night_start':
      O.day = data.day; O.nightActionNeeded = null;
      O.nightActionDone = false; O.nightActionPending = false; O.seerResult = null; O.wolfChosen = null;
      clearP2PActionAckWatchdog();
      O.phase = 'night'; break;
    case 'action_needed':
      O.nightActionNeeded = data; O.nightActionPending = false; break;
    case 'seer_result':
      O.seerResult = {target: data.target, isWolf: data.is_wolf};
      if (data.is_wolf) O.mySeerHits = (O.mySeerHits||0) + 1; // 戦績: 占いで人狼発見
      pushP2PEvent('action_ack', `seer/${data.target || ''}`);
      clearP2PActionAckWatchdog();
      O.nightActionPending = false; O.nightActionDone = true; break;
    case 'action_ack': case 'wolf_chosen':
      if (data.type === 'wolf_chosen') O.wolfChosen = data.target;
      pushP2PEvent('action_ack', data.type === 'wolf_chosen' ? `wolf/${data.target || ''}` : '');
      clearP2PActionAckWatchdog();
      O.nightActionPending = false; O.nightActionDone = true; break;
    case 'discuss_start':
      O.nightActionPending = false;
      O.wolfChatReadyPending = false;
      clearP2PActionAckWatchdog();
      O.discMsgs = []; O.discRound = data.round; O.discTotalRounds = data.total_rounds;
      O.eliminatedLastNight = data.eliminated; O.nightReport = data.night_report || null; O.alive = data.alive;
      O.preVotes = data.pre_votes || {};
      O.preVoteChanges = data.pre_vote_changes || {};
      O.preVotePending = false;
      O.preVoteTargetDraft = O.preVotes[O.playerName] || '';
      syncAlivePresence();
      // 戦績: 騎士の護衛成功を夜明けの結果から推定（守った夜に死者ゼロ＝成功）
      if (O.myRole==='DOCTOR' && O._myLastGuard) {
        if (!data.eliminated) O.myGuardSuccess = (O.myGuardSuccess||0) + 1;
        O._myLastGuard = null;
      }
      O.currentSpeaker = null; O.isMyDiscTurn = false; O.tplStep = null;
      O.voteReadyNames = []; O.voteReadyAll = false;
      O.voteReadyPending = false;
      O.voteReadyTotal = data.readyTotal ?? activeHumanCount();
      // 夜に殺された人を死亡リストへ（役職確定）
      if (data.eliminated) {
        const av = getAvatar(data.eliminated.name, O.players);
        if (!O.deadPlayers.find(d=>d.name===data.eliminated.name))
          O.deadPlayers.push({ name:data.eliminated.name, role:null, avatar:av, day:O.day, cause:'人狼' });
        delete O.roleClaims[data.eliminated.name];
      }
      if (data.night_report && data.night_report.dragged) {
        const draggedName = data.night_report.dragged;
        const av = getAvatar(draggedName, O.players);
        if (!O.deadPlayers.find(d=>d.name===draggedName))
          O.deadPlayers.push({ name:draggedName, role:null, avatar:av, day:O.day, cause:'猫又' });
        delete O.roleClaims[draggedName];
      }
      O.phase = 'discuss';
      O._musicFailTimer = null;
      if (data.eliminated) { setTimeout(() => showKillDrama(data.eliminated.name, data.eliminated.role), 400); }
      // 議論BGM開始 — エンジンが指定した曲名・開始時刻で同期再生（同室複数端末対応）
      setTimeout(() => {
        const onEnd = () => { if (O.phase === 'discuss') wsSend({type:'music_ended'}); };
        if (data.song && data.songStarted) {
          playMusicSync(data.song, data.songStarted, onEnd);
        } else {
          playMusic(_pickSong(), onEnd);
        }
        // ── スマホ音楽ブロック対策: 3秒後に再生できていなければ90秒フォールバック ──
        setTimeout(() => {
          if (O.phase !== 'discuss' || (bgmAudio && !bgmAudio.paused)) return;
          // 音楽が流れていない → 一定時間後に自動で music_ended を送信
          if (!O._musicFailTimer) {
            O._musicFailTimer = setTimeout(() => {
              O._musicFailTimer = null;
              if (O.phase === 'discuss') wsSend({type:'music_ended'});
            }, 90 * 1000); // 90秒後に強制進行
          }
        }, 3000);
      }, 650);
      break;
    case 'disc_new_round':
      O.discRound = data.round; O.currentSpeaker = null; break;
    case 'disc_turn':
      O.currentSpeaker = data.name; O.isMyDiscTurn = false; O.tplStep = null; break;
    case 'your_disc_turn':
      if (isOnlinePlayerAlive()) {
        O.isMyDiscTurn = true; O.tplStep = 'cat'; O.tplTarget = null;
      } else {
        O.isMyDiscTurn = false; O.tplStep = null; O.tplTarget = null;
      }
      break;
    case 'disc_message':
      appendDiscussMessageOnce({name: data.name, text: data.text});
      O.currentSpeaker = null; break;
    case 'pre_vote_update':
      O.preVotes = data.pre_votes || {};
      O.preVoteChanges = data.pre_vote_changes || {};
      O.preVotePending = false;
      O.preVoteTargetDraft = O.preVotes[O.playerName] || '';
      break;
    case 'day_start':
      O.eliminatedLastNight = data.eliminated; O.alive = data.alive;
      syncAlivePresence();
      O.phase = 'day'; break;
    case 'vote_ready_upd':
      O.voteReadyNames = data.readyNames || [];
      if (O.voteReadyNames.includes(O.playerName)) O.voteReadyPending = false;
      O.voteReadyTotal = data.readyTotal ?? O.voteReadyTotal ?? activeHumanCount();
      break;
    case 'vote_ready_ack':
      pushP2PEvent('vote_ready_ack', '');
      clearP2PActionAckWatchdog();
      O.voteReadyPending = false;
      if (!O.voteReadyNames.includes(O.playerName)) O.voteReadyNames.push(O.playerName);
      break;
    case 'vote_ready_all':
      O.voteReadyAll = true;
      O.voteReadyPending = false;
      clearP2PActionAckWatchdog();
      O.voteReadyTotal = data.readyTotal ?? O.voteReadyTotal ?? activeHumanCount();
      fadeOutMusic(1700);
      break;
    case 'vote_start':
      stopMusic(); // 議論BGMを停止
      if (O._musicFailTimer) { clearTimeout(O._musicFailTimer); O._musicFailTimer = null; }
      clearVoteAckWatchdog();
      clearP2PActionAckWatchdog();
      O.nightActionPending = false;
      O.wolfChatReadyPending = false;
      O.voteReadyPending = false;
      O.alive = data.alive; O.voteSubmitted = false; O.voteSentAt = 0; O.voteAckAt = 0; O.voteAckWarningAt = 0; O.voteAckRetryAt = 0; O.voteAckRetryCount = 0; O.voteSentTarget = ''; O.voteSentReason = ''; O.voteReasons = {};
      syncAlivePresence();
      O.voteTarget = '';
      O.voteReasonDraft = '';
      O.voteDone = 0; O.voteTotal = data.alive.length;
      O.voteResult = null; O.brainwashNotice = null; O.phase = 'vote'; break;
    case 'vote_progress':
      O.voteDone = data.done; O.voteTotal = data.total; break;
    case 'vote_ack':
      clearVoteAckWatchdog();
      pushP2PEvent('vote_ack', O.voteSentTarget || O.voteTarget || '');
      O.voteSubmitted = true; O.voteAckAt = Date.now(); O.voteAckWarningAt = 0; break;
    case 'brainwashed_notice':
      O.brainwashNotice = { forcedTarget: data.forced_target || '' };
      alert('🌀 洗脳の影響：あなたの票は ' + (data.forced_target || '指定先') + ' さんへ操作されました。誰にやられたかは分かりません。');
      break;
    case 'medium_reveal':
      // 霊媒師のみに届く: 処刑された人の役職を記録
      O.mediumReveal = { target: data.target, role: data.role };
      break;
    case 'vote_result':
      clearVoteAckWatchdog();
      clearP2PActionAckWatchdog();
      O.voteResult = {executed: data.executed, role: data.executed_role, tally: data.tally, nekomataVictim: data.nekomata_victim, voteReasons: data.vote_reasons || {}, votes: data.votes || {}, preVotes: data.pre_votes || {}, brainwashCount: data.brainwash_count || 0};
      if (Array.isArray(data.brainwash_history)) O.brainwashHistory = data.brainwash_history;
      O.lastVoteResult = O.voteResult;
      O.voteHistory = O.voteHistory || [];
      O.voteHistory.push({day: O.day, executed: data.executed, tally: data.tally || {}, votes: data.votes || {}, preVotes: data.pre_votes || {}, reasons: data.vote_reasons || {}});
      O.winner = data.winner;
      if (data.players && data.players.length > 0) {
        O.finalPlayers = data.players.map(p => ({
          name: p.name || '?',
          role: p.role || undefined,
          alive: !!p.alive,
          disconnected: !!p.disconnected,
          disconnectedAt: p.disconnectedAt || null,
        }));
        O.log = data.log || [];
      }
      // 処刑された人を死亡リストへ（役職は内部保持のみ、表示はしない）
      if (data.executed) {
        const av = getAvatar(data.executed, O.players);
        if (!O.deadPlayers.find(d=>d.name===data.executed))
          O.deadPlayers.push({ name:data.executed, role:data.executed_role, avatar:av, day:O.day, cause:'処刑' });
        delete O.roleClaims[data.executed];
        if (O.alive) O.alive = O.alive.filter(p=>p.name!==data.executed);
      }
      // 猫又の道連れを死亡リストへ
      if (data.nekomata_victim) {
        const av2 = getAvatar(data.nekomata_victim, O.players);
        if (!O.deadPlayers.find(d=>d.name===data.nekomata_victim))
          O.deadPlayers.push({ name:data.nekomata_victim, role:null, avatar:av2, day:O.day, cause:'猫又' });
        if (O.alive) O.alive = O.alive.filter(p=>p.name!==data.nekomata_victim);
      }
      O.phase = 'vote_result'; break;
    case 'game_over':
      clearVoteAckWatchdog();
      clearP2PActionAckWatchdog();
      O.winner = data.winner;
      O.nightReport = data.night_report || O.nightReport || null;
      // data.players が null/undefined の場合は既存の finalPlayers を保持（フォールバック）
      if (data.players && data.players.length > 0) {
        // role が欠落しているプレイヤーがいても表示が壊れないよう保護
        O.finalPlayers = data.players.map(p => ({
          name: p.name || '?',
          role: p.role || undefined,
          alive: !!p.alive,
          disconnected: !!p.disconnected,
          disconnectedAt: p.disconnectedAt || null,
        }));
      }
      O.log = data.log || []; O.eliminatedLastNight = data.eliminated;
      O.phase = 'game_over';
      if (['solo','p2p','online'].includes(mode)) scoreGame();
      setTimeout(() => spawnConfetti(
        data.winner==='village' ? '#4ade8088' : '#ef444488',
        data.winner==='village' ? '#fbbf2488' : '#f8717188'
      ), 300);
      break;
    case 'error':
      O.nightActionPending = false;
      O.wolfChatReadyPending = false;
      O.voteReadyPending = false;
      O.preVotePending = false;
      clearP2PActionAckWatchdog();
      alert(data.msg || data.message);
      if (data.fatal && mode === 'p2p') {
        P2PEngine.destroy();
        O.phase = 'p2p_setup';
        O.p2pSub = 'choose';
        render();
      }
      return;
  }
  render();
}

// ========== ONLINE RENDERS ==========
function renderOnline() {
  switch(O.phase) {
    case 'setup':      return renderOSetup();
    case 'lobby':      return renderOLobby();
    case 'role':       return renderORole();
    case 'wolf_chat':  return renderOWolfChat();
    case 'night':      return renderONight();
    case 'discuss':    return renderODiscuss();
    case 'day':        return renderODay();
    case 'vote':       return renderOVote();
    case 'vote_result':return renderOVoteResult();
    case 'game_over':  return renderOGameOver();
    default: return '';
  }
}

// ── 人狼チャット ──────────────────────────────────────────────
function renderOWolfChat() {
  const actionLocked = p2pActionLocked();

  const actionBlock = renderP2PActionBlockedNotice();
  const readyNotice = O.wolfChatReadyPending
    ? `<div class="p2p-pending-line">ホストの受理待ちです。画面を閉じずに待ってください。</div>`
    : O.wolfChatReady
      ? `<div class="p2p-pending-line" style="border-color:#22c55e55;background:rgba(34,197,94,.08);color:#86efac;">準備完了です。仲間の準備を待っています。</div>`
      : '';
  // 人狼チームメンバーをアバター付きで表示
  const teamAvatarsHtml = O.wolfPartnerNames.length ? `
    <div style="display:flex;justify-content:center;gap:.8rem;flex-wrap:wrap;margin:.5rem 0 .8rem;">

          <div style="margin-bottom:.35rem;">${avatarFace(av, 'portrait-lg')}</div>

        </div>`;
      }).join('')}
    </div>` : '';

  // チャットメッセージ（ステルス：赤や🐺を使わない中立スタイル）
  const msgs = O.wolfChatMsgs.map(m => {
    const av = getAvatar(m.name, O.players);
    const isMe = m.name === O.playerName;
    return `<div class="chat-msg${isMe?' my-msg':''}">
      <div class="cm-av">${avatarFace(av)}</div>
      <div class="cm-body">
        <div class="cm-name">${esc(m.name)}${isMe?' (あなた)':''}</div>
        <div class="cm-text">${esc(m.text)}</div>
      </div>
    </div>`;
  }).join('');

  // テンプレートを「ゲーム一般」に見せる中立的ラベルに変換

    return `<button class="tpl-btn" ${readyLocked ? 'disabled' : ''} onclick="${action}">${label}</button>`;
  }).join('');

  return `
    ${ph('🌙', `第${O.day}夜`, 'チームメモ', '#60a5fa')}

    <div style="display:flex;justify-content:flex-end;margin:.2rem 0 .4rem;">
      <button id="btnChatVoiceTest" title="スマホで音声を有効化してテスト再生" style="background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#94a3b8;border-radius:8px;padding:.25rem .55rem;font-size:.76rem;cursor:pointer;white-space:nowrap;">
        ${chatVoiceLabel()} テスト

    <div style="background:rgba(99,102,241,.06);border:1px solid rgba(99,102,241,.15);border-radius:12px;padding:.7rem .9rem;margin:.4rem 0 .6rem;">

        <input type="text" id="discFreeInput" placeholder="${actionLocked ? 'P2P再接続後に発言できます' : O.isMyDiscTurn?'💬 あなたの番！自由に発言...':'💬 自由に発言できます...'}" maxlength="220" ${actionLocked ? 'disabled' : ''}>
        <button class="send-btn" id="discFreeSend" ${actionLocked ? 'disabled' : ''}>送信</button>
      </div>
    </div>` : '';

  // 投票開始ボタン
  const myReady = O.voteReadyNames.includes(O.playerName);
  const readyPending = !!O.voteReadyPending;
  const readyTotal = Number.isFinite(Number(O.voteReadyTotal)) ? Number(O.voteReadyTotal) : activeHumanCount();
  const voteReadySection = myAlive ? `
    <div class="vote-ready-bar${O.voteReadyAll?' all-ready':''}">
      ${O.voteReadyAll
        ? `<div style="text-align:center;color:#4ade80;font-weight:700;font-size:.95rem;padding:.1rem 0;">
             🗳️ 全員準備完了！投票が始まります...
           </div>`
        : `<div style="display:flex;align-items:center;gap:.6rem;">
             <button id="btnVoteReady" class="vote-ready-btn ${myReady?'ready':'not-ready'}" ${(myReady || readyPending || actionLocked)?'disabled':''}>
               ${actionLocked ? '再接続後に投票へ' : myReady ? '✅ 投票待機中' : readyPending ? '受理待ち...' : '⚡ 今すぐ投票へ'}
             </button>
             <span style="color:#64748b;font-size:.8rem;white-space:nowrap;">${O.voteReadyNames.length}/${readyTotal}人</span>
           </div>
           ${O.voteReadyNames.length ? `<div class="vote-ready-dots">
             ${O.voteReadyNames.map(n=>`<span style="font-size:.72rem;background:rgba(34,197,94,.15);border:1px solid #22c55e44;color:#4ade80;padding:.15rem .42rem;border-radius:7px;">${esc(n)}</span>`).join('')}
             <span style="color:#475569;font-size:.72rem;">が準備完了</span>
           </div>` : ''}`
      }
    </div>` : '';

  return `
    ${ph('☀️', `第${O.day}日`, '村人会議 ─ 人狼を探し出せ！', '#fbbf24')}
    ${victimCard}
    ${renderDawnIntel()}
    ${renderDawnNewspaper()}
    ${renderP2PStatusPanel()}
    ${musicIndicator}
    <p class="sec-label" style="margin:.6rem 0 .2rem;">🧑 生存者 (${O.alive.length}人)</p>
    <div class="chips" style="margin-bottom:.4rem;">${aliveChips}</div>
    ${renderNotebook()}
    ${renderCaseFile()}
    ${renderAiIntelPanel()}
    ${renderAiWarRoomPanel()}
    ${renderDiscussionHeatPanel()}
    ${renderClimaxSpotlightPanel()}
    ${renderContradictionScannerPanel()}
    ${renderInferenceTrialPanel()}
    ${renderSecretMissionPanel()}
    ${renderRivalryPanel()}
    ${renderPreVotePanel(actionLocked)}
    ${deadListHtml}
    <hr class="div" style="margin:.4rem 0;">
    ${myRoleReminder()}
    <div style="display:flex;align-items:center;justify-content:space-between;margin:.3rem 0 .2rem;">
      <p style="color:#fbbf24; font-size:.82rem; font-weight:700; margin:0;">
        💬 議論 ─ ラウンド ${O.discRound} / ${O.discTotalRounds}
      </p>
      <div style="display:flex;gap:.35rem;align-items:center;flex-wrap:wrap;justify-content:flex-end;">
        <button id="btnChatVoiceTest" title="スマホで音声を有効化してテスト再生" style="background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#94a3b8;border-radius:8px;padding:.22rem .5rem;font-size:.74rem;cursor:pointer;white-space:nowrap;">
          ${chatVoiceLabel()}
        </button>
        <button id="btnChatSpeed" title="チャットの流れる速さを変更" style="background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#94a3b8;border-radius:8px;padding:.22rem .5rem;font-size:.74rem;cursor:pointer;white-space:nowrap;">
          速度 ${chatSpeedLabel()}
        </button>
      </div>
    </div>
    <div class="mobile-action">${voteReadySection}${actionBlock}</div>
    ${renderCoChat()}
    <div class="chat-feed" id="discFeed">${msgs}${typingHtml}${waitHtml}</div>
    ${freeInput}
    ${O.isMyDiscTurn && !actionLocked ? renderTplPicker() : ''}
  `;
}

function renderTplPicker() {
  const step = O.tplStep;
  if (!step || step === 'cat') {
    const isSeer   = O.myRole === 'SEER';
    const isMedium = O.myRole === 'MEDIUM';
    const isDoctor = O.myRole === 'DOCTOR';
    const isNeko   = O.myRole === 'NEKOMATA';
    const isShared = O.myRole === 'SHARED';
    const isWolf   = isWolfSideRole(O.myRole);
    const coBtn = isSeer
      ? `<div style="grid-column:span 2;"><button class="tpl-cat" id="tCatSeer" style="width:100%;">🔮 占い情報を公開（CO）▶</button><p style="color:#475569;font-size:.7rem;text-align:center;margin:.2rem 0 0;">占い師として名乗り出て占い結果を伝える</p></div>`
      : isMedium
      ? `<div style="grid-column:span 2;"><button class="tpl-cat" id="tCatMedium" style="width:100%;">👁️ 霊媒結果を公開（CO）▶</button><p style="color:#475569;font-size:.7rem;text-align:center;margin:.2rem 0 0;">霊媒師としてCOして処刑者の役職を報告する</p></div>`
      : isDoctor
      ? `<div style="grid-column:span 2;"><button class="tpl-cat" id="tCatDoctor" style="width:100%;">💊 騎士としてCOする</button><p style="color:#475569;font-size:.7rem;text-align:center;margin:.2rem 0 0;">護衛役としてカミングアウトする</p></div>`
      : isNeko
      ? `<div style="grid-column:span 2;"><button class="tpl-cat" id="tCatNeko" style="width:100%;">🐱 猫又としてCOする</button><p style="color:#475569;font-size:.7rem;text-align:center;margin:.2rem 0 0;">道連れ能力をアピールしてCOする</p></div>`
      : isShared
      ? `<div style="grid-column:span 2;"><button class="tpl-cat" id="tCatShared" style="width:100%;">🤝 共有者としてCOする</button><p style="color:#475569;font-size:.7rem;text-align:center;margin:.2rem 0 0;">確定情報役として議論を整理する</p></div>`
      : isWolf
      ? `<div style="grid-column:span 2;"><button class="tpl-cat" id="tCatFakeCO" style="width:100%;border-color:#7c3aed55;background:rgba(124,58,237,.13);">🎭 役職を騙る（偽CO）▶</button><p style="color:#475569;font-size:.7rem;text-align:center;margin:.2rem 0 0;">占い師・霊媒師・騎士・猫又・共有者として偽りのCOをする</p></div>`
      : '';
    return `
      <div style="background:rgba(251,191,36,0.08); border:1px solid #fbbf2444; border-radius:12px; padding:1rem; margin-top:0.5rem;">
        <p style="color:#fbbf24; font-weight:700; font-size:0.9rem; margin-bottom:0.6rem;">👉 あなたの番です！発言を選んでください</p>
        <div class="tpl-cat-grid">
          <button class="tpl-cat" id="tCatNeutral">👀 様子を見る</button>
          <button class="tpl-cat" id="tCatAccuse">🔍 誰かを疑う ▶</button>
          <button class="tpl-cat" id="tCatDefend">✋ 弁護する</button>
          <button class="tpl-cat" id="tCatAgree">👍 同調する ▶</button>
          <button class="tpl-cat" id="tCatQuestion">❓ 質問する</button>
          <button class="tpl-cat" id="tCatPressure">⚡ 訴える</button>
          ${coBtn}
        </div>
      </div>`;
  }
  if (step === 'fake_co_pick') {
    return `
      <div style="background:rgba(124,58,237,.1); border:1px solid #7c3aed44; border-radius:12px; padding:1rem; margin-top:0.5rem;">
        <p style="color:#c4b5fd; font-weight:700; font-size:0.9rem; margin-bottom:0.6rem;">🎭 どの役職として偽COしますか？</p>
        <button class="tpl-btn" id="fakeSeerCO"   style="border-left:3px solid #818cf8;">🔮 占い師として偽CO ▶（対象を選ぶ）</button>
        <button class="tpl-btn" id="fakeMediumCO" style="border-left:3px solid #a78bfa;">👁️ 霊媒師として偽CO ▶（処刑者を選ぶ）</button>
        <button class="tpl-btn" id="fakeDoctorCO" style="border-left:3px solid #34d399;">💊 騎士として偽CO</button>
        <button class="tpl-btn" id="fakeNekoCO"   style="border-left:3px solid #fb923c;">🐱 猫又として偽CO</button>
        <button class="tpl-btn" id="fakeSharedCO" style="border-left:3px solid #38bdf8;">🤝 共有者として偽CO</button>
        <button class="tpl-btn" id="tCatBack" style="color:#64748b; margin-top:0.5rem;">← 戻る</button>
      </div>`;
  }
  if (step === 'tgt_accuse' || step === 'tgt_agree' || step === 'tgt_seer' || step === 'tgt_medium') {
    const label = step === 'tgt_accuse' ? '🔍 誰を疑いますか？'
                : step === 'tgt_agree'  ? '👍 誰への同調ですか？'
                : step === 'tgt_seer'   ? '🔮 誰の占い結果ですか？'
                                        : '👁️ 誰の役職を報告しますか？（処刑された人）';
    // 霊媒師は死亡者から選ぶ、それ以外は生存者から
    const targets = step === 'tgt_medium'
      ? O.deadPlayers.map(d => ({ name: d.name }))
      : O.alive.filter(p => p.name !== O.playerName);
    const btns = targets.map(p =>
      `<button class="tpl-btn" id="tgt_${esc(p.name)}" data-step="${step}" data-name="${esc(p.name)}">${esc(p.name)}</button>`
    ).join('');
    return `
      <div style="background:rgba(251,191,36,0.08); border:1px solid #fbbf2444; border-radius:12px; padding:1rem; margin-top:0.5rem;">
        <p style="color:#fbbf24; font-weight:700; font-size:0.9rem; margin-bottom:0.6rem;">${label}</p>
        ${btns || '<p style="color:#475569;font-size:.8rem;">対象者がいません</p>'}
        <button class="tpl-btn" id="tCatBack" style="color:#64748b; margin-top:0.5rem;">← 戻る</button>
      </div>`;
  }
  // msg_* steps
  let templates = [];
  let heading = '💬 発言を選んでください';
  if      (step === 'msg_neutral')  templates = TPL.neutral;
  else if (step === 'msg_accuse')   templates = TPL.accuse.map(t => tplFill(t, O.tplTarget));
  else if (step === 'msg_defend')   templates = TPL.defend;
  else if (step === 'msg_agree')    templates = TPL.agree.map(t => tplFill(t, O.tplTarget));
  else if (step === 'msg_question') templates = TPL.question;
  else if (step === 'msg_pressure') templates = TPL.pressure;
  else if (step === 'msg_seer') {
    heading = `🔮 ${O.tplTarget} さんの占い結果を選んでください`;
    templates = [
      ...TPL.seer_wolf.map(t => tplFill(t, O.tplTarget)),
      ...TPL.seer_safe.map(t => tplFill(t, O.tplTarget)),
    ];
  } else if (step === 'msg_medium') {
    heading = `👁️ ${O.tplTarget} さんの霊媒結果を選んでください`;
    templates = [
      ...TPL.co_medium,
      ...TPL.medium_result_wolf.map(t => tplFill(t, O.tplTarget)),
      ...TPL.medium_result_safe.map(t => tplFill(t, O.tplTarget)),
    ];
  } else if (step === 'msg_doctor') {
    heading = '💊 騎士COの発言を選んでください';
    templates = TPL.co_doctor;
  } else if (step === 'msg_neko') {
    heading = '🐱 猫又COの発言を選んでください';
    templates = TPL.co_neko;
  } else if (step === 'msg_shared') {
    heading = '🤝 共有者COの発言を選んでください';
    templates = TPL.co_shared;
  }
  const btns = templates.map(t =>
    `<button class="tpl-btn tpl-send" data-msg="${esc(t)}">${t}</button>`
  ).join('');
  return `
    <div style="background:rgba(251,191,36,0.08); border:1px solid #fbbf2444; border-radius:12px; padding:1rem; margin-top:0.5rem;">
      <p style="color:#fbbf24; font-weight:700; font-size:0.9rem; margin-bottom:0.6rem;">${heading}</p>
      ${btns}
      <button class="tpl-btn" id="tCatBack" style="color:#64748b; margin-top:0.5rem;">← 戻る</button>
    </div>`;
}

function renderONight() {
  const an = O.nightActionNeeded;
  const actionLocked = p2pActionLocked();
  const actionPending = !!O.nightActionPending;

  const pendingNotice = actionPending
    ? `<div class="p2p-pending-line">夜行動をホストへ送信しました。受理待ちです。</div>`
    : '';
  if (O.nightActionDone || !an) {
    let extra = '';
    if (O.seerResult) {
      const isWolf = O.seerResult.isWolf;
      const c = isWolf ? '#ef4444' : '#22c55e';
      const tav = getAvatar(O.seerResult.target, O.players);
      extra = `
        <div style="border:2px solid ${c}; background:${c}14; border-radius:16px; padding:1.4rem; text-align:center; margin-top:1rem;">
          <p style="color:#818cf8; font-size:.8rem; font-weight:700; letter-spacing:.1em; margin:0 0 .5rem;">🔮 占い結果</p>
          <div style="margin:.35rem 0;">${avatarFace(tav, 'portrait-xl')}</div>
          <div style="font-size:1.7rem; font-weight:900; color:#fff; margin:.3rem 0;">${esc(O.seerResult.target)}</div>
          <div style="color:#64748b; font-size:.72rem; margin-bottom:.4rem;">${tav.label} ─ 「${tav.hint}」</div>
          <div style="font-size:1.4rem; font-weight:800; color:${c}; margin:.4rem 0;">
            ${isWolf ? '🐺 人狼です！' : '✅ 人狼ではありません'}
          </div>
          <p style="color:#64748b; font-size:.8rem; margin:0;">
            ${isWolf ? '🚨 この情報を活かして村を守れ！' : '✨ この人物は村人チームです'}
          </p>
        </div>`;
    } else if (O.mediumReveal && O.myRole === 'MEDIUM') {
      const mInfo = ROLES[O.mediumReveal.role] || {};
      const mIsWolf = O.mediumReveal.role === 'WEREWOLF';
      const mC = mIsWolf?'#ef4444':'#22c55e';
      extra = `<div class="card-colored" style="text-align:center;border:2px solid ${mC};background:${mC}18;">
        <h3 style="color:#a78bfa;margin-bottom:.4rem;">👁️ 霊視結果</h3>
        <h2 style="color:#fff;margin:.3rem 0;">${esc(O.mediumReveal.target)}</h2>

      ${renderP2PStatusPanel()}
      ${actionBlock}
      ${pendingNotice}

function renderOVote() {
  const myAlive = O.alive.some(p => p.name === O.playerName);

  // 死亡リスト（確定済み役職付き）
  const deadListHtml = O.deadPlayers.length ? `
    <details style="margin:.3rem 0 .5rem;">
      <summary style="color:#f87171;font-size:.78rem;font-weight:700;cursor:pointer;padding:.2rem 0;list-style:none;">

      </summary>

        ${O.deadPlayers.map(d => {
          const causeLabel = d.cause==='人狼'?'🐺':d.cause==='猫又'?'🐱':'⚖️';
          return `<div class="death-entry">
            ${avatarFace(d.avatar, 'portrait-chip')}
            <span class="de-name">${esc(d.name)}</span>
            <span class="de-role" style="color:#475569;">❓ 役職不明</span>
            <span style="font-size:.7rem;color:#475569;">${causeLabel}</span>
          </div>`;
        }).join('')}
      </div>
    </details>` : '';

  if (O.voteSubmitted || !myAlive) {
    const pct = O.voteTotal > 0 ? Math.round(O.voteDone / O.voteTotal * 100) : 0;
    const ackDelaySec = O.voteSentAt && !O.voteAckAt ? Math.max(0, Math.round((Date.now() - O.voteSentAt) / 1000)) : 0;
    const ackWarning = myAlive && O.voteAckWarningAt && !O.voteAckAt
      ? `<div class="p2p-pending-line" style="border-color:#f59e0b66;background:rgba(245,158,11,.08);color:#fbbf24;">
          投票の受理確認が遅れています。自動で再同期${O.voteAckRetryAt ? 'と再送' : ''}を行いました。${ackDelaySec ? `送信から${ackDelaySec}秒経過。` : ''}
        </div>`
      : '';
    const voteStatusText = !myAlive
      ? '観戦中'
      : O.voteAckAt
        ? '✅ 投票がホストに受理されました。集計中...'
        : '📨 投票を送信しました。ホストの受付確認を待っています...';
    return `
      ${ph('🗳️',`第 ${O.day} 日 投票`,'集計中','#fbbf24')}
      ${deadListHtml}
      ${renderP2PStatusPanel()}
      <div class="card" style="text-align:center;">
        <p style="color:#64748b; font-size:0.85rem; margin-bottom:0.5rem;">${voteStatusText}</p>
        ${ackWarning}
        <div style="background:rgba(255,255,255,0.08); border-radius:8px; height:8px; overflow:hidden;">
          <div style="background:#6b21a8; height:100%; width:${pct}%; transition:width 0.4s;"></div>
        </div>
        <p style="color:#94a3b8; font-size:0.85rem; margin-top:0.5rem;">${O.voteDone} / ${O.voteTotal} 人が投票済み</p>
      </div>
    `;
  }
  const targets = O.alive.filter(p => p.name !== O.playerName);
  const selectedTarget = targets.some(p => p.name === O.voteTarget) ? O.voteTarget : '';
  const voteReasonDraft = O.voteReasonDraft || '';
  const actionLocked = p2pActionLocked();
  const actionBlock = renderP2PActionBlockedNotice();

  // アバター付き投票先グリッド（選択補助）
  const voteGrid = `
    <div style="display:flex;flex-wrap:wrap;gap:.5rem;margin:.5rem 0 .8rem;">
      ${targets.map(p => {
        const av = getAvatar(p.name, O.players);
        const claim = O.roleClaims[p.name];
        const badge = claim ? `<span style="display:block;margin-top:.12rem;">${roleClaimBadge(claim, true)}</span>` : '';
        const selected = p.name === selectedTarget;
        const disconnected = isP2PDisconnected(p);
        return `<button class="vote-avatar-btn${disconnected ? ' disconnected' : ''}" data-name="${esc(p.name)}"
          style="display:flex;flex-direction:column;align-items:center;min-width:68px;padding:.5rem .4rem;
                 background:${selected?'rgba(107,33,168,.32)':'rgba(255,255,255,.06)'};border:${selected?'2px solid #8b5cf6':'1px solid rgba(255,255,255,.12)'};border-radius:12px;
                 cursor:pointer;color:#e2e8f0;">
          ${avatarFace(av, 'portrait-lg')}
          <span style="font-size:.75rem;font-weight:600;margin-top:.2rem;">${esc(p.name)}</span>
          ${connectionBadge(p)}
          ${(['solo','p2p','online'].includes(mode) && (O.notebook||{})[p.name]) ? `<span style="font-size:.58rem;display:block;color:${O.notebook[p.name]==='suspect'?'#f87171':'#4ade80'};">${O.notebook[p.name]==='suspect'?'🐺怪しい':'🤍信用'}</span>` : ''}
          ${badge}
        </button>`;
      }).join('')}
    </div>`;

  return `
    ${ph('🗳️',`第 ${O.day} 日 投票`,'誰を処刑しますか？','#fbbf24')}
    ${deadListHtml}
    ${renderCaseFile()}
    ${renderAiIntelPanel()}
    ${renderDiscussionHeatPanel()}
    ${renderClimaxSpotlightPanel()}
    ${renderContradictionScannerPanel()}
    ${renderInferenceTrialPanel()}
    ${renderSecretMissionPanel()}
    ${renderP2PStatusPanel()}
    <div class="card" style="padding:.8rem;">
      <p style="color:#fbbf24;font-size:.85rem;font-weight:700;margin:0 0 .4rem;">⚖️ 処刑する人を選んでください</p>
      <p style="color:#64748b;font-size:.75rem;margin:0 0 .5rem;">👆 アバターをタップすると自動選択されます</p>

      <div class="vote-reason-box">
        <label for="oVoteReason">投票理由（結果画面に残ります）</label>
        <textarea id="oVoteReason" maxlength="120" placeholder="例：発言が少なく、占い師COへの反応も遅かったため">${esc(voteReasonDraft)}</textarea>
      </div>
      ${actionBlock}
      <div class="mobile-action"><button class="btn btn-primary" id="oVoteSend" ${actionLocked ? 'disabled' : ''} style="margin-top:0.6rem;">🗳️　投票する</button></div>
    </div>
  `;
}

function renderOVoteResult() {
  const r = O.voteResult;
  if (!r) return '';
  const tally = r.tally || {};
  const total = Object.values(tally).reduce((a,b)=>a+Number(b||0),0);
  const bars = Object.entries(tally).sort(([,a],[,b])=>Number(b||0)-Number(a||0)).map(([n,c]) => {
    const votes = Number(c || 0);
    const pct = total > 0 ? Math.max(0, Math.min(16, Math.round(votes/total*16))) : 0;
    const bar = '█'.repeat(pct)+'░'.repeat(16-pct);
    return `<div class="vote-bar ${n===r.executed?'executed':''}">${esc(n)}：${bar} ${votes}票</div>`;
  }).join('') || '<div class="vote-bar">得票データなし</div>';
  const nextBtn = O.winner
    ? `<button class="btn btn-primary" id="oGoGameOver">🏆　ゲーム結果を見る</button>`
    : (O.isHost ? `<button class="btn btn-night" id="oNextNight">🌙　夜に進む（ホスト）</button>`
                : `<div class="card" style="text-align:center;"><p style="color:#64748b; font-size:0.85rem;">ホストが次のフェーズへ進めます…</p></div>`);
  const nekHtml = r.nekomataVictim
    ? `<div style="margin-top:.8rem;padding:.6rem;background:rgba(251,146,60,.1);border:1px solid #fb923c44;border-radius:10px;color:#fb923c;font-size:.82rem;text-align:center;">
        🐱 猫又の道連れ: <strong>${esc(r.nekomataVictim)}</strong> も巻き込まれました！
       </div>` : '';
  const brainwashHtml = r.brainwashCount
    ? `<div style="margin-top:.55rem;padding:.58rem;background:rgba(236,72,153,.1);border:1px solid #ec489955;border-radius:8px;color:#f9a8d4;font-size:.82rem;text-align:center;font-weight:800;">🌀 操作票: 1件</div>`
    : '';
  return `
    ${ph('⚖️',`第${O.day}日 処刑結果`,'村人会議の結論が出ました','#f87171')}
    ${renderP2PStatusPanel()}
    <div class="card"><p class="sec-label" style="margin-top:0;">📊 得票数</p>${bars}</div>
    ${renderVoteTimeline(r.votes, r.voteReasons, r.preVotes)}
    ${renderVoteReasons(r.voteReasons)}
    <div class="vote-drama" style="text-align:center; padding:1.5rem; border-radius:16px;
         border:2px solid #ef4444; background:linear-gradient(135deg,#1a0505,#2d0a0a); margin:.6rem 0;">
      <p style="color:#f87171; font-size:.78rem; font-weight:700; letter-spacing:.12em; margin:0 0 .5rem;">⚖️ 処刑決定</p>
      <div style="font-size:3rem; line-height:1; margin:.4rem 0;">⚖️</div>
      <div style="font-size:2rem; font-weight:900; color:#fff; margin:.4rem 0;">${esc(r.executed)}</div>
      <div style="font-size:.88rem; color:#64748b; margin-bottom:.8rem;">役職は…ゲーム終了時に公開</div>
    </div>
    ${nekHtml}
    ${brainwashHtml}
    ${renderCaseFile()}
    ${renderAiIntelPanel()}
    ${renderDiscussionHeatPanel()}
    ${renderClimaxSpotlightPanel()}
    ${renderContradictionScannerPanel()}
    ${renderInferenceTrialPanel()}
    ${renderSecretMissionPanel()}
    ${nextBtn}
  `;
}

function renderOGameOver() {
  if (['solo','p2p','online'].includes(mode) && O.gameRecap) return renderSoloRecap();
  const isV = O.winner === 'village';
  const color = isV ? '#4ade80' : '#f87171';
  const players = (O.finalPlayers && O.finalPlayers.length > 0)
    ? O.finalPlayers
    : (O.players || []).map(p => ({ name: p.name, role: undefined, alive: false }));
  const rows = players.map(p => {
    const info = ROLES[p.role] || {};
    const status = p.disconnected && p.alive ? '📶 切断中' : (p.alive ? '✅ 生存' : '💀 死亡');
    return `<div class="player-row" style="border-left-color:${info.color||'#666'};">
      <span class="pr-icon">${info.icon||'❓'}</span>
      <span class="pr-name">${esc(p.name)}</span>
      <span class="pr-role" style="color:${info.color||'#aaa'};">${info.name||p.role||'不明'}</span>
      <span class="pr-status">${status}</span>
    </div>`;
  }).join('');
  const logHtml = O.log.length
    ? `<details style="margin-top:1rem;"><summary>📜 ゲームログ</summary>${O.log.map(e=>`<div class="log-entry">• ${esc(e)}</div>`).join('')}</details>` : '';
  return `
    ${ph(isV?'🎉':'🐺', isV?'村人チームの勝利！':'人狼チームの勝利！',
         isV?'人狼を全員倒しました！':'人狼が村を支配しました...', color)}
    <div class="card-colored" style="text-align:center; border:1px solid ${isV?'#22c55e':'#ef4444'}; background:${isV?'#22c55e':'#ef4444'}18; margin-bottom:1.2rem;">
      <p style="color:${color}; margin:0;">${isV?'村人チームの完全勝利！':'人狼の知略が勝りました...'}</p>
    </div>
    ${renderEndgameReplay(players)}
    ${renderBrainwashRevelation(O.brainwashHistory)}
    <p class="sec-label">📋 全員の役職</p>
    ${rows}${logHtml}
    <hr class="div">
    <button class="btn btn-primary" id="oRestart">🔄　もう一度</button>
  `;
}

function renderP2PDeviceCheck(peerUnavailable) {
  const loc = (typeof window !== 'undefined' && window.location) ? window.location : null;
  const protocol = loc?.protocol || '';
  const host = loc?.host || '';
  const isFile = protocol === 'file:';
  const pageLine = isFile
    ? 'このPCでは file で開いています。スマホ実機は同じHTMLへアクセスできないため、下のLAN用URLかGitHub Pagesなどで開いてください。'
    : `${host || '現在のURL'} をスマホ側でも開ければ実機P2Pを試せます。`;
  const peerLine = peerUnavailable
    ? 'PeerJSが未読込です。スマホ/PCがインターネットへ接続できるか確認してください。'
    : 'PeerJS読込OK。部屋コードまたは参加リンクで接続できます。';

// ========== UPDATED RENDER ==========
let _lastChatLatestKey = '';

function chatLatestKey() {
  return [
    mode,
    O.phase || '',
    O.day || 0,
    O.discRound || 0,
    (O.discMsgs || []).length,
    (O.wolfChatMsgs || []).length,
    Object.keys(O.roleClaims || {}).length,
  ].join('|');
}

function captureChatFeedScrolls() {
  const out = {};
  ['discFeed', 'wolfFeed', 'coFeed'].forEach(id => {
    const feed = document.getElementById(id);
    if (feed) out[id] = feed.scrollTop;
  });
  return out;
}

function restoreChatFeedScrolls(scrolls) {
  Object.entries(scrolls || {}).forEach(([id, top]) => {
    const feed = document.getElementById(id);
    if (feed) feed.scrollTop = Math.min(top, Math.max(0, feed.scrollHeight - feed.clientHeight));
  });
}

function scrollChatFeedsToLatest() {
  ['discFeed', 'wolfFeed', 'coFeed'].forEach(id => {
    const feed = document.getElementById(id);
    if (feed) feed.scrollTop = feed.scrollHeight;
  });
}

function scheduleChatLatestScroll(force=false) {
  if (!['discuss', 'wolf_chat'].includes(O.phase)) return;
  const key = chatLatestKey();
  if (!force && key === _lastChatLatestKey) return;
  _lastChatLatestKey = key;
  const run = () => scrollChatFeedsToLatest();
  if (typeof requestAnimationFrame === 'function') {
    requestAnimationFrame(() => {
      run();
      setTimeout(run, 60);
    });
  } else {
    setTimeout(run, 0);
  }
}

function restorePageScrollLater(y) {
  if (!Number.isFinite(y)) return;
  const run = () => window.scrollTo(0, y);
  if (typeof requestAnimationFrame === 'function') {
    requestAnimationFrame(run);
    setTimeout(run, 40);
  } else {
    setTimeout(run, 0);
  }
}

function render() {
  const app = document.getElementById('app');
  if (!app) return;
  QUALITY.suppressRender = true;
  try {
  const _chatPhases = ['discuss','wolf_chat'];
  const _wasChatPhase = _chatPhases.includes(O.phase);
  const _chatKeyBefore = chatLatestKey();
  const _feedScrolls = captureChatFeedScrolls();
  const _hadChatFeeds = Object.keys(_feedScrolls).length > 0;
  const _pageScrollY = window.scrollY || window.pageYOffset || 0;
  const _activeEl = document.activeElement;
  const _editableInputIds = ['discFreeInput','wolfFreeInput','coDraft','oVoteReason'];
  const _activeInputId = _editableInputIds.includes(_activeEl?.id) ? _activeEl.id : '';
  const _activeSelStart = _activeInputId ? _activeEl.selectionStart : null;
  const _activeSelEnd = _activeInputId ? _activeEl.selectionEnd : null;
  // チャット入力中のテキストを保持（CPUターンで再描画されても消えないように）
  const _discVal  = document.getElementById('discFreeInput')?.value  || '';
  const _wolfVal  = document.getElementById('wolfFreeInput')?.value  || '';
  const _coVal = document.getElementById('coDraft')?.value || '';
  const _voteTgt = document.getElementById('oVoteTgt')?.value || '';
  const _voteReason = document.getElementById('oVoteReason')?.value || '';
  if (O.phase === 'vote') {
    const validVoteTarget = _voteTgt && (O.alive || []).some(p => p.name === _voteTgt && p.name !== O.playerName);
    if (validVoteTarget) O.voteTarget = _voteTgt;
    if (_voteReason) O.voteReasonDraft = _voteReason;
  }

  if      (mode === 'pre_opening')                         app.innerHTML = renderPreOpening();
  else if (mode === 'opening')                             app.innerHTML = renderOpening();
  else if (mode === 'home')                                app.innerHTML = renderHome();
  else if (mode === 'codex')                               app.innerHTML = renderCodex();
  else if (mode === 'local')                               app.innerHTML = renderPhase();
  else if (mode === 'solo' && O.phase === 'solo_setup')    app.innerHTML = renderSoloSetup();
  else if (mode === 'p2p'  && O.phase === 'p2p_setup')    app.innerHTML = renderP2PSetup();
  else                                                     app.innerHTML = renderOnline();

  if (shouldShowFullscreenStartPrompt()) {
    app.insertAdjacentHTML('afterbegin', renderFullscreenStartPrompt());
  }
  if (QUALITY.errors.length) {
    app.insertAdjacentHTML('afterbegin', renderQualityBanner());
  }

  // 入力値を復元
  const discInput = document.getElementById('discFreeInput');
  if (discInput && _discVal) { discInput.value = _discVal; }
  const wolfInput = document.getElementById('wolfFreeInput');
  if (wolfInput && _wolfVal) { wolfInput.value = _wolfVal; }
  const coInput = document.getElementById('coDraft');
  if (coInput && _coVal) { coInput.value = _coVal; }
  const activeInput = _activeInputId ? document.getElementById(_activeInputId) : null;
  if (activeInput && !activeInput.disabled) {
    try {
      activeInput.focus({ preventScroll:true });
      if (Number.isFinite(_activeSelStart) && Number.isFinite(_activeSelEnd)) {
        activeInput.setSelectionRange(_activeSelStart, _activeSelEnd);
      }
    } catch(e) {}
  }
  const voteSelect = document.getElementById('oVoteTgt');
  if (voteSelect && O.voteTarget) voteSelect.value = O.voteTarget;
  const voteReason = document.getElementById('oVoteReason');
  if (voteReason) voteReason.value = _voteReason || O.voteReasonDraft || '';

  // 議論・チャット中は画面トップに飛ばさない（上下スクロール防止）
  const _isChatPhase = _chatPhases.includes(O.phase);
  const _isVotePhase = O.phase === 'vote' || (mode === 'local' && S.phase === 'vote');
  const _preservePageScroll = _isChatPhase || _isVotePhase || !!_activeInputId;
  if (!_preservePageScroll) window.scrollTo(0, 0);
  bindEvents();
  if (_isChatPhase) {
    const changed = chatLatestKey() !== _chatKeyBefore;
    if (changed || !_hadChatFeeds) scheduleChatLatestScroll(true);
    else restoreChatFeedScrolls(_feedScrolls);
  }
  if (_preservePageScroll) restorePageScrollLater(_pageScrollY);
  QUALITY.lastRenderOkAt = Date.now();
  } catch (err) {
    pushQualityError('render', err);
    renderEmergencyFallback(err);
  } finally {
    QUALITY.suppressRender = false;
  }
}

function renderPhase() {
  switch (S.phase) {
    case 'setup':       return renderSetup();
    case 'role_reveal': return renderRoleReveal();
    case 'night':       return renderNight();
    case 'day':         return renderDay();
    case 'vote':        return renderVote();
    case 'vote_result': return renderVoteResult();
    case 'game_over':   return renderGameOver();
    default: return '';
  }
}

// ========== GLOBAL HELPERS (onclick属性から呼ばれる) ==========
// ローカルゲーム人狼ターゲット選択（ステルス）
function localWolfPick(name) {
  S._wolfLocalSel = name;
  render();
}
// 捜査ノート: 怪しい → 信用 → 未定 をトグル（ソロ専用）
function toggleNote(name) {
  if (!O.notebook) O.notebook = {};
  const cur = O.notebook[name];
  const next = cur===undefined ? 'suspect' : cur==='suspect' ? 'trust' : undefined;
  if (next===undefined) delete O.notebook[name]; else O.notebook[name] = next;
  render();
}
function wolfSend(text) {
  if (p2pActionLocked()) { render(); return false; }
  if (O.phase === 'wolf_chat' && (O.wolfChatReady || O.wolfChatReadyPending)) return false;
  if (!wsSend({type:'wolf_chat_msg', text})) return false;
  // P2Pホストは送信処理中に自分へ即時エコーされるため、同一発言は1回だけ表示する。
  if (appendIncomingChatOnce(O.wolfChatMsgs, {name: O.playerName, text})) {
    speakChatMessage(O.playerName, text);
  }
  render();
  return true;
}
function wolfTplTarget(idx) {
  if (p2pActionLocked()) { render(); return; }
  if (O.phase === 'wolf_chat' && (O.wolfChatReady || O.wolfChatReadyPending)) return;
  const t = TPL.wolf_night[idx];
  const targets = O.wolfChatMsgs.length > 0
    ? O.alive.filter(p => p.name !== O.playerName)
    : O.alive.filter(p => p.name !== O.playerName);
  if (!targets.length) return;
  // 簡易的に最初のターゲットを選択するUIを表示
  const name = prompt('誰への発言ですか？\n' + targets.map(p=>p.name).join(' / '));
  if (!name) return;
  wolfSend(t.replace('{n}', name));
}

// ========== START ==========
let mode = 'pre_opening'; // pre_opening | opening | home | local | online | solo | p2p
initState();
applyP2PLaunchParams();
installRuntimeQualityGuards();
installFullscreenHooks();
installChatVoiceUnlock();
installP2PResumeHooks();
render();
</script>
