  // DISCUSS - message send buttons
  document.querySelectorAll('.tpl-send').forEach(btn => {
    btn.addEventListener('click', () => {
      if (p2pActionLocked()) { render(); return; }
      if (!canCurrentPlayerDiscuss()) { render(); return; }
      const msg = btn.dataset.msg;
      if (!msg) return;
      if (!wsSend({type:'disc_message', text: msg})) return;
      // カミングアウト検出（各COステップで送信した場合）
      if      (O.tplStep === 'msg_seer')    O.roleClaims[O.playerName] = 'SEER';
      else if (O.tplStep === 'msg_medium')  O.roleClaims[O.playerName] = 'MEDIUM';
      else if (O.tplStep === 'msg_doctor')  O.roleClaims[O.playerName] = 'DOCTOR';
      else if (O.tplStep === 'msg_neko')    O.roleClaims[O.playerName] = 'NEKOMATA';
      else if (O.tplStep === 'msg_shared')  O.roleClaims[O.playerName] = 'SHARED';
      O.isMyDiscTurn = false; O.tplStep = null;
      render();
    });
  });

  // DISCUSS - 投票開始ボタン
  on('btnVoteReady', () => {
    if (p2pActionLocked()) { render(); return; }
    if (O.voteReadyAll) return;
    if (O.voteReadyNames.includes(O.playerName)) return;
    if (O.voteReadyPending) return;
    if (!O.alive.some(p=>p.name===O.playerName)) return;
    O.voteReadyPending = true;
    if (!wsSend({type:'vote_ready'})) { O.voteReadyPending = false; return; }
    if (mode === 'p2p') scheduleP2PActionAckWatchdog('vote_ready');
    if (mode !== 'p2p') {
      if (!O.voteReadyNames.includes(O.playerName)) O.voteReadyNames.push(O.playerName);
      O.voteReadyTotal = O.voteReadyTotal || activeHumanCount();
      O.voteReadyPending = false;
    }
    render();
  });

  // DISCUSS - 月下の仮投票
  const preVoteTargetSelect = document.getElementById('preVoteTarget');
  if (preVoteTargetSelect) {
    preVoteTargetSelect.addEventListener('change', () => {
      O.preVoteTargetDraft = preVoteTargetSelect.value;
    });
  }
  on('preVoteSend', () => {
    if (p2pActionLocked() || O.phase !== 'discuss') { render(); return; }
    if (!isOnlinePlayerAlive() || O.preVotePending) return;
    const target = O.preVoteTargetDraft || val('preVoteTarget');
    const aliveNames = (O.alive || []).map(p => p.name || p).filter(Boolean);
    if (!target || target === O.playerName || !aliveNames.includes(target)) return;
    const current = (O.preVotes || {})[O.playerName] || '';
    const changes = Number((O.preVoteChanges || {})[O.playerName] || 0);
    if (current === target) return;
    if (current && changes >= 1) {
      alert('仮投票の票替えは1日1回までです。');
      return;
    }
    O.preVotePending = true;
    if (!wsSend({type:'pre_vote', target})) {
      O.preVotePending = false;
      return;
    }
    render();
  });

  // DISCUSS - BGMミュートボタン（端末単位。同じ部屋に複数スマホがある時に2重再生防止）
  // ミュートは音量0で再生継続 → onended が正常発火してゲームが止まらない
  on('btnBgmMute', () => {
    _bgmMuted = !_bgmMuted;
    if (bgmAudio) {
      try { bgmAudio.volume = _bgmMuted ? 0 : 0.55; } catch(e) {}
    }
    render();
  });

  // DISCUSS - チャット速度切替（熟読/ゆっくり/標準/はやい）
  on('btnChatSpeed', () => { cycleChatSpeed(); render(); });
  on('btnChatVoiceTest', () => { testChatVoice(); });
  on('btnChatVoiceEnable', () => { testChatVoice(); });

  // DISCUSS/WOLF - クイック入力（送信せず、編集できるよう入力欄へ入れる）
  document.querySelectorAll('[data-chat-template]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (p2pActionLocked()) { render(); return; }
      if (O.phase === 'wolf_chat' && (O.wolfChatReady || O.wolfChatReadyPending)) return;
      if (O.phase === 'discuss' && !isOnlinePlayerAlive()) { render(); return; }
      const input = document.getElementById(btn.dataset.chatInput || 'discFreeInput');
      if (!input) return;
      const targetEl = document.getElementById(btn.dataset.chatTarget || '');
      const target = targetEl ? targetEl.value : '';
      const text = (btn.dataset.chatTemplate || '').replace(/\{n\}/g, target || 'その人');
      input.value = text;
      input.focus();
      input.setSelectionRange(input.value.length, input.value.length);
    });
  });

  // DISCUSS - フリーテキスト送信
  on('discFreeSend', () => {
    const input = document.getElementById('discFreeInput');
    submitDiscussText(input ? input.value : '', input);
  });
  { // Enter key for discuss free input
    const fi = document.getElementById('discFreeInput');
    if (fi) fi.addEventListener('keydown', e => { if (e.key==='Enter') { e.preventDefault(); document.getElementById('discFreeSend')?.click(); } });
  }

  // DISCUSS - CO専用チャット送信
  on('coSend', () => {
    const input = document.getElementById('coDraft');
    submitDiscussText(input ? input.value : '', input);
  });
  on('coSelfSend', () => {
    const btn = document.getElementById('coSelfSend');
    submitDiscussText(btn ? btn.dataset.coText : '', null);
  });
  {
    const coDraft = document.getElementById('coDraft');
    if (coDraft) {
      coDraft.addEventListener('keydown', e => {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
          e.preventDefault();
          document.getElementById('coSend')?.click();
        }
      });
    }
  }

  // WOLF CHAT - フリーテキスト送信
  on('wolfFreeSend', () => {
    if (p2pActionLocked()) { render(); return; }
    if (O.wolfChatReady || O.wolfChatReadyPending) return;
    const input = document.getElementById('wolfFreeInput');
    const text = (input ? input.value : '').trim();
    if (!text) return;
    if (wolfSend(text) && input) input.value='';
  });
  { // Enter key for wolf free input
    const wi = document.getElementById('wolfFreeInput');
    if (wi) wi.addEventListener('keydown', e => { if (e.key==='Enter') { e.preventDefault(); document.getElementById('wolfFreeSend')?.click(); } });
  }

  // DISCUSS - クイック同調ボタン（data-agree-name）
  document.querySelectorAll('[data-agree-name]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (p2pActionLocked()) { render(); return; }
      if (!canCurrentPlayerDiscuss()) { render(); return; }
      if (!O.isMyDiscTurn) return;
      const name = btn.dataset.agreeName;
      const agree_templates = [
        `${name}さんへの疑惑、私も同感です 👍`,
        `確かに${name}さんが気になりますね 🤝`,
        `${name}さんの発言、その通りだと思います ✨`,
        `私も${name}さんへの意見に賛成です 🙋`,
        `${name}さんへの指摘は鋭いと思います 🎯`,
      ];
      const msg = agree_templates[Math.floor(Math.random()*agree_templates.length)];
      if (!wsSend({type:'disc_message', text:msg})) return;
      O.isMyDiscTurn=false; O.tplStep=null;
      render();
    });
  });

  // VOTE - アバターグリッドボタンで投票先を選択
  const defaultVoteReason = name => `${name}さんの発言と立ち位置が気になっています。`;
  const isAutoVoteReason = text => /さんの発言と立ち位置が気になっています。$/.test((text || '').trim());
  const syncVoteTarget = name => {
    if (!name) return;
    O.voteTarget = name;
    const sel = document.getElementById('oVoteTgt');
    if (sel) sel.value = name;
    const reason = document.getElementById('oVoteReason');
    if (reason && (!reason.value.trim() || isAutoVoteReason(reason.value))) {
      reason.value = defaultVoteReason(name);
      O.voteReasonDraft = reason.value;
    }
    document.querySelectorAll('.vote-avatar-btn').forEach(b => {
      const active = b.dataset.name === name;
      b.style.background = active ? 'rgba(107,33,168,.3)' : 'rgba(255,255,255,.06)';
      b.style.border = active ? '2px solid #6b21a8' : '1px solid rgba(255,255,255,.12)';
    });
  };

  document.querySelectorAll('.vote-avatar-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const name = btn.dataset.name;
      syncVoteTarget(name);
    });
  });
  {
    const voteSelect = document.getElementById('oVoteTgt');
    if (voteSelect) voteSelect.addEventListener('change', () => {
      syncVoteTarget(voteSelect.value);
    });
    const voteReason = document.getElementById('oVoteReason');
    if (voteReason) voteReason.addEventListener('input', () => { O.voteReasonDraft = voteReason.value; });
  }

  // ONLINE NIGHT ACTION — wolf はアイコングリッドから選択
  document.querySelectorAll('[data-wolf-pick]').forEach(card => {
    card.addEventListener('click', () => {
      if (p2pActionLocked() || O.nightActionPending) return;
      O._wolfNightSel = card.dataset.wolfPick;
      render();
    });
  });

  on('oNightSend', () => {
    if (p2pActionLocked()) { render(); return; }
    const btn = document.getElementById('oNightSend');
    const action = btn ? btn.dataset.action : null;
    // wolf: ステルスグリッドから選択、それ以外: ドロップダウン
    const brainwashVoter = action === 'brainwash' ? val('oBrainwashVoter') : '';
    const brainwashTarget = action === 'brainwash' ? val('oBrainwashTarget') : '';
    const target = (action === 'wolf') ? (O._wolfNightSel || '') : (action === 'brainwash' ? brainwashVoter : val('oNightTgt'));
    const voteTarget = action === 'brainwash' ? brainwashTarget : '';
    if (!action || !target || (action === 'brainwash' && !voteTarget)) return;
    const needed = O.nightActionNeeded || {};
    const allowedTargets = (needed.targets || []).map(t => t.name);
    if (needed.action && needed.action !== action) return;
    const selectedTargets = action === 'brainwash' ? [target, voteTarget] : [target];
    if (allowedTargets.length && selectedTargets.some(name => !allowedTargets.includes(name))) {
      alert('選択できる相手を選び直してください');
      return;
    }
    if (action === 'brainwash') {
      if (target === voteTarget || target === O.playerName || voteTarget === O.playerName || (needed.last_brainwashed && target === needed.last_brainwashed)) {
        alert('洗脳する人と強制する投票先は別々に選び、前夜の対象は選ばないでください');
        return;
      }
    }
    if (action === 'doctor') {
      if (target === O.playerName) {
        alert('騎士は自分自身を護衛できません');
        return;
      }
      if (needed.last_protected && target === needed.last_protected) {
        alert('同じ人を2夜連続で護衛することはできません');
        return;
      }
    }
    if (action === 'doctor') O._myLastGuard = target; // 戦績: 護衛成功判定用
    const nightPayload = {type:'night_action', action, target};
    if (action === 'brainwash') nightPayload.vote_target = voteTarget;
    if (!wsSend(nightPayload)) return;
    if (mode === 'p2p') {
      O.nightActionPending = true;
      scheduleP2PActionAckWatchdog('night_action');
    } else {
      O.nightActionDone = true;
    }
    O._wolfNightSel = null;
    render();
  });

  // ONLINE DAY → 自動遷移（サーバーが vote_start を送ってくる）

  // ONLINE VOTE
  on('oVoteSend', () => {
    if (p2pActionLocked()) { render(); return; }
    if (O.voteSubmitted) return; // 二重投票防止
    const target = O.voteTarget || val('oVoteTgt');
    if (!target) return;
    const validTargets = (O.alive || []).filter(p => p.name !== O.playerName).map(p => p.name);
    if (!validTargets.includes(target)) {
      alert('投票先を選び直してください');
      return;
    }
    const reason = (O.voteReasonDraft || val('oVoteReason') || '').trim() || `${target}さんの発言と投票の流れが気になりました。`;
    (O.myVotes = O.myVotes||[]).push(target); // 戦績スコア用（自分の投票履歴）
    if (!wsSend({type:'vote', target, reason})) return;
    O.voteSubmitted = true;
    O.voteSentAt = Date.now();
    O.voteAckAt = 0;
    O.voteAckWarningAt = 0;
    O.voteAckRetryAt = 0;
    O.voteAckRetryCount = 0;
    O.voteSentTarget = target;
    O.voteSentReason = reason;
    scheduleVoteAckWatchdog();
    render();
  });

  // ONLINE DAY → VOTE (WebSocketモード用)
  on('oGoVote', () => wsSend({type:'vote_start'}));

  // ONLINE VOTE RESULT → NEXT
  on('oNextNight', () => wsSend({type:'next_night'}));
  on('oGoGameOver', () => { if (['solo','p2p','online'].includes(mode)) scoreGame(); O.phase = 'game_over'; render(); });

  // ONLINE GAME OVER
  on('oRestart', () => {
    try { stopMusic(); } catch(e){}
    if (O.ws) O.ws.close();
    if (mode === 'solo') SoloEngine.resetTimers();   // ソロの残留タイマー停止
    if (mode === 'p2p')  P2PEngine.destroy();
    initOnline(); mode = 'home'; render();
  });
}

// ========== SOLO ENGINE (サーバー不要 / GitHub Pages 対応) ==========
const SoloEngine = (() => {
  const CPU_NAMES = CHARACTER_AVATARS.map(a => a.label);
  let R = {};

  let _timers = [];
  function emit(msg)        { const id = setTimeout(() => handleServer(msg), 0); _timers.push(id); return id; }
  function later(ms, fn)    { const id = setTimeout(fn, ms); _timers.push(id); return id; }
  // 前ゲームの残留タイマーを全消去（リスタート時の誤発火＝フェーズ破壊を防ぐ）
  function resetTimers() {
    _timers.forEach(clearTimeout); _timers = [];
    if (R && R._humanTurnTimer) { clearTimeout(R._humanTurnTimer); R._humanTurnTimer = null; }
    if (R && R._discFallback)   { clearTimeout(R._discFallback);   R._discFallback = null; }
    if (R && R._voteFallback)   { clearTimeout(R._voteFallback);   R._voteFallback = null; }
  }
  function shuffle(a)       { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
  function rand(a)          { return a[Math.floor(Math.random()*a.length)]; }
  function rInt(lo,hi)      { return lo+Math.floor(Math.random()*(hi-lo+1)); }
  function alive()          { return R.players.filter(p=>p.alive); }
  function byName(n)        { return R.players.find(p=>p.name===n); }

  // ── 初期化 ────────────────────────────────────────────
  function init(humanName, total) {
    resetTimers(); // 前ゲームのタイマーを掃除してからR を作り直す
    total = Math.max(4, Math.min(MAX_PLAYERS, total));
    const cpuPool = shuffle(CPU_NAMES.filter(n=>n!==humanName));
    const players = [{ name: humanName, isCpu: false, alive: true, role: '' }];
    for (let i=1; i<total; i++)
      players.push({ name: cpuPool[i-1]||`CPU${i}`, isCpu: true, alive: true, role: '' });

    const roles = shuffle([...CONFIGS[total]]);
    players.forEach((p,i) => p.role = roles[i]);
    assignOnlineAvatars(players);
    // CPUにパーソナリティをランダム付与
    players.forEach(p => { if (p.isCpu) applyCpuPersona(p); });

    R = {
      players, day: 0, phase: 'role',
      wolfTarget: null, doctorTarget: null,
      lastDoctorTarget: null, lastExecuted: null, lastExecutedRole: null,
      nightReport: null,
      humanNightDone: false, cpuNightDone: false,
      humanWolfChoice: null,
      brainwash: null, brainwashApplied: false, brainwashDetail: null, brainwashHistory: [], lastBrainwashVoter: null,
      discMsgs: [], discOrder: [], discIdx: 0, discRound: 1,
      preVotes: {}, preVoteChanges: {},
      votes: {}, voteReasons: {}, humanVoted: false, tallyDone: false, resolveDone: false,
      accuCount: {}, seerKnown: {}, log: [],
    };
    BRAIN.initR(R); // BRAIN メモリ初期化

    const human = players[0];
    const wolves = players.filter(p=>p.role==='WEREWOLF');
    const wolfPartners = human.role==='WEREWOLF'
      ? wolves.filter(p=>p!==human).map(p=>p.name) : [];
    const sharedPartners = human.role==='SHARED'
      ? players.filter(p=>p.role==='SHARED' && p!==human).map(p=>p.name) : [];

    emit({
      type: 'game_started',
      role: human.role,
      wolf_partners: wolfPartners,
      shared_partners: sharedPartners,
      players: players.map((p, i)=>({
        pid: i,
        name: p.name,
        isCpu: !!p.isCpu,
        avatarIndex: p.avatarIndex,
        avatarLabel: p.avatarLabel
      })),
      is_host: true,
    });
  }

  // ── 人狼チャット ──────────────────────────────────────
  function startWolfChat() {
    R.phase = 'wolf_chat';
    BRAIN.initR(R);
    const wolves = alive().filter(p=>p.role==='WEREWOLF');
    emit({ type: 'wolf_chat_start', wolf_names: wolves.map(p=>p.name) });

    const cpuWolves = wolves.filter(p=>p.isCpu);
    const vill = alive().filter(p=>p.role!=='WEREWOLF');
    let nextNightDelay = 900;
    if (cpuWolves.length && vill.length) {
      const tgt = BRAIN.wolfNightTarget(R) || topAcc(vill) || rand(vill);
      let t = 1000;
      cpuWolves.forEach((w, idx) => {
        later(t, () => emit({ type:'wolf_chat_msg', name:w.name,
          text: personagizeWolfNight(w, tgt.name) }));
        t += 1300 + Math.floor(Math.random()*600);
      });
      nextNightDelay = t + 500;
    }
    const humanWolfAlive = alive().some(p => !p.isCpu && p.role === 'WEREWOLF');
    if (!humanWolfAlive) {
      later(nextNightDelay, () => { if (R.phase === 'wolf_chat') startNight(); });
    }
  }

  function beginNightFlow() {
    if (!['role', 'vote_result'].includes(R.phase)) return false;
    alive().some(p => !p.isCpu && p.role === 'WEREWOLF') ? startWolfChat() : startNight();
    return true;
  }

  // ── 夜フェーズ ────────────────────────────────────────
  function startNight() {
    R.day++; R.phase = 'night';
    R.wolfTarget = null; R.doctorTarget = null; R.brainwash = null; R.brainwashApplied = false;
    R.humanNightDone = false; R.cpuNightDone = false;
    R.humanWolfChoice = null; R.resolveDone = false;

    const al = alive();
    emit({ type: 'night_start', day: R.day });

    // 霊媒師（処刑があった場合）
    const human = R.players[0];
    if (human.alive && human.role==='MEDIUM' && R.lastExecuted) {
      emit({ type:'medium_reveal', target:R.lastExecuted, role:R.lastExecutedRole });
    }

    if (human.alive) {
      const others = al.filter(p=>p!==human);
      // 初日から全役職が行動可能
      if (human.role==='WEREWOLF') {
        const wolfNames = al.filter(p=>p.role==='WEREWOLF').map(p=>p.name);
        emit({ type:'action_needed', action:'wolf', targets:others.filter(p=>p.role!=='WEREWOLF').map(p=>({name:p.name})), wolf_names:wolfNames });
      } else if (human.role==='SEER') {
        emit({ type:'action_needed', action:'seer', targets:others.map(p=>({name:p.name})) });
      } else if (human.role==='DOCTOR') {
        // 自分自身と前夜に守った人は選択肢から除外（自衛・連続護衛禁止）
        const docTargets = al.filter(p=>p.name!==human.name && p.name!==R.lastDoctorTarget);
        if (docTargets.length) {
          emit({ type:'action_needed', action:'doctor', targets:docTargets.map(p=>({name:p.name})), last_protected:R.lastDoctorTarget });
        } else {
          R.humanNightDone = true;
        }
      } else if (human.role==='MADMAN_ACTIVE') {
        const brainwashTargets = others.filter(p=>p.name!==R.lastBrainwashVoter);
        if (brainwashTargets.length >= 2) emit({ type:'action_needed', action:'brainwash', targets:brainwashTargets.map(p=>({name:p.name})), last_brainwashed:R.lastBrainwashVoter || null });
        else R.humanNightDone = true;
      } else {
        R.humanNightDone = true;
      }
    } else {
      R.humanNightDone = true;
    }

    later(1400, () => {
      doCpuNight();
      R.cpuNightDone = true;
      if (R.humanNightDone) later(700, resolveNight);
    });
  }

  function doCpuNight() {
    BRAIN.initR(R);
    const al = alive();
    // 占い師CPU（毎夜）: 怪しい人・役職CO・発言の薄い人を積極的に占う
    const cpuSeer = al.find(p=>p.isCpu && p.role==='SEER');
    if (cpuSeer) {
      const tgt = BRAIN.chooseSeerNightTarget(R, cpuSeer, al);
      if (tgt) R.seerKnown[tgt.name] = (tgt.role==='WEREWOLF');
    }
    // 人狼CPU標的（BRAIN による戦略的選択）
    const cpuWolves = al.filter(p=>p.isCpu && p.role==='WEREWOLF');
    const vill = al.filter(p=>p.role!=='WEREWOLF');
    if (cpuWolves.length && vill.length) {
      const target = BRAIN.wolfNightTarget(R) || topAcc(vill) || rand(vill);
      if (target) R.wolfTarget = target.name;
    }
    // 能動型狂人CPU: 公開情報を基に一票を操作する
    const cpuMadman = al.find(p=>p.isCpu && p.role==='MADMAN_ACTIVE');
    if (cpuMadman) {
      const brainwashPool = al.filter(p=>p.name!==cpuMadman.name && p.name!==R.lastBrainwashVoter);
      const plan = BRAIN.chooseBrainwashTargets(R, cpuMadman, brainwashPool);
      if (plan) { R.brainwash = { voter:plan.voter.name, target:plan.target.name, day:R.day, actor:cpuMadman.name }; R.lastBrainwashVoter = plan.voter.name; }
    }
    // 騎士CPU: 自衛・連続護衛を避け、役職COした情報源を優先して守る
    const cpuDoc = al.find(p=>p.isCpu && p.role==='DOCTOR');
    if (cpuDoc) {
      const tgt = BRAIN.chooseDoctorGuardTarget(R, cpuDoc, al);
      if (tgt) R.doctorTarget = tgt.name;
    }
  }

  function resolveNight() {
    if (R.resolveDone) return;
    R.resolveDone = true;
    const wt = R.humanWolfChoice || R.wolfTarget;
    const dt = R.doctorTarget;
    R.nightReport = { day:R.day, target:wt||null, protected:dt||null, guarded:false, victim:null, dragged:null };
    // 騎士護衛対象を次夜用に記録（連続護衛禁止）
    R.lastDoctorTarget = dt;
    R.wolfTarget = null; R.doctorTarget = null; R.humanWolfChoice = null;

    let victim = null;
    if (wt && alive().some(p=>p.role==='WEREWOLF')) {
      if (dt === wt) {
        R.log.push(`第${R.day}夜: 騎士が守り、誰も死ななかった`);
      } else {
        const p = byName(wt);
        if (p && p.alive) {
          p.alive = false; victim = p;
          R.nightReport.victim = p.name;
          R.log.push(`第${R.day}夜: ${wt} が人狼に襲われた`);
          // 猫又ルール: 猫又が夜に殺されると人狼を1人道連れ
          if (p.role === 'NEKOMATA') {
            const wolves = alive().filter(x=>x.role==='WEREWOLF');
            if (wolves.length) {
              const dragged = rand(wolves);
              dragged.alive = false;
              R.nightReport.dragged = dragged.name;
              R.log.push(`第${R.day}夜: 猫又の道連れで ${dragged.name}（人狼）も倒れた`);
            }
          }
        }
      }
      if (dt === wt) R.nightReport.guarded = true;
    }
    const win = checkWin();
    if (win) { doGameOver(win, victim); return; }
    later(400, () => startDiscuss(victim));
  }

  // ── 議論フェーズ ──────────────────────────────────────
  function _checkVoteReady() {
    if (R.phase !== 'discuss') return;
    if (alive().every(p => R.voteReadySet.has(p.name))) {
      if (R._discFallback) { clearTimeout(R._discFallback); R._discFallback = null; }
      emit({ type: 'vote_ready_all' });
      later(1900, () => { if (R.phase === 'discuss') { R.phase = 'voting'; startVote(); } });
    }
  }

  function startDiscuss(victim) {
    R.phase = 'discuss'; R.discMsgs = [];
    R.discRound = 1; R.discIdx = 0;
    R.preVotes = {}; R.preVoteChanges = {};
    R.voteReadySet = new Set();
    R.discOrder = shuffle(alive().map(p=>p.name));
    // 楽曲を先に選んでタイムスタンプを確定（同室デバイス間での同期用）
    const song = _pickSong();
    const songStarted = Date.now() + 650; // 650ms後に再生開始
    // 音楽が流れない場合のフォールバックタイマー（5分）
    if (R._discFallback) clearTimeout(R._discFallback);
    R._discFallback = setTimeout(() => {
      if (R.phase === 'discuss') { R.phase = 'voting'; startVote(); }
    }, 5 * 60 * 1000);
    emit({
      type: 'discuss_start', round: 1, total_rounds: 2,
      eliminated: victim ? { name:victim.name } : null,
      night_report: R.nightReport,
      alive: alive().map(p=>({ name:p.name })),
      pre_votes: R.preVotes, pre_vote_changes: R.preVoteChanges,
      song, songStarted,
    });
    later(700, advanceDisc);
  }

  function publishSoloPreVote(cpu) {
    if (!cpu || !cpu.alive || !cpu.isCpu || R.phase !== 'discuss' || R.discRound !== 1) return;
    if (!R.preVotes) R.preVotes = {};
    if (!R.preVoteChanges) R.preVoteChanges = {};
    if (R.preVotes[cpu.name]) return;
    const target = BRAIN.vote(R, cpu);
    if (!target) return;
    R.preVotes[cpu.name] = target.name;
    emit({ type:'pre_vote_update', pre_votes:{...R.preVotes}, pre_vote_changes:{...R.preVoteChanges} });
  }

  function advanceDisc() {
    if (R.phase !== 'discuss') return; // 音楽終了等でフェーズ変化済みならスキップ
    if (R.discIdx >= R.discOrder.length) {
      if (R.discRound < 2) {
        R.discRound++; R.discIdx = 0;
        emit({ type:'disc_new_round', round:R.discRound });
        later(500, advanceDisc);
      } else {
        // 2ラウンド完了: 全CPUを自動レディ（人間が押すまで音楽継続）
        alive().filter(p=>p.isCpu).forEach((p,i) => {
          later(600 + i*350, () => {
            if (R.phase !== 'discuss') return;
            R.voteReadySet.add(p.name);
            emit({ type:'vote_ready_upd', readyNames:[...R.voteReadySet] });
            _checkVoteReady();
          });
        });
      }
      return;
    }
    const spName = R.discOrder[R.discIdx];
    const sp = byName(spName);
    if (!sp || !sp.alive) { R.discIdx++; advanceDisc(); return; }
    emit({ type:'disc_turn', name:spName });
    if (!sp.isCpu) {
      later(80, () => emit({ type:'your_disc_turn' }));
      // 30秒発言なしで自動進行（音楽未再生環境対策）
      if (R._humanTurnTimer) clearTimeout(R._humanTurnTimer);
      const _autoSpName = spName;
      R._humanTurnTimer = setTimeout(() => {
        if (R.phase !== 'discuss') return;
        if (R.discOrder[R.discIdx] !== _autoSpName) return; // 既に進んでいる
        R.discIdx++;
        later(200, advanceDisc);
      }, 30 * 1000);
    } else {
      // CPUの発言: 速度設定に応じて「考え中」表示 → 発言 → 読む間
      later(typingDelay(sp.personality), () => {
        if (R.phase !== 'discuss') return;
        const text = BRAIN.speak(R, sp);
        BRAIN.parseClaim(R, spName, text); // 自分の発言から claims を登録
        R.discMsgs.push({ name:spName, text });
        emit({ type:'disc_message', name:spName, text });
        publishSoloPreVote(sp);
        R.discIdx++;
        later(readPause(text), advanceDisc); // テキスト長に比例した読む時間を確保
      });
    }
  }

  // ── 投票フェーズ ──────────────────────────────────────
  function soloVoteComplete(al) {
    const aliveList = al || alive();
    const human = R.players[0];
    const humanDone = !human || !human.alive || R.humanVoted;
    return humanDone && aliveList.every(p => R.votes[p.name] !== undefined);
  }

  function applySoloBrainwashVote(voterName, intendedTarget) {
    const effect = R.brainwash;
    const voter = byName(voterName);
    const forcedTarget = effect ? byName(effect.target) : null;
    if (!effect || effect.voter !== voterName || !voter?.alive || !forcedTarget?.alive || forcedTarget.name === voterName)
      return { target:intendedTarget, forced:false };
    R.brainwashApplied = true;
    R.brainwashDetail = {
      day: R.day,
      actor: effect.actor || '',
      voter: voterName,
      intendedTarget,
      forcedTarget: forcedTarget.name,
      changed: intendedTarget !== forcedTarget.name,
    };
    return { target:forcedTarget.name, forced:true };
  }
  function autoFillMissingCpuVotes() {
    const al = alive();
    al.filter(p => p.isCpu && R.votes[p.name] === undefined).forEach(cpu => {
      let tgt = BRAIN.vote(R, cpu);
      if (!tgt) {
        const others = al.filter(p => p.name !== cpu.name);
        tgt = others.length ? rand(others) : null;
      }
      if (tgt) {
        const applied = applySoloBrainwashVote(cpu.name, tgt.name);
        R.votes[cpu.name] = applied.target;
        R.voteReasons[cpu.name] = BRAIN.voteReason(R, cpu, tgt);
      }
    });
    return al;
  }

  function maybeTallySoloVotes(delay=400) {
    if (R.phase !== 'vote' || R.tallyDone) return;
    if (soloVoteComplete()) later(delay, tallyVotes);
  }

  function startVote() {
    R.phase = 'vote'; R.votes = {}; R.voteReasons = {}; R.humanVoted = false; R.tallyDone = false; R.brainwashApplied = false; R.brainwashDetail = null;
    if (R._voteFallback) { clearTimeout(R._voteFallback); R._voteFallback = null; }
    if (R._discFallback) { clearTimeout(R._discFallback); R._discFallback = null; } // 議論フォールバックを確実に停止
    const al = alive();
    if (!R.players[0].alive) R.humanVoted = true; // 死亡プレイヤーは投票不要
    emit({ type:'vote_start', alive:al.map(p=>({ name:p.name })) });
    const cpus = al.filter(p=>p.isCpu);
    cpus.forEach((cpu, i) => {
      later(1500 + i*1200, () => {
        const tgt = BRAIN.vote(R, cpu);
        if (tgt) {
          const applied = applySoloBrainwashVote(cpu.name, tgt.name);
          R.votes[cpu.name] = applied.target;
          R.voteReasons[cpu.name] = BRAIN.voteReason(R, cpu, tgt);
        }
        const done = Object.keys(R.votes).length;
        emit({ type:'vote_progress', done, total:al.length });
        maybeTallySoloVotes(400);
      });
    });
    R._voteFallback = setTimeout(() => {
      R._voteFallback = null;
      if (R.phase !== 'vote' || R.tallyDone) return;
      if (R.players[0]?.alive && !R.humanVoted) return;
      const live = autoFillMissingCpuVotes();
      emit({ type:'vote_progress', done:Object.keys(R.votes).length, total:live.length });
      maybeTallySoloVotes(250);
    }, Math.max(9000, 2600 + cpus.length * 1500));
    if (!cpus.length) maybeTallySoloVotes(500);
  }

  function tallyVotes() {
    if (R.tallyDone) return;
    R.tallyDone = true;
    const al = alive();
    const count = {};
    al.forEach(p=>count[p.name]=0);
    Object.values(R.votes).forEach(n=>{ if(count[n]!==undefined) count[n]++; });
    let maxV=0, executed=null;
    Object.entries(count).forEach(([n,c])=>{ if(c>maxV){maxV=c;executed=n;} });
    if (!executed && al.length) executed = rand(al).name;
    const execP = byName(executed);
    if (execP) execP.alive = false;
    R.log.push(`第${R.day}日: ${executed} が処刑された`);
    // 霊媒師用に処刑情報を保存
    R.lastExecuted = executed;
    R.lastExecutedRole = execP?.role;
    if (!R.voteHistory) R.voteHistory = [];
    R.voteHistory.push({day:R.day, votes:{...R.votes}, preVotes:{...R.preVotes}, tally:{...count}, executed});
    if (R.brainwashDetail) R.brainwashHistory.push({...R.brainwashDetail, tally:{...count}, executed});
    // 猫又ルール: 処刑時にランダムな生存者を道連れ
    let nekomataVictim = null;
    if (execP?.role === 'NEKOMATA') {
      const bystanders = alive(); // execP は既に alive=false
      if (bystanders.length) {
        nekomataVictim = rand(bystanders);
        nekomataVictim.alive = false;
        R.log.push(`第${R.day}日: 猫又の道連れで ${nekomataVictim.name} も倒れた`);
      }
    }
    const win = checkWin();
    R.phase = win ? 'game_over' : 'vote_result';
    R.winner = win || null;
    emit({
      type: 'vote_result',
      executed, executed_role: execP?.role, tally: count,
      nekomata_victim: nekomataVictim?.name,
      vote_reasons: R.voteReasons,
      votes: R.votes,
      pre_votes: R.preVotes,
      brainwash_count: R.brainwashApplied ? 1 : 0,
      brainwash_history: win ? R.brainwashHistory : null,
      winner: win,
      players: win ? R.players.map(p=>({name:p.name,role:p.role,alive:p.alive})) : null,
      log: win ? R.log : null,
    });
    // 霊媒師（人間）に結果を通知
    const humanMedium = R.players.find(p=>!p.isCpu && p.alive && p.role==='MEDIUM');
    if (humanMedium) {
      emit({ type:'medium_reveal', target:executed, role:execP?.role });
    }
  }

  // ── ユーティリティ ────────────────────────────────────
  function checkWin() {
    const al = alive();
    const w = al.filter(p=>p.role==='WEREWOLF');
    const v = al.filter(p=>p.role!=='WEREWOLF');
    if (!w.length) return 'village';
    if (w.length >= v.length) return 'wolf';
    return null;
  }
  function doGameOver(winner, victim) {
    R.phase = 'game_over';
    R.winner = winner;
    emit({
      type: 'game_over', winner,
      players: R.players.map(p=>({name:p.name,role:p.role,alive:p.alive})),
      log: R.log,
      night_report: R.nightReport || null,
      eliminated: victim ? {name:victim.name,role:victim.role} : null,
    });
  }
  function topAcc(players) {
    let max=0, best=null;
    players.forEach(p=>{ const c=R.accuCount[p.name]||0; if(c>max){max=c;best=p;} });
    return best;
  }
  function cpuTpl(cpu) {
    const al = alive();
    const others = al.filter(p=>p.name!==cpu.name);
    const wasAcc = (R.accuCount[cpu.name]||0) > 0;
    const pers = cpu.personality || 'balanced';

    // ── 人狼・狂人 ──
    if (cpu.role==='WEREWOLF' || cpu.role==='MADMAN') {
      if (wasAcc) return rand(TPL.defend);
      const vill = others.filter(p=>p.role!=='WEREWOLF');
      if (pers === 'wolf_smart') {
        // 洗練された欺瞞: 時々先手防衛、高確率で告発
        if (Math.random() < 0.12) return rand(TPL.defend);
        if (vill.length && Math.random() < 0.78) {
          const tgt = topAcc(vill)||rand(vill);
          R.accuCount[tgt.name] = (R.accuCount[tgt.name]||0)+1;
          return tplFill(rand(TPL.accuse), tgt.name);
        }
        return rand(TPL.neutral);
      }
      const acProb = pers==='aggressive' ? 0.82 : 0.65;
      if (vill.length && Math.random() < acProb) {
        const tgt = topAcc(vill)||rand(vill);
        R.accuCount[tgt.name] = (R.accuCount[tgt.name]||0)+1;
        return tplFill(rand(TPL.accuse), tgt.name);
      }
      return rand(TPL.neutral);
    }

    // ── 占い師 ──
    if (cpu.role==='SEER') {
      const known = Object.entries(R.seerKnown);
      const revProb = pers==='quick_co' ? 0.88 : pers==='secretive' ? 0.20 : 0.55;
      if (known.length && Math.random() < revProb) {
        const [name, isWolf] = rand(known);
        if (isWolf) R.accuCount[name] = (R.accuCount[name]||0)+2;
        return tplFill(rand(isWolf?TPL.seer_wolf:TPL.seer_safe), name);
      }
      // quick_co: 情報がなくても占い師COする
      if (pers==='quick_co' && R.discRound===1 && Math.random()<0.65)
        return rand(['占い師としてCOします 🔮', '私が占い師です。情報を集めています 🔮', '占い師として名乗り出ます。信じてください 🔮']);
    }

    // ── 騎士 ──
    if (cpu.role==='DOCTOR') {
      const coProb = pers==='quick_co' ? 0.50 : pers==='secretive' ? 0.04 : 0.12;
      if (Math.random() < coProb)
        return rand(['騎士としてCOします 💊', '私は騎士です。誰かを守っています 💊', '騎士COします。大切な人を護衛中です 💊']);
    }

    if (wasAcc) return rand(TPL.defend);

    const accuseProb = pers==='aggressive' ? 0.70 : pers==='secretive' ? 0.10 : pers==='quick_co' ? 0.35 : 0.40;
    if (others.length && Math.random() < accuseProb) {
      const tgt = topAcc(others)||rand(others);
      R.accuCount[tgt.name] = (R.accuCount[tgt.name]||0)+1;
      return tplFill(rand(TPL.accuse), tgt.name);
    }
    if (pers==='secretive') return rand(TPL.neutral);
    if (pers==='aggressive') return rand(TPL.pressure);
    return rand([...TPL.neutral,...TPL.question].slice(0,14));
  }

  // ── クライアントからのメッセージ処理 ─────────────────
  function handle(data) {
    switch (data.type) {
      case 'start_night':
        beginNightFlow();
        break;
      case 'wolf_chat_done':
        later(400, startNight);
        break;
      case 'wolf_chat_msg':
        // ローカル表示済み、ソロではブロードキャスト不要
        break;
      case 'night_action': {
        const human = R.players[0];
        if (human.role==='WEREWOLF') {
          R.humanWolfChoice = data.target;
          emit({ type:'wolf_chosen', target:data.target });
          emit({ type:'action_ack' });
        } else if (human.role==='SEER') {
          const tgt = byName(data.target);
          if (!tgt || !tgt.alive || tgt.name===human.name) {
            emit({ type:'error', msg:'占える相手を選び直してください' });
            break;
          }
          const isWolf = tgt ? tgt.role==='WEREWOLF' : false;
          R.seerKnown[data.target] = isWolf;
          emit({ type:'seer_result', target:data.target, is_wolf:isWolf });
        } else if (human.role==='DOCTOR') {
          const tgt = byName(data.target);
          if (!tgt || !tgt.alive || tgt.name===human.name) {
            emit({ type:'error', msg:'騎士は自分自身を護衛できません' });
            break;
          }
          if (tgt.name===R.lastDoctorTarget) {
            emit({ type:'error', msg:'同じ人を2夜連続で護衛することはできません' });
            break;
          }
          R.doctorTarget = data.target;
          emit({ type:'action_ack' });
        } else if (human.role==='MADMAN_ACTIVE') {
          const voter = byName(data.target);
          const forcedTarget = byName(data.vote_target);
          if (!voter || !forcedTarget || !voter.alive || !forcedTarget.alive || voter.name===human.name || forcedTarget.name===human.name || voter.name===forcedTarget.name || voter.name===R.lastBrainwashVoter) {
            emit({ type:'error', msg:'洗脳する人と強制する投票先を別々に選んでください' });
            break;
          }
          R.brainwash = { voter:voter.name, target:forcedTarget.name, day:R.day, actor:human.name };
          R.lastBrainwashVoter = voter.name;
          emit({ type:'action_ack', action:'brainwash' });
        }
        R.humanNightDone = true;
        if (R.cpuNightDone) later(700, resolveNight);
        break;
      }
      case 'music_ended':
        if (R.phase === 'discuss') { R.phase = 'voting'; later(300, startVote); }
        break;
      case 'vote_ready':
        if (R.phase !== 'discuss') break;
        if (!R.voteReadySet) R.voteReadySet = new Set();
        R.voteReadySet.add(R.players[0].name);
        emit({ type:'vote_ready_upd', readyNames:[...R.voteReadySet] });
        _checkVoteReady();
        break;
      case 'pre_vote': {
        if (R.phase !== 'discuss') break;
        const human = R.players[0];
        const target = byName(data.target);
        if (!human || !human.alive || !target || !target.alive || target.name === human.name) {
          emit({ type:'error', msg:'仮投票先は現在の生存者から選んでください。' });
          break;
        }
        if (!R.preVotes) R.preVotes = {};
        if (!R.preVoteChanges) R.preVoteChanges = {};
        const current = R.preVotes[human.name] || '';
        const changes = Number(R.preVoteChanges[human.name] || 0);
        if (current === target.name) {
          emit({ type:'pre_vote_update', pre_votes:{...R.preVotes}, pre_vote_changes:{...R.preVoteChanges} });
          break;
        }
        if (current && changes >= 1) {
          emit({ type:'error', msg:'仮投票の票替えは1日1回までです。' });
          break;
        }
        if (current) R.preVoteChanges[human.name] = changes + 1;
        R.preVotes[human.name] = target.name;
        emit({ type:'pre_vote_update', pre_votes:{...R.preVotes}, pre_vote_changes:{...R.preVoteChanges} });
        break;
      }
      case 'disc_message': {
        if (R.phase !== 'discuss') break;
        const human = R.players[0];
        if (!human || !human.alive) {
          emit({ type:'error', msg:'死亡者は議論に発言できません' });
          break;
        }
        // BRAIN によるクレーム＆疑い解析（人間発言から CO・かばう・疑うを学習）
        BRAIN.parseClaim(R, human.name, data.text);
        R.discMsgs.push({ name:human.name, text:data.text });
        emit({ type:'disc_message', name:human.name, text:data.text });
        // 自分の順番のときだけ進める（フリー入力はターン外でも発言可）
        if (R.discOrder[R.discIdx] === human.name) {
          if (R._humanTurnTimer) { clearTimeout(R._humanTurnTimer); R._humanTurnTimer = null; }
          R.discIdx++;
          later(450, advanceDisc);
        }
        break;
      }
      case 'vote': {
        const al = alive();
        const human = R.players[0];
        const selected = byName(data.target);
        if (!human?.alive || !selected?.alive || selected.name === human.name) {
          emit({ type:'error', msg:'投票先を選び直してください' });
          break;
        }
        const applied = applySoloBrainwashVote(human.name, selected.name);
        R.votes[human.name] = applied.target;
        R.voteReasons[human.name] = (data.reason || '').trim() || (selected.name + 'さんの発言と投票の流れが気になりました。');
        if (applied.forced) emit({ type:'brainwashed_notice', forced_target:applied.target });
        R.humanVoted = true;
        const done = Object.keys(R.votes).length;
        emit({ type:'vote_progress', done, total:al.length });
        maybeTallySoloVotes(500);
        break;
      }
      case 'next_night':
        if (R.phase === 'vote' && O.phase === 'vote_result') R.phase = 'vote_result';
        later(300, beginNightFlow);
        break;
    }
  }

  return { init, handle, resetTimers };
})();

// ========== TEMPLATE DEFINITIONS ==========
const TPL = {
  neutral: [
    '様子を見ています 👀',
    '情報が少なくて判断できません 🤔',
