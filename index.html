// ========== P2P ENGINE (PeerJS サーバーレスオンライン) ==========
const P2PEngine = (() => {
  const CPU_NAMES = CHARACTER_AVATARS.map(a => a.label);
  const P2P_STALE_MS = 22000;
  const P2P_SOFT_DISCONNECT_MS = 42000;
  const P2P_CREATE_MAX_ATTEMPTS = 12;
  let peer = null;
  let guestConn = null;   // guest→host接続
  let hostConns = {};     // host: { connId: DataConnection }
  let connNames = {};     // host: { connId: playerName }
  let R = {};
  let isHost = false;

  let _timers = [];
  let heartbeatTimer = null;
  let joinAttemptId = 0;
  function emitLocal(msg) { const id = setTimeout(() => handleServer(msg), 0); _timers.push(id); return id; }
  function later(ms, fn)  { const id = setTimeout(fn, ms); _timers.push(id); return id; }
  function resetTimers()  {
    _timers.forEach(clearTimeout); _timers = [];
    heartbeatTimer = null;
    if (R && R._humanTurnTimer) { clearTimeout(R._humanTurnTimer); R._humanTurnTimer = null; }
    if (R && R._discFallback)   { clearTimeout(R._discFallback);   R._discFallback = null; }
  }
  function rand(a)        { return a[Math.floor(Math.random()*a.length)]; }
  function shuffle(a)     { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
  function randomRoomCode() { return String(Math.floor(Math.random() * 1000)).padStart(3, '0'); }
  function closePeerOnly() {
    if (peer) { try { peer.destroy(); } catch(e) {} peer = null; }
    guestConn = null;
    hostConns = {};
    connNames = {};
  }
  function alive()        { return (R.players || []).filter(p=>p.alive); }
  function byName(n)      { return (R.players || []).find(p=>p.name===n); }
  function topAcc(pls)    { let max=0,best=null; pls.forEach(p=>{const c=R.accuCount[p.name]||0;if(c>max){max=c;best=p;}}); return best; }
  function markPeerSeen(name, phase='', seenSeq=null) {
    if (!name) return;
    if (!R.peerLastSeen) R.peerLastSeen = {};
    const prev = R.peerLastSeen[name] || {};
    const seq = Number(seenSeq);
    R.peerLastSeen[name] = {
      at:Date.now(),
      phase:phase || prev.phase || '',
      seenSeq:Number.isFinite(seq) ? seq : (prev.seenSeq ?? null),
    };
    restoreSoftDisconnectedPeer(name);
  }
  function restoreSoftDisconnectedPeer(name) {
    if (!Array.isArray(R.players) || !R.players.length) return false;
    const player = byName(name);
    if (!player || !player.disconnected) return false;
    player.disconnected = false;
    player.disconnectedAt = null;
    if (R.phase === 'discuss' && R.voteReadySet && !R.voteReadyAll) R.voteReadySet.delete(name);
    R.log = R.log || [];
    R.log.push(`${name} returned before the P2P room closed the connection`);
    broadcast({ type:'player_reconnected', players:publicPlayers(false), name, soft:true });
    if (R.phase === 'discuss' && !R.voteReadyAll) broadcastVoteReadyP2P();
    sendResyncTo(name);
    return true;
  }
  function detectStalePeerDisconnects() {
    if (!isHost || !Array.isArray(R.players) || !R.players.length) return;
    const now = Date.now();
    R.players
      .filter(p => !p.isCpu && p.name !== R.hostName && !p.disconnected)
      .forEach(p => {
        const seen = R.peerLastSeen?.[p.name]?.at || 0;
        const age = seen ? now - seen : Number.POSITIVE_INFINITY;
        if (age > P2P_SOFT_DISCONNECT_MS) handleP2PDisconnect(p.name);
      });
  }
  function scheduleHeartbeat() {
    if (!isHost || !R || !R.phase) return;
    if (heartbeatTimer) clearTimeout(heartbeatTimer);
    heartbeatTimer = later(8000, () => {
      heartbeatTimer = null;
      if (!isHost || !R || !R.phase) return;
      const list = R.players || R.pendingPlayers || [];
      const aliveCount = R.players ? R.players.filter(p=>p.alive).length : 0;
      detectStalePeerDisconnects();
      broadcast({ type:'p2p_heartbeat', phase:R.phase, player_count:list.length, alive_count:aliveCount });
      scheduleHeartbeat();
    });
  }

  // ホストから全員にブロードキャスト
  function p2pPayload(msg) {
    if (!R.syncSeq) R.syncSeq = 0;
    return { ...msg, p2p_seq: ++R.syncSeq, p2p_time: Date.now() };
  }
  function broadcast(msg) {
    const payload = p2pPayload(msg);
    const json = JSON.stringify(payload);
    Object.values(hostConns).forEach(c => { try { c.send(json); } catch(e){} });
    emitLocal(payload);
  }
  // ホストから特定プレイヤーのみに送信
  function sendTo(playerName, msg) {
    const payload = p2pPayload(msg);
    const json = JSON.stringify(payload);
    const cid = Object.keys(connNames).find(k=>connNames[k]===playerName);
    if (cid && hostConns[cid]) { try { hostConns[cid].send(json); } catch(e){} }
    if (playerName === R.hostName) emitLocal(payload);
  }
  function sendToWolves(msg) {
    R.players.filter(p=>p.role==='WEREWOLF').forEach(p=>sendTo(p.name, msg));
  }
  function sendToConn(connId, msg) {
    const conn = hostConns[connId];
    if (conn) { try { conn.send(JSON.stringify(p2pPayload(msg))); } catch(e){} }
  }
  function publicPlayers(includeRole=false) {
    return (R.players || R.pendingPlayers || []).map((p,i)=>({
      pid:i, name:p.name, alive:p.alive !== false, isCpu:!!p.isCpu,
      avatarIndex:p.avatarIndex, avatarLabel:p.avatarLabel,
      disconnected:!!p.disconnected,
      disconnectedAt:p.disconnectedAt || null,
      role: includeRole ? p.role : undefined,
    }));
  }
  function publicAlive() {
    return alive().map(p=>({name:p.name,isCpu:!!p.isCpu,avatarIndex:p.avatarIndex,avatarLabel:p.avatarLabel,disconnected:!!p.disconnected,disconnectedAt:p.disconnectedAt||null}));
  }
  function voteReadyNames() {
    const ready = R.voteReadySet || new Set();
    return alive().filter(p=>!p.isCpu && !p.disconnected && ready.has(p.name)).map(p=>p.name);
  }
  function actionForPlayer(player) {
    if (!player || R.phase !== 'night' || !player.alive || player.isCpu || R.humanActionDone?.[player.name]) return null;
    const al = alive();
    const others = al.filter(x=>x.name!==player.name);
    if (player.role==='WEREWOLF') {
      return {type:'action_needed',action:'wolf',targets:others.filter(x=>x.role!=='WEREWOLF').map(x=>({name:x.name})),wolf_names:al.filter(x=>x.role==='WEREWOLF').map(x=>x.name)};
    }
    if (player.role==='SEER') {
      return {type:'action_needed',action:'seer',targets:others.map(x=>({name:x.name}))};
    }
    if (player.role==='DOCTOR') {
      const docTargets = al.filter(x=>x.name!==player.name && x.name!==R.lastDoctorTarget);
      return docTargets.length ? {type:'action_needed',action:'doctor',targets:docTargets.map(x=>({name:x.name})),last_protected:R.lastDoctorTarget} : null;
    }
    if (player.role==='MADMAN_ACTIVE') {
      const brainwashTargets = others.filter(x=>x.name!==R.lastBrainwashVoter);
      return brainwashTargets.length >= 2 ? {type:'action_needed',action:'brainwash',targets:brainwashTargets.map(x=>({name:x.name})),last_brainwashed:R.lastBrainwashVoter || null} : null;
    }
    return null;
  }
  function resyncPayloadFor(playerName) {
    const player = byName(playerName);
    const includeRole = R.phase === 'game_over';
    const voteResult = R.lastVoteResult || null;
    const voteIsFinal = !!(R.humanVotedSet && R.humanVotedSet.has(playerName) && !(R.autoVotes && R.autoVotes.has(playerName)));
    const payload = {
      type:'p2p_resync',
      phase:R.phase || 'lobby',
      roomCode:R.roomCode,
      day:R.day || 0,
      players:publicPlayers(includeRole),
      alive:publicAlive(),
      role:player?.role || null,
      wolf_partners:player?.role==='WEREWOLF' ? (R.players||[]).filter(p=>p.role==='WEREWOLF' && p.name!==playerName).map(p=>p.name) : [],
      shared_partners:player?.role==='SHARED' ? (R.players||[]).filter(p=>p.role==='SHARED' && p.name!==playerName).map(p=>p.name) : [],
      wolf_names:(R.players||[]).filter(p=>p.role==='WEREWOLF').map(p=>p.name),
      wolf_chat_ready:!!(R.wolfDoneSet && R.wolfDoneSet.has(playerName)),
      is_host:playerName===R.hostName,
      night_report:R.nightReport || null,
      eliminated:R.nightReport?.victim ? {name:R.nightReport.victim} : null,
      disc_msgs:R.discMsgs || [],
      pre_votes:R.preVotes || {},
      pre_vote_changes:R.preVoteChanges || {},
      disc_round:R.discRound || 1,
      disc_total_rounds:2,
      current_speaker:R.waitingForHuman || null,
      waiting_for:R.waitingForHuman || null,
      vote_ready_names:voteReadyNames(),
      vote_ready_total:p2pAliveHumans().length,
      vote_ready_all:!!R.voteReadyAll,
      vote_done:Object.keys(R.votes || {}).length,
      vote_total:alive().length,
      vote_submitted:voteIsFinal,
      vote_result:voteResult,
      winner:R.winner || null,
      log:R.log || [],
      action_needed:actionForPlayer(player),
      night_action_done:!!(R.humanActionDone && R.humanActionDone[playerName]),
    };
    return payload;
  }
  function sendResyncTo(playerName) {
    if (!playerName) return;
    sendTo(playerName, resyncPayloadFor(playerName));
  }
  function resyncAll() {
    (R.players || []).filter(p=>!p.isCpu).forEach(p=>sendResyncTo(p.name));
  }
  function maybeResyncLaggingPeer(playerName, seenSeq) {
    if (!playerName || !R.syncSeq) return;
    if (!Array.isArray(R.players) || !R.players.length) return;
    const seq = Number(seenSeq);
    if (!Number.isFinite(seq)) return;
    const lag = R.syncSeq - seq;
    if (lag < 4) return;
    if (!R.peerAutoResyncAt) R.peerAutoResyncAt = {};
    const now = Date.now();
    if (now - (R.peerAutoResyncAt[playerName] || 0) < 12000) return;
    R.peerAutoResyncAt[playerName] = now;
    sendResyncTo(playerName);
  }
  function dropPreviousConnForName(name, exceptConnId) {
    Object.keys(connNames).forEach(cid => {
      if (cid === exceptConnId || connNames[cid] !== name) return;
      const old = hostConns[cid];
      delete connNames[cid];
      delete hostConns[cid];
      try { old?.close?.(); } catch(e) {}
    });
  }
  function applyP2PBrainwashVote(voterName, intendedTarget) {
    const effect = R.brainwash;
    const voter = byName(voterName);
    const forcedTarget = effect ? byName(effect.target) : null;
    if (!effect || effect.voter !== voterName || !voter?.alive || !forcedTarget?.alive || forcedTarget.name === voterName)
      return { target:intendedTarget, forced:false };
    R.brainwashApplied = true;
    R.brainwashDetail = {
      day: R.day,
      actor: effect.actor || '',
      voter: voterName,
      intendedTarget,
      forcedTarget: forcedTarget.name,
      changed: intendedTarget !== forcedTarget.name,
    };
    return { target:forcedTarget.name, forced:true };
  }
  function autoVoteForDisconnected(name) {
    const voter = byName(name);
    if (!voter || !voter.alive || voter.isCpu || R.phase !== 'vote') return;
    if (!R.votes) R.votes = {};
    if (!R.voteReasons) R.voteReasons = {};
    if (!R.humanVotedSet) R.humanVotedSet = new Set();
    if (!R.autoVotes) R.autoVotes = new Set();
    const targets = alive().filter(p=>p.name!==name);
    if (!targets.length) return;
    if (!R.votes[name]) {
      const target = topAcc(targets) || rand(targets);
      const applied = applyP2PBrainwashVote(name, target.name);
      R.votes[name] = applied.target;
      R.voteReasons[name] = '通信切断中のため、ゲーム停止防止の仮投票です。再接続すれば投票確定前に上書きできます。';
    }
    R.autoVotes.add(name);
    R.humanVotedSet.add(name);
  }
  function maybeTallyVotesP2P(delay=500) {
    if (R.phase !== 'vote' || R.tallyDone) return;
    const al = alive();
    const humansAlive = al.filter(p=>!p.isCpu);
    if (R.humanVotedSet && R.humanVotedSet.size>=humansAlive.length && Object.keys(R.votes||{}).length>=al.length)
      later(delay, tallyVotes);
  }
  function reconnectPlayer(connId, name) {
    const player = byName(name);
    if (!player || player.isCpu) return false;
    dropPreviousConnForName(name, connId);
    connNames[connId] = name;
    player.disconnected = false;
    player.disconnectedAt = null;
    markPeerSeen(name, R.phase || '', null);
    if (R.phase === 'discuss' && R.voteReadySet && !R.voteReadyAll) R.voteReadySet.delete(name);
    R.log = R.log || [];
    R.log.push(`${name} reconnected to the P2P room`);
    broadcast({ type:'player_reconnected', players:publicPlayers(false), name });
    if (R.phase === 'discuss' && !R.voteReadyAll) broadcastVoteReadyP2P();
    sendResyncTo(name);
    return true;
  }
  function beginNightFlow() {
    if (!['role', 'vote_result'].includes(R.phase)) return false;
    alive().some(p=>p.role==='WEREWOLF'&&!p.isCpu) ? startWolfChat() : startNight();
    return true;
  }
  function handleP2PDisconnect(name) {
    if (!name) return;
    if (R.pendingPlayers) R.pendingPlayers = R.pendingPlayers.filter(p=>p.name!==name);
    const inGame = Array.isArray(R.players) && R.players.length > 0;
    if (!inGame) {
      if (R.peerLastSeen) delete R.peerLastSeen[name];
      O.players = (O.players||[]).filter(p=>p.name!==name);
      broadcast({ type:'player_left', players: O.players, name, cpu_count: O.cpuCount || 0 });
      return;
    }
    const player = byName(name);
    if (player) {
      player.disconnected = true;
      player.disconnectedAt = Date.now();
      R.log = R.log || [];
      R.log.push(`${name} disconnected from the P2P room`);
    }
    broadcast({ type:'player_left', players:publicPlayers(false), name, disconnected:true });
    if (R.phase === 'night') {
      R.humanActionDone[name] = true;
      checkNightDone();
    } else if (R.phase === 'wolf_chat') {
      if (!R.wolfDoneSet) R.wolfDoneSet = new Set();
      R.wolfDoneSet.add(name);
      const humanWolves = alive().filter(p=>p.role==='WEREWOLF'&&!p.isCpu).map(p=>p.name);
      if (humanWolves.every(n=>R.wolfDoneSet.has(n))) later(400, startNight);
    } else if (R.phase === 'discuss') {
      if (R.voteReadySet) R.voteReadySet.add(name);
      if (R.waitingForHuman === name) {
        R.waitingForHuman = null;
        if (R._humanTurnTimer) { clearTimeout(R._humanTurnTimer); R._humanTurnTimer = null; }
        later(200, advanceDisc);
      }
      markP2PCpuReady();
      broadcastVoteReadyP2P();
      _checkVoteReadyP2P();
    } else if (R.phase === 'vote') {
      autoVoteForDisconnected(name);
      const al = alive();
      broadcast({type:'vote_progress',done:Object.keys(R.votes||{}).length,total:al.length});
      maybeTallyVotesP2P(500);
    }
  }

  // ── ホスト: 部屋作成 ──────────────────────────────────
  function createRoom(hostName, onCode, onError=null, attempt=1) {
    const notifyError = (err) => {
      const normalized = err instanceof Error ? err : new Error(err?.message || String(err || 'P2P room creation failed'));
      if (typeof onError === 'function') onError(normalized);
      else alert('P2P接続エラー: ' + normalized.message);
    };
    if (typeof Peer === 'undefined') {
      notifyError(new Error('P2P機能の読み込みに失敗しました。インターネット接続を確認するか、ソロデモ/ローカルモードで遊んでください。'));
      return;
    }
    if (attempt <= 1) {
      destroy();
      isHost = true;
      R.hostName = hostName;
      R.pendingPlayers = [{ name: hostName, isCpu: false }];
      R.phase = 'lobby';
      R.peerLastSeen = {};
      R.syncSeq = 0;
      scheduleHeartbeat();
    } else {
      closePeerOnly();
      isHost = true;
    }
    const code = randomRoomCode();
    R.roomCode = code;
    const pid  = 'WLF' + code;
    if (typeof O === 'object') {
      O.roomCode = code;
      O.p2pCreateAttempt = attempt;
      try { render(); } catch(e) {}
    }
    let createdPeer = null;
    try {
      createdPeer = new Peer(pid, { debug: 0 });
      peer = createdPeer;
    } catch (err) {
      destroy();
      notifyError(new Error('P2P部屋の作成に失敗しました: ' + (err?.message || err)));
      return;
    }
    createdPeer.on('open', id => {
      if (peer !== createdPeer) return;
      const openedId = String(id || pid);
      const roomCode = openedId.startsWith('WLF') ? openedId.slice(3, 6) : normalizeRoomCode(openedId);
      R.roomCode = roomCode;
      if (typeof onCode === 'function') onCode(roomCode);
    });
    createdPeer.on('connection', conn => {
      if (peer !== createdPeer) return;
      conn.on('open', () => {
        if (peer !== createdPeer) return;
        hostConns[conn.peer] = conn;
        conn.on('data', raw => {
          try { handleGuestMsg(conn.peer, JSON.parse(raw)); } catch(e){}
        });
        conn.on('close', () => {
          const name = connNames[conn.peer];
          delete hostConns[conn.peer];
          delete connNames[conn.peer];
          handleP2PDisconnect(name);
        });
      });
    });
    createdPeer.on('error', err => {
      if (peer !== createdPeer) return;
      if (err?.type === 'unavailable-id') {
        try { createdPeer.destroy(); } catch(e) {}
        if (peer === createdPeer) peer = null;
        if (attempt < P2P_CREATE_MAX_ATTEMPTS) {
          createRoom(hostName, onCode, onError, attempt + 1);
          return;
        }
        destroy();
        notifyError(new Error('3桁の部屋コードが混雑しています。少し待ってからもう一度作成してください。'));
        return;
      }
      destroy();
      notifyError(new Error('P2P接続エラー: ' + (err?.message || err)));
    });
  }

  // ── ゲスト: 部屋参加 ─────────────────────────────────
  function joinRoom(guestName, code, onJoined, onError) {
    if (typeof Peer === 'undefined') {
      onError(new Error('P2P機能の読み込みに失敗しました。インターネット接続を確認してください。'));
      return;
    }
    const roomCode = normalizeRoomCode(code);
    if (!roomCode) { onError(new Error('room code is empty')); return; }
    destroy();
    const attemptId = ++joinAttemptId;
    isHost = false;
    let currentPeer = null;
    try {
      currentPeer = new Peer({ debug: 0 });
      peer = currentPeer;
    } catch (err) {
      onError(new Error('P2P接続の準備に失敗しました: ' + (err?.message || err)));
      return;
    }
    let settled = false;
    let connectTimer = null;
    const isCurrentAttempt = () => attemptId === joinAttemptId && peer === currentPeer;
    const fail = (err) => {
      if (settled || !isCurrentAttempt()) return;
      settled = true;
      if (connectTimer) { clearTimeout(connectTimer); connectTimer = null; }
      try { if (guestConn) guestConn.close(); } catch (_) {}
      try { if (peer) peer.destroy(); } catch (_) {}
      onError(err instanceof Error ? err : new Error(err?.message || 'P2P connection failed'));
    };
    currentPeer.on('open', () => {
      if (!isCurrentAttempt()) return;
      guestConn = peer.connect('WLF' + roomCode, { reliable: true });
      connectTimer = later(15000, () => {
        fail(new Error('ホストが見つかりません。部屋コード・ホスト画面・通信環境を確認してください。'));
      });
      guestConn.on('open', () => {
        if (settled || !isCurrentAttempt()) return;
        settled = true;
        if (connectTimer) { clearTimeout(connectTimer); connectTimer = null; }
        guestConn.on('data', raw => {
          try { handleServer(JSON.parse(raw)); } catch(e){}
        });
        guestConn.send(JSON.stringify({ type:'join_room', name: guestName }));
        onJoined();
      });
      guestConn.on('error', fail);
      guestConn.on('close', () => {
        if (!isCurrentAttempt()) return;
        if (!settled) fail(new Error('ホストとの接続が閉じられました。'));
        else {
          O.p2pConnClosedAt = Date.now();
          O.p2pAutoResyncReason = 'connection_closed';
          try { render(); } catch(e) {}
        }
      });
    });
    currentPeer.on('error', fail);
  }

  // ── ゲストからのメッセージをホストが処理 ─────────────
  function handleGuestMsg(connId, data) {
    // '__host__' はホスト自身が送ったメッセージ
    const pname = (connId === '__host__') ? R.hostName : connNames[connId];
    if (pname && connId !== '__host__' && data.type !== 'join_room') markPeerSeen(pname, data.phase || '', data.seen_seq);
    switch (data.type) {
      case 'join_room': {
        const name = (data.name||'ゲスト').trim();
        connNames[connId] = name;
        R.pendingPlayers = R.pendingPlayers||[];
        if (R.phase && R.phase !== 'lobby') {
          if (reconnectPlayer(connId, name)) return;
          delete connNames[connId];
          sendToConn(connId, {type:'error', msg:'game already started', fatal:true});
          return;
        }
        if (!name || R.pendingPlayers.some(p=>p.name===name)) {
          delete connNames[connId];
          sendToConn(connId, {type:'error', msg:'duplicate player name', fatal:true});
          return;
        }
        if (R.pendingPlayers.length >= MAX_PLAYERS) {
          delete connNames[connId];
          sendToConn(connId, {type:'error', msg:'room is full', fatal:true});
          return;
        }
        R.pendingPlayers.push({ name, isCpu: false });
        O.cpuCount = Math.max(0, Math.min(O.cpuCount || 0, MAX_PLAYERS - R.pendingPlayers.length));
        markPeerSeen(name, 'lobby');
        O.players = O.players || [];
        O.players.push({ pid: O.players.length, name });
        sendToConn(connId, { type:'room_joined', code:R.roomCode, pid:connId, is_host:false, players:O.players, cpu_count:O.cpuCount || 0 });
        broadcast({ type:'player_joined', players: O.players, cpu_count:O.cpuCount || 0 });
        break;
      }
      case 'heartbeat_ack':
        markPeerSeen(pname, data.phase || '', data.seen_seq);
        maybeResyncLaggingPeer(pname, data.seen_seq);
        break;
      case 'set_cpu_count':
        if (connId !== '__host__' || (R.phase && R.phase !== 'lobby')) break;
        {
          const humans = (R.pendingPlayers||[]).length;
          const maxCpu = Math.max(0, MAX_PLAYERS - humans);
          const requested = Number.parseInt(data.count, 10);
          O.cpuCount = Math.max(0, Math.min(maxCpu, Number.isFinite(requested) ? requested : 0));
          broadcast({ type:'cpu_count_updated', count: O.cpuCount });
        }
        break;
      case 'start_game':
        if (connId !== '__host__' || (R.phase && R.phase !== 'lobby')) break;
        startGame();
        break;
      case 'start_night':
        if (connId !== '__host__') break;
        beginNightFlow();
        break;
      case 'wolf_chat_done':
        if (R.phase !== 'wolf_chat' || !pname) {
          if (pname) { pushP2PEvent('wolf_ready_invalid', `${pname} / phase:${R.phase || '-'}`); sendResyncTo(pname); }
          break;
        }
        pushP2PEvent('wolf_ready_received', pname);
        if (!R.wolfDoneSet) R.wolfDoneSet = new Set();
        R.wolfDoneSet.add(pname);
        sendTo(pname, {type:'wolf_chat_ready_ack'});
        {
          const humanWolves = alive().filter(p=>p.role==='WEREWOLF'&&!p.isCpu).map(p=>p.name);
          if (humanWolves.every(n=>R.wolfDoneSet.has(n))) later(400, startNight);
        }
        break;
      case 'wolf_chat_msg':
        if (pname) sendToWolves({ type:'wolf_chat_msg', name:pname, text:data.text });
        break;
      case 'night_action':
        if (pname) {
          pushP2PEvent('night_action_received', `${pname}/${data.action || ''}`);
          handleNightAction(pname, data);
        }
        break;
      case 'disc_message':
        if (pname) handleDiscMsg(pname, data.text);
        break;
      case 'pre_vote':
        if (pname) handlePreVote(pname, data.target);
        break;
      case 'vote':
        if (pname) {
          pushP2PEvent('vote_received', `${pname} -> ${data.target || ''}`);
          handleVote(pname, data.target, data.reason);
        }
        break;
      case 'resync_request':
        if (pname) {
          pushP2PEvent('resync_request', pname);
          sendResyncTo(pname);
        }
        break;
      case 'music_ended':
        if (connId === '__host__' && R.phase === 'discuss') { R.phase = 'voting'; later(300, startVote); }
        break;
      case 'vote_ready':
        if (!isHost || R.phase !== 'discuss' || !pname) {
          if (pname) { pushP2PEvent('vote_ready_invalid', `${pname || '-'} / phase:${R.phase || '-'}`); sendResyncTo(pname); }
          break;
        }
        if (!alive().some(p=>p.name===pname && !p.isCpu)) {
          pushP2PEvent('vote_ready_invalid', `${pname} / not alive`);
          sendResyncTo(pname);
          break;
        }
        pushP2PEvent('vote_ready_received', pname);
        if (!R.voteReadySet) R.voteReadySet = new Set();
        R.voteReadySet.add(pname);
        sendTo(pname, {type:'vote_ready_ack'});
        markP2PCpuReady();
        broadcastVoteReadyP2P();
        _checkVoteReadyP2P();
        break;
      case 'next_night':
        if (connId !== '__host__') break;
        later(300, beginNightFlow);
        break;
    }
  }

  // ── ゲームスタート ───────────────────────────────────
  function startGame() {
    resetTimers(); // 前ゲームのタイマーを掃除
    const humanPlayers = R.pendingPlayers || [{ name: R.hostName, isCpu: false }];
    const cpuCount = Math.max(0, Math.min(O.cpuCount || 0, MAX_PLAYERS - humanPlayers.length));
    O.cpuCount = cpuCount;
    const cpuPool = shuffle(CPU_NAMES.filter(n=>!humanPlayers.find(p=>p.name===n)));
    const allPlayers = [...humanPlayers];
    for (let i=0; i<cpuCount; i++)
      allPlayers.push({ name: cpuPool[i]||`CPU${i+1}`, isCpu: true });

    const total = allPlayers.length;
    if (total < 4 || total > MAX_PLAYERS || !CONFIGS[total]) {
      alert(`ゲーム人数は4〜${MAX_PLAYERS}人にしてください`);
      return;
    }
    const roles = shuffle([...CONFIGS[total]]);
    R = {
      ...R,
      players: allPlayers.map((p,i)=>({...p, role:roles[i], alive:true})),
      day:0, phase:'role',
      wolfTarget:null, doctorTarget:null, brainwash:null, brainwashApplied:false, brainwashDetail:null, brainwashHistory:[], lastBrainwashVoter:null,
      lastDoctorTarget:null, lastExecuted:null, lastExecutedRole:null,
      nightReport:null,
      humanActionDone:{}, cpuNightDone:false,
      humanWolfChoice:null, resolveDone:false,
      wolfDoneSet:new Set(),
      discMsgs:[], discOrder:[], discIdx:0, discRound:1,
      preVotes:{}, preVoteChanges:{},
      waitingForHuman: null, _discFallback: null,
      votes:{}, voteReasons:{}, humanVotedSet:new Set(), autoVotes:new Set(), tallyDone:false,
      accuCount:{}, seerKnown:{}, log:[], syncSeq:0, peerLastSeen:R.peerLastSeen || {},
    };
    scheduleHeartbeat();
    assignOnlineAvatars(R.players);
    BRAIN.initR(R); // BRAIN メモリ初期化
    // CPUにパーソナリティをランダム付与
    R.players.forEach(p => { if (p.isCpu) applyCpuPersona(p); });

    // 各プレイヤーに役職送信
    R.players.forEach(player => {
      if (player.isCpu) return;
      const wolves = R.players.filter(p=>p.role==='WEREWOLF');
      const partners = player.role==='WEREWOLF' ? wolves.filter(p=>p!==player).map(p=>p.name) : [];
      const sharedPartners = player.role==='SHARED' ? R.players.filter(p=>p.role==='SHARED' && p!==player).map(p=>p.name) : [];
      const isH = player.name === R.hostName;
      const msg = {
        type:'game_started', role:player.role, wolf_partners:partners, shared_partners:sharedPartners,
        players:R.players.map((p,i)=>({pid:i,name:p.name,isCpu:!!p.isCpu,avatarIndex:p.avatarIndex,avatarLabel:p.avatarLabel})), is_host:isH,
      };
      sendTo(player.name, msg);
    });
  }

  // ── 夜 ──────────────────────────────────────────────
  function startWolfChat() {
    R.phase='wolf_chat';
    R.wolfDoneSet = new Set();
    BRAIN.initR(R);
    const wolves = alive().filter(p=>p.role==='WEREWOLF');
    wolves.filter(p=>!p.isCpu && p.disconnected).forEach(p=>R.wolfDoneSet.add(p.name));
    sendToWolves({ type:'wolf_chat_start', wolf_names:wolves.map(p=>p.name) });
    const cpuWolves = wolves.filter(p=>p.isCpu);
    const vill = alive().filter(p=>p.role!=='WEREWOLF');
    if (cpuWolves.length && vill.length) {
      const tgt = BRAIN.wolfNightTarget(R) || topAcc(vill) || rand(vill);
      let t = 1000;
      cpuWolves.forEach(w => {
        later(t, ()=>sendToWolves({type:'wolf_chat_msg',name:w.name,text:personagizeWolfNight(w,tgt.name)}));
        t += 1400 + Math.floor(Math.random()*600);
      });
    }
    const humanWolves = wolves.filter(p=>!p.isCpu).map(p=>p.name);
    if (!humanWolves.length || humanWolves.every(n=>R.wolfDoneSet.has(n))) {
      later(cpuWolves.length ? 2600 : 700, startNight);
    }
  }

  function startNight() {
    R.day++; R.phase='night';
    R.wolfTarget=null; R.doctorTarget=null; R.brainwash=null; R.brainwashApplied=false;
    R.humanActionDone={}; R.cpuNightDone=false;
    R.humanWolfChoice=null; R.resolveDone=false;
    const al = alive();
    broadcast({ type:'night_start', day:R.day });
    // 霊媒師に処刑情報を送信（処刑があった場合）
    if (R.lastExecuted) {
      const mediums = al.filter(p=>!p.isCpu&&p.role==='MEDIUM');
      mediums.forEach(m=>sendTo(m.name,{type:'medium_reveal',target:R.lastExecuted,role:R.lastExecutedRole}));
    }
    // 各役職プレイヤーにアクション要求
    al.forEach(p => {
      if (p.isCpu) return;
      if (p.disconnected) { R.humanActionDone[p.name] = true; return; }
      const others = al.filter(x=>x!==p);
      // 初日から全役職が行動可能
      if (p.role==='WEREWOLF') {
        const wnames = al.filter(x=>x.role==='WEREWOLF').map(x=>x.name);
        sendTo(p.name,{type:'action_needed',action:'wolf',targets:others.filter(x=>x.role!=='WEREWOLF').map(x=>({name:x.name})),wolf_names:wnames});
      } else if (p.role==='SEER') {
        sendTo(p.name,{type:'action_needed',action:'seer',targets:others.map(x=>({name:x.name}))});
      } else if (p.role==='DOCTOR') {
        const docTargets = al.filter(x=>x.name!==p.name && x.name!==R.lastDoctorTarget);
        if (docTargets.length) {
          sendTo(p.name,{type:'action_needed',action:'doctor',targets:docTargets.map(x=>({name:x.name})),last_protected:R.lastDoctorTarget});
        } else {
          R.humanActionDone[p.name] = true;
        }
      } else if (p.role==='MADMAN_ACTIVE') {
        const brainwashTargets = others.filter(x=>x.name!==R.lastBrainwashVoter);
        if (brainwashTargets.length >= 2) sendTo(p.name,{type:'action_needed',action:'brainwash',targets:brainwashTargets.map(x=>({name:x.name})),last_brainwashed:R.lastBrainwashVoter || null});
        else R.humanActionDone[p.name] = true;
      } else {
        R.humanActionDone[p.name] = true;
      }
    });
    later(1600, () => {
      doCpuNight(); R.cpuNightDone=true;
      checkNightDone();
    });
  }

  function doCpuNight() {
    BRAIN.initR(R);
    const al = alive();
    // 占い師CPU（毎夜）: 怪しい人・役職CO・発言の薄い人を積極的に占う
    const cpuSeer = al.find(p=>p.isCpu&&p.role==='SEER');
    if (cpuSeer) {
      const t = BRAIN.chooseSeerNightTarget(R, cpuSeer, al);
      if (t) R.seerKnown[t.name]=(t.role==='WEREWOLF');
    }
    // 人狼CPU標的（BRAIN 戦略）
    const cpuWolves = al.filter(p=>p.isCpu&&p.role==='WEREWOLF');
    const vill = al.filter(p=>p.role!=='WEREWOLF');
    if (cpuWolves.length && vill.length) {
      const tgt = BRAIN.wolfNightTarget(R) || topAcc(vill) || rand(vill);
      if (tgt) R.wolfTarget = tgt.name;
    }
    // 能動型狂人CPU: 公開情報を基に一票を操作する
    const cpuMadman = al.find(p=>p.isCpu&&p.role==='MADMAN_ACTIVE');
    if (cpuMadman) {
      const brainwashPool = al.filter(p=>p.name!==cpuMadman.name && p.name!==R.lastBrainwashVoter);
      const plan = BRAIN.chooseBrainwashTargets(R, cpuMadman, brainwashPool);
      if (plan) { R.brainwash = { voter:plan.voter.name, target:plan.target.name, day:R.day, actor:cpuMadman.name }; R.lastBrainwashVoter = plan.voter.name; }
    }
    // 騎士CPU: 自衛・連続護衛を避け、役職COした情報源を優先して守る
    const cpuDoc = al.find(p=>p.isCpu&&p.role==='DOCTOR');
    if (cpuDoc) {
      const t = BRAIN.chooseDoctorGuardTarget(R, cpuDoc, al);
      if (t) R.doctorTarget = t.name;
    }
  }

  function handleNightAction(pname, data) {
    const player = byName(pname);
    if (R.phase !== 'night' || !player || !player.alive) {
      pushP2PEvent('night_action_invalid', `${pname} / phase:${R.phase || '-'}`);
      sendResyncTo(pname);
      return;
    }
    if (R.humanActionDone[pname]) {
      pushP2PEvent('night_action_invalid', `${pname} / duplicate`);
      sendTo(pname,{type:'action_ack'});
      sendResyncTo(pname);
      return;
    }
    let doneNames = [pname];
    if (player.role==='WEREWOLF') {
      const tgt=byName(data.target);
      if (!tgt || !tgt.alive || tgt.role==='WEREWOLF') {
        sendTo(pname,{type:'error',msg:'invalid wolf target'});
        sendResyncTo(pname);
        return;
      }
      doneNames = alive().filter(p=>p.role==='WEREWOLF'&&!p.isCpu).map(p=>p.name);
      R.humanWolfChoice=data.target;
      sendToWolves({type:'wolf_chosen',target:data.target});
      sendTo(pname,{type:'action_ack'});
      pushP2PEvent('action_ack', `${pname}/wolf`);
    } else if (player.role==='SEER') {
      const tgt=byName(data.target);
      if (!tgt || !tgt.alive || tgt.name===player.name) {
        sendTo(pname,{type:'error',msg:'占える相手を選び直してください'});
        sendResyncTo(pname);
        return;
      }
      const iw=tgt?tgt.role==='WEREWOLF':false;
      R.seerKnown[data.target]=iw;
      sendTo(pname,{type:'seer_result',target:data.target,is_wolf:iw});
      pushP2PEvent('action_ack', `${pname}/seer`);
    } else if (player.role==='DOCTOR') {
      const tgt=byName(data.target);
      if (!tgt || !tgt.alive || tgt.name===player.name) {
        sendTo(pname,{type:'error',msg:'騎士は自分自身を護衛できません'});
        sendResyncTo(pname);
        return;
      }
      if (tgt.name===R.lastDoctorTarget) {
        sendTo(pname,{type:'error',msg:'同じ人を2夜連続で護衛することはできません'});
        sendResyncTo(pname);
        return;
      }
      R.doctorTarget=data.target;
      sendTo(pname,{type:'action_ack'});
      pushP2PEvent('action_ack', `${pname}/doctor`);
    } else if (player.role==='MADMAN_ACTIVE') {
      const voter=byName(data.target);
      const forcedTarget=byName(data.vote_target);
      if (!voter || !forcedTarget || !voter.alive || !forcedTarget.alive || voter.name===player.name || forcedTarget.name===player.name || voter.name===forcedTarget.name || voter.name===R.lastBrainwashVoter) {
        sendTo(pname,{type:'error',msg:'洗脳する人と強制する投票先を別々に選んでください'});
        sendResyncTo(pname);
        return;
      }
      R.brainwash={voter:voter.name,target:forcedTarget.name,day:R.day,actor:player.name};
      R.lastBrainwashVoter=voter.name;
      sendTo(pname,{type:'action_ack',action:'brainwash'});
      pushP2PEvent('action_ack', `${pname}/brainwash`);
    }
    doneNames.forEach(n => { R.humanActionDone[n]=true; });
    checkNightDone();
  }

  function checkNightDone() {
    const al=alive();
    const humans=al.filter(p=>!p.isCpu);
    const allDone=humans.every(p=>R.humanActionDone[p.name]);
    if (allDone&&R.cpuNightDone) later(700,resolveNight);
  }

  function resolveNight() {
    if (R.resolveDone) return; R.resolveDone=true;
    const wt=R.humanWolfChoice||R.wolfTarget;
    const dt=R.doctorTarget;
    R.nightReport={day:R.day,target:wt||null,protected:dt||null,guarded:false,victim:null,dragged:null};
    // 騎士護衛対象を次夜用に記録（連続護衛禁止）
    R.lastDoctorTarget=dt;
    R.wolfTarget=null; R.doctorTarget=null; R.humanWolfChoice=null;
    let victim=null;
    if (wt&&wt!==dt) {
        const v=byName(wt);
        if(v&&v.alive){
          v.alive=false; victim=v;
          R.nightReport.victim=v.name;
          R.log.push(`第${R.day}夜:${wt}が人狼に倒された`);
          // 猫又ルール
          if (v.role==='NEKOMATA') {
            const wolves=alive().filter(x=>x.role==='WEREWOLF');
            if(wolves.length){const dragged=rand(wolves);dragged.alive=false;R.nightReport.dragged=dragged.name;R.log.push(`第${R.day}夜:猫又道連れで${dragged.name}も倒れた`);}
          }
        }
    } else if (wt&&wt===dt) { R.nightReport.guarded=true; R.log.push(`第${R.day}夜:騎士が${wt}を護衛した`); }
    const win=checkWinP2P();
    if (win) { doGameOver(win,victim); return; }
    later(400,()=>startDiscuss(victim));
  }

  // ── 議論 ────────────────────────────────────────────
  function p2pAliveHumans() {
    return alive().filter(p=>!p.isCpu && !p.disconnected);
  }

  function markP2PDisconnectedReady() {
    if (!R.voteReadySet) R.voteReadySet = new Set();
    alive().filter(p=>!p.isCpu && p.disconnected).forEach(p=>R.voteReadySet.add(p.name));
  }

  function markP2PCpuReady() {
    if (!R.voteReadySet) R.voteReadySet = new Set();
    alive().filter(p=>p.isCpu).forEach(p=>R.voteReadySet.add(p.name));
  }

  function broadcastVoteReadyP2P() {
    if (!R.voteReadySet) R.voteReadySet = new Set();
    markP2PDisconnectedReady();
    const humans = p2pAliveHumans();
    const readyNames = humans.filter(p=>R.voteReadySet.has(p.name)).map(p=>p.name);
    broadcast({ type:'vote_ready_upd', readyNames, readyTotal:humans.length });
  }

  function _checkVoteReadyP2P() {
    if (R.phase !== 'discuss') return;
    if (R.voteReadyAll) return;
    markP2PDisconnectedReady();
    markP2PCpuReady();
    const humans = p2pAliveHumans();
    if (!humans.length || humans.every(p => R.voteReadySet.has(p.name))) {
      R.voteReadyAll = true;
      if (R._discFallback) { clearTimeout(R._discFallback); R._discFallback = null; }
      broadcast({ type:'vote_ready_all' });
      later(1900, () => { if (R.phase === 'discuss') { R.phase='voting'; startVote(); } });
    }
  }

  function startDiscuss(victim) {
    R.phase='discuss'; R.discRound=1; R.discMsgs=[];
    R.preVotes={}; R.preVoteChanges={};
    R.waitingForHuman=null;
    R.voteReadySet = new Set();
    R.voteReadyAll = false;
    const elim=victim?{name:victim.name}:null;
    const al=alive();
    const song = _pickSong();
    const songStarted = Date.now() + 650;
    markP2PDisconnectedReady();
    if (R._discFallback) clearTimeout(R._discFallback);
    R._discFallback = setTimeout(()=>{ if(R.phase==='discuss'){R.phase='voting';startVote();} }, 5*60*1000);
    broadcast({type:'discuss_start',round:1,total_rounds:2,eliminated:elim,night_report:R.nightReport,alive:al.map(p=>({name:p.name,isCpu:!!p.isCpu,avatarIndex:p.avatarIndex,avatarLabel:p.avatarLabel,disconnected:!!p.disconnected,disconnectedAt:p.disconnectedAt||null})),readyTotal:p2pAliveHumans().length,pre_votes:R.preVotes,pre_vote_changes:R.preVoteChanges,song,songStarted});
    R.discOrder=shuffle([...al]);
    R.discIdx=0;
    later(600,advanceDisc);
  }

  function advanceDisc() {
    if (R.phase !== 'discuss') return;
    if (R.discIdx >= R.discOrder.length) {
      if (R.discRound < 2) {
        R.discRound = 2; R.discIdx = 0;
        broadcast({ type:'disc_new_round', round:2 });
        later(700, advanceDisc);
      } else {
        // 2ラウンド完了: 全CPUを自動レディ
        const cpuPlayers = alive().filter(p=>p.isCpu);
        if (!cpuPlayers.length) {
          markP2PDisconnectedReady();
          broadcastVoteReadyP2P();
          _checkVoteReadyP2P();
          return;
        }
        cpuPlayers.forEach((p,i) => {
          later(600 + i*350, () => {
            if (R.phase !== 'discuss') return;
            markP2PCpuReady();
            broadcastVoteReadyP2P();
            _checkVoteReadyP2P();
          });
        });
      }
      return;
    }
    const player = R.discOrder[R.discIdx];
    if (!player || !player.alive) { R.discIdx++; later(300, advanceDisc); return; }
    if (!player.isCpu && player.disconnected) {
      if (!R.voteReadySet) R.voteReadySet = new Set();
      R.voteReadySet.add(player.name);
      R.discIdx++;
      later(200, advanceDisc);
      return;
    }
    if (player.isCpu) {
      broadcast({ type:'disc_turn', name:player.name });
      later(typingDelay(player.personality), () => {
        if (R.phase !== 'discuss') return;
        const txt = BRAIN.speak(R, player);
        BRAIN.parseClaim(R, player.name, txt);
        R.discMsgs.push({ name:player.name, text:txt });
        broadcast({ type:'disc_message', name:player.name, text:txt });
        publishP2PPreVote(player);
        R.discIdx++;
        later(readPause(txt), advanceDisc); // テキスト長に比例した読む時間を確保
      });
    } else {
      broadcast({ type:'disc_turn', name:player.name });
      sendTo(player.name, { type:'your_disc_turn' });
      R.waitingForHuman = player.name;
      R.discIdx++;
      // 30秒経っても発言しなければ自動進行（音楽なし環境対策）
      if (R._humanTurnTimer) clearTimeout(R._humanTurnTimer);
      R._humanTurnTimer = setTimeout(() => {
        if (R.phase !== 'discuss' || R.waitingForHuman !== player.name) return;
        R.waitingForHuman = null;
        later(200, advanceDisc);
      }, 30 * 1000);
    }
  }

  function handleDiscMsg(pname, text) {
    if (R.phase !== 'discuss') return;
    const speaker = (R.players || []).find(p => p.name === pname);
    if (!speaker || !speaker.alive || speaker.isCpu) {
      pushP2PEvent('disc_message_invalid', `${pname || '-'} / dead-or-invalid`);
      if (pname) {
        sendTo(pname, { type:'error', msg:'死亡者は議論に発言できません' });
        sendResyncTo(pname);
      }
      return;
    }
    BRAIN.parseClaim(R, pname, text); // 人間発言から CO・かばう・疑うを学習
    R.discMsgs.push({ name:pname, text });
    broadcast({ type:'disc_message', name:pname, text });
    // 順番が来ていたプレイヤーの発言なら次へ進む（フリー入力はターン外でも発言可）
    if (R.waitingForHuman === pname) {
      R.waitingForHuman = null;
      if (R._humanTurnTimer) { clearTimeout(R._humanTurnTimer); R._humanTurnTimer = null; }
      later(600, advanceDisc);
    }
  }

  function broadcastPreVoteUpdate() {
    broadcast({ type:'pre_vote_update', pre_votes:{...(R.preVotes || {})}, pre_vote_changes:{...(R.preVoteChanges || {})} });
  }

  function publishP2PPreVote(cpu) {
    if (!cpu || !cpu.alive || !cpu.isCpu || R.phase !== 'discuss' || R.discRound !== 1) return;
    if (!R.preVotes) R.preVotes = {};
    if (R.preVotes[cpu.name]) return;
    const target = BRAIN.vote(R, cpu);
    if (!target) return;
    R.preVotes[cpu.name] = target.name;
    broadcastPreVoteUpdate();
  }

  function handlePreVote(pname, targetName) {
    const voter = byName(pname);
    const target = byName(targetName);
    const valid = R.phase === 'discuss' && voter && voter.alive && !voter.isCpu && target && target.alive && target.name !== pname;
    if (!valid) {
      pushP2PEvent('pre_vote_invalid', `${pname || '-'} -> ${targetName || '-'}`);
      if (pname) {
        sendTo(pname, { type:'error', msg:'仮投票先は現在の生存者から選んでください。' });
        sendResyncTo(pname);
      }
      return;
    }
    if (!R.preVotes) R.preVotes = {};
    if (!R.preVoteChanges) R.preVoteChanges = {};
    const current = R.preVotes[pname] || '';
    const changes = Number(R.preVoteChanges[pname] || 0);
    if (current === target.name) {
      broadcastPreVoteUpdate();
      return;
    }
    if (current && changes >= 1) {
      sendTo(pname, { type:'error', msg:'仮投票の票替えは1日1回までです。' });
      return;
    }
    if (current) R.preVoteChanges[pname] = changes + 1;
    R.preVotes[pname] = target.name;
    pushP2PEvent('pre_vote', `${pname} -> ${target.name}`);
    broadcastPreVoteUpdate();
  }

  // ── 投票 ─────────────────────────────────────────────
  function startVote() {
    R.phase='vote'; R.votes={}; R.voteReasons={}; R.humanVotedSet=new Set(); R.autoVotes=new Set(); R.tallyDone=false; R.brainwashApplied=false; R.brainwashDetail=null;
    if (R._discFallback) { clearTimeout(R._discFallback); R._discFallback = null; } // 議論フォールバックを停止
    const al=alive();
    al.filter(p=>!p.isCpu && p.disconnected).forEach(p=>autoVoteForDisconnected(p.name));
    broadcast({type:'vote_start',alive:al.map(p=>({name:p.name,isCpu:!!p.isCpu,avatarIndex:p.avatarIndex,avatarLabel:p.avatarLabel,disconnected:!!p.disconnected,disconnectedAt:p.disconnectedAt||null})),pre_votes:R.preVotes || {},pre_vote_changes:R.preVoteChanges || {}});
    if (Object.keys(R.votes||{}).length) broadcast({type:'vote_progress',done:Object.keys(R.votes).length,total:al.length});
    const cpus=al.filter(p=>p.isCpu);
    cpus.forEach((cpu,i)=>later(900+i*600,()=>{
      const tgt=BRAIN.vote(R, cpu);
      if (tgt) {
        const applied = applyP2PBrainwashVote(cpu.name, tgt.name);
        R.votes[cpu.name]=applied.target;
        R.voteReasons[cpu.name]=BRAIN.voteReason(R, cpu, tgt);
      }
      const currentAlive = alive();
      broadcast({type:'vote_progress',done:Object.keys(R.votes).length,total:currentAlive.length});
      maybeTallyVotesP2P(400);
    }));
    if (!cpus.length) maybeTallyVotesP2P(500);
  }

  function handleVote(pname, target, reason='') {
    const voter = byName(pname);
    const validTarget = alive().some(p=>p.name===target && p.name!==pname);
    const alreadyFinal = R.humanVotedSet && R.humanVotedSet.has(pname) && !(R.autoVotes && R.autoVotes.has(pname));
    if (R.phase !== 'vote' || !voter || !voter.alive) {
      pushP2PEvent('vote_invalid', `${pname} / phase:${R.phase || '-'}`);
      sendResyncTo(pname);
      return;
    }
    if (!validTarget) {
      pushP2PEvent('vote_invalid', `${pname} -> ${target || '-'}`);
      sendTo(pname,{type:'error',msg:'投票先が現在の生存者と合いません。最新状態に再同期します。'});
      sendResyncTo(pname);
      return;
    }
    if (alreadyFinal) {
      sendTo(pname,{type:'vote_ack'});
      pushP2PEvent('vote_ack', `${pname} duplicate`);
      return;
    }
    const applied = applyP2PBrainwashVote(pname, target);
    R.votes[pname]=applied.target;
    R.voteReasons[pname]=(reason || '').trim() || `${target}さんへの疑いを確認する投票です。`;
    R.humanVotedSet.add(pname);
    if (R.autoVotes) R.autoVotes.delete(pname);
    sendTo(pname,{type:'vote_ack'});
    if (applied.forced) sendTo(pname,{type:'brainwashed_notice',forced_target:applied.target});
    pushP2PEvent('vote_ack', pname);
    const al=alive();
    broadcast({type:'vote_progress',done:Object.keys(R.votes).length,total:al.length});
    maybeTallyVotesP2P(500);
  }

  function cpuVoteTarget(cpu) {
    const al=alive(), others=al.filter(p=>p.name!==cpu.name);
    if (!others.length) return null;
    if (isWolfSideRole(cpu.role)) {
      const vill=others.filter(p=>p.role!=='WEREWOLF');
      return vill.length?(topAcc(vill)||rand(vill)):rand(others);
    }
    const wolves=others.filter(p=>p.role==='WEREWOLF');
    if (wolves.length&&Math.random()<0.5) return topAcc(wolves)||rand(wolves);
    return topAcc(others)||rand(others);
  }

  function tallyVotes() {
    if (R.tallyDone) return; R.tallyDone=true;
    const tally={};
    Object.values(R.votes).forEach(t=>tally[t]=(tally[t]||0)+1);
    let executed;
    if (Object.keys(tally).length) {
      const maxV=Math.max(...Object.values(tally));
      const top=Object.keys(tally).filter(n=>tally[n]===maxV);
      executed=top[Math.floor(Math.random()*top.length)];
    } else {
      const fallback = alive();
      if (!fallback.length) return;
      executed=rand(fallback).name;
      tally[executed]=0;
    }
    const execP=byName(executed);
    if (execP) execP.alive=false;
    R.log.push(`第${R.day}日:${executed}が処刑された`);
    // 霊媒師用に処刑情報を保存
    R.lastExecuted=executed; R.lastExecutedRole=execP?.role;
    if (!R.voteHistory) R.voteHistory = [];
    R.voteHistory.push({day:R.day, votes:{...R.votes}, preVotes:{...R.preVotes}, tally:{...tally}, executed});
    if (R.brainwashDetail) R.brainwashHistory.push({...R.brainwashDetail, tally:{...tally}, executed});
    // 猫又ルール: 処刑時にランダムな生存者を道連れ
    let nekomataVictim=null;
    if (execP?.role==='NEKOMATA') {
      const bystanders=alive();
      if(bystanders.length){nekomataVictim=rand(bystanders);nekomataVictim.alive=false;R.log.push(`第${R.day}日:猫又道連れで${nekomataVictim.name}も倒れた`);}
    }
    const win=checkWinP2P();
    R.phase = win ? 'game_over' : 'vote_result';
    R.winner = win || null;
    R.lastVoteResult = {
      executed,
      role:execP?.role,
      tally:{...tally},
      nekomataVictim:nekomataVictim?.name,
      voteReasons:{...R.voteReasons},
      votes:{...R.votes},
      preVotes:{...R.preVotes},
      brainwashCount:R.brainwashApplied ? 1 : 0,
      brainwashHistory:win ? R.brainwashHistory : null,
    };
    broadcast({
      type:'vote_result', executed, executed_role:execP?.role, tally,
      nekomata_victim:nekomataVictim?.name,
      vote_reasons:R.voteReasons,
      votes:R.votes,
      pre_votes:R.preVotes,
      brainwash_count:R.brainwashApplied ? 1 : 0,
      brainwash_history:win ? R.brainwashHistory : null,
      winner:win,
      players:win?R.players.map(p=>({name:p.name,role:p.role,alive:p.alive,disconnected:!!p.disconnected,disconnectedAt:p.disconnectedAt||null,isCpu:!!p.isCpu,avatarIndex:p.avatarIndex,avatarLabel:p.avatarLabel})):null,
      log:win?R.log:null,
    });
    // 霊媒師（生存人間）に個別通知
    const mediums=alive().filter(p=>!p.isCpu&&p.role==='MEDIUM');
    mediums.forEach(m=>sendTo(m.name,{type:'medium_reveal',target:executed,role:execP?.role}));
  }

  function checkWinP2P() {
    const al=alive();
    const w=al.filter(p=>p.role==='WEREWOLF').length;
    const v=al.length-w;
    if (!w) return 'village';
    if (w>=v) return 'wolf';
    return null;
  }

  function doGameOver(winner, victim) {
    R.phase = 'game_over';
    R.winner = winner;
    broadcast({
      type:'game_over', winner,
      players:R.players.map(p=>({name:p.name,role:p.role,alive:p.alive,disconnected:!!p.disconnected,disconnectedAt:p.disconnectedAt||null,isCpu:!!p.isCpu,avatarIndex:p.avatarIndex,avatarLabel:p.avatarLabel})),
      log:R.log,
      night_report:R.nightReport||null,
      eliminated:victim?{name:victim.name,role:victim.role}:null,
    });
  }

  function cpuTpl(cpu) {
    const al=alive(), others=al.filter(p=>p.name!==cpu.name);
    const wasAcc=(R.accuCount[cpu.name]||0)>0;
    const pers = cpu.personality || 'balanced';

    // ── 人狼・狂人 ──
    if (isWolfSideRole(cpu.role)) {
      if (wasAcc) return rand(TPL.defend);
      const vill=others.filter(p=>p.role!=='WEREWOLF');
      if (pers==='wolf_smart') {
        if (Math.random()<0.12) return rand(TPL.defend);
        if (vill.length&&Math.random()<0.78) {
          const t=topAcc(vill)||rand(vill);
          R.accuCount[t.name]=(R.accuCount[t.name]||0)+1;
          return tplFill(rand(TPL.accuse),t.name);
        }
        return rand(TPL.neutral);
      }
      const acProb = pers==='aggressive' ? 0.82 : 0.65;
      if (vill.length&&Math.random()<acProb) {
        const t=topAcc(vill)||rand(vill);
        R.accuCount[t.name]=(R.accuCount[t.name]||0)+1;
        return tplFill(rand(TPL.accuse),t.name);
      }
      return rand(TPL.neutral);
    }

    // ── 占い師 ──
    if (cpu.role==='SEER') {
      const known=Object.entries(R.seerKnown);
      const revProb = pers==='quick_co' ? 0.88 : pers==='secretive' ? 0.20 : 0.55;
      if (known.length&&Math.random()<revProb) {
        const [nm,iw]=rand(known);
        if(iw) R.accuCount[nm]=(R.accuCount[nm]||0)+2;
        return tplFill(rand(iw?TPL.seer_wolf:TPL.seer_safe),nm);
      }
      if (pers==='quick_co' && R.discRound===1 && Math.random()<0.65)
        return rand(['占い師としてCOします 🔮','私が占い師です。情報を集めています 🔮','占い師として名乗り出ます 🔮']);
    }

    // ── 騎士 ──
    if (cpu.role==='DOCTOR') {
      const coProb = pers==='quick_co' ? 0.50 : pers==='secretive' ? 0.04 : 0.12;
      if (Math.random()<coProb)
        return rand(['騎士としてCOします 💊','私は騎士です。誰かを守っています 💊','騎士COします。護衛中です 💊']);
    }

    if (wasAcc) return rand(TPL.defend);
    const accuseProb = pers==='aggressive' ? 0.70 : pers==='secretive' ? 0.10 : pers==='quick_co' ? 0.35 : 0.38;
    if (others.length&&Math.random()<accuseProb) {
      const t=topAcc(others)||rand(others);
      R.accuCount[t.name]=(R.accuCount[t.name]||0)+1;
      return tplFill(rand(TPL.accuse),t.name);
    }
    if (pers==='secretive') return rand(TPL.neutral);
    if (pers==='aggressive') return rand(TPL.pressure);
    return rand([...TPL.neutral,...TPL.question].slice(0,14));
  }

  // ── 外部公開 ─────────────────────────────────────────
  function guestPayload(msg) {
    if (!msg || typeof msg !== 'object') return msg;
    return {
      ...msg,
      phase: msg.phase || O.phase || '',
      seen_seq: msg.seen_seq ?? O.p2pSyncSeq ?? 0,
    };
  }
  function markGuestSendClosed(reason='send_failed') {
    if (isHost) return;
    O.p2pConnClosedAt = Date.now();
    O.p2pAutoResyncReason = reason;
    pushP2PEvent(reason, 'send closed');
    try { render(); } catch(e) {}
  }
  function trackGuestActionSend(msg) {
    if (isHost || !msg || !msg.type) return;
    const detail = msg.target || msg.action || msg.reason || '';
    if (msg.type === 'vote') pushP2PEvent('vote_sent', detail);
    else if (msg.type === 'night_action') pushP2PEvent('night_action_sent', detail);
    else if (msg.type === 'wolf_chat_done') pushP2PEvent('wolf_ready_sent', '');
    else if (msg.type === 'vote_ready') pushP2PEvent('vote_ready_sent', '');
    else if (msg.type === 'resync_request') pushP2PEvent('resync_request', msg.reason || '');
  }
  function wsSendP2P(msg) {
    if (isHost) { handleGuestMsg('__host__', msg); return true; }
    if (guestConn&&guestConn.open) {
      try {
        guestConn.send(JSON.stringify(guestPayload(msg)));
        trackGuestActionSend(msg);
        return true;
      } catch(e) {
        markGuestSendClosed('send_failed');
        return false;
      }
    }
    markGuestSendClosed('connection_closed');
    return false;
  }

  function requestResync() {
    if (isHost) { resyncAll(); return true; }
    if (guestConn&&guestConn.open) {
      try {
        guestConn.send(JSON.stringify(guestPayload({type:'resync_request'})));
        return true;
      } catch(e) {
        markGuestSendClosed('resync_send_failed');
        return false;
      }
    }
    markGuestSendClosed('connection_closed');
    handleServer({type:'error', msg:'P2P接続がまだ開いていません'});
    return false;
  }

  function reconnect() {
    if (isHost) return false;
    const name = (O.playerName || '').trim();
    const code = normalizeRoomCode(O.roomCode || O.pendingP2PCode || '');
    if (!name || !code) {
      handleServer({type:'error', msg:'再接続に必要な名前または部屋コードが見つかりません'});
      return false;
    }
    clearP2PConnectionWarning(false);
    O.p2pAutoResyncReason = 'reconnecting';
    pushP2PEvent('reconnecting', code);
    joinRoom(name, code,
      () => { clearP2PConnectionWarning(true); O.p2pAutoResyncReason = 'reconnected'; pushP2PEvent('reconnected', code); render(); },
      err => { O.p2pConnClosedAt = Date.now(); pushP2PEvent('connection_closed', 'reconnect failed'); handleServer({type:'error', msg:'再接続できませんでした: ' + (err?.message || err)}); }
    );
    return true;
  }

  function diagnostics() {
    const list = R.players || R.pendingPlayers || [];
    const now = Date.now();
    const connectedNames = isHost ? Object.keys(hostConns).map(id=>connNames[id]).filter(Boolean) : [];
    const peerAges = connectedNames.map(name => {
      const state = R.peerLastSeen?.[name] || {};
      const seen = state.at || 0;
      const lag = Number.isFinite(Number(state.seenSeq)) && R.syncSeq ? Math.max(0, R.syncSeq - Number(state.seenSeq)) : null;
      return { name, age:seen ? Math.max(0, Math.round((now - seen) / 1000)) : null, seenSeq:state.seenSeq ?? null, lag };
    });
    const staleLimitSec = Math.round(P2P_STALE_MS / 1000);
    const peerHealthy = peerAges.filter(p => p.age !== null && p.age <= staleLimitSec);
    const peerStale = peerAges.filter(p => p.age === null || p.age > staleLimitSec);
    const peerLagging = peerAges.filter(p => p.lag !== null && p.lag >= 4);
    const aliveList = (R.players && typeof alive === 'function') ? alive() : [];
    const humanAlive = aliveList.filter(p=>!p.isCpu);
    const actionProgress = {};
    if (R.phase === 'vote') {
      const votedNames = Object.keys(R.votes || {});
      const aliveNames = aliveList.map(p=>p.name);
      actionProgress.vote = {
        total:aliveNames.length,
        doneNames:votedNames.filter(n=>aliveNames.includes(n)),
        pendingNames:aliveNames.filter(n=>!votedNames.includes(n)),
        autoNames:Array.from(R.autoVotes || []),
      };
    }
    if (R.phase === 'night') {
      const doneMap = R.humanActionDone || {};
      const names = humanAlive.map(p=>p.name);
      actionProgress.night = {
        total:names.length,
        doneNames:names.filter(n=>doneMap[n]),
        pendingNames:names.filter(n=>!doneMap[n]),
      };
    }
    if (R.phase === 'wolf_chat') {
      const wolfNames = aliveList.filter(p=>p.role==='WEREWOLF' && !p.isCpu).map(p=>p.name);
      const readySet = R.wolfDoneSet || new Set();
      actionProgress.wolfChat = {
        total:wolfNames.length,
        readyNames:wolfNames.filter(n=>readySet.has(n)),
        pendingNames:wolfNames.filter(n=>!readySet.has(n)),
      };
    }
    if (R.phase === 'discuss') {
      const humans = typeof p2pAliveHumans === 'function' ? p2pAliveHumans() : humanAlive.filter(p=>!p.disconnected);
      const readySet = R.voteReadySet || new Set();
      const names = humans.map(p=>p.name);
      actionProgress.discuss = {
        total:names.length,
        readyNames:names.filter(n=>readySet.has(n)),
        pendingNames:names.filter(n=>!readySet.has(n)),
      };
    }
    return {
      isHost,
      connCount:isHost ? Object.keys(hostConns).length : (guestConn&&guestConn.open ? 1 : 0),
      playerCount:list.length,
      aliveCount:R.players ? R.players.filter(p=>p.alive).length : 0,
      disconnectedCount:R.players ? R.players.filter(p=>p.disconnected).length : 0,
      hostPhase:R.phase || '',
      roomCode:R.roomCode || '',
      peerHealthyCount:peerHealthy.length,
      peerStaleCount:peerStale.length,
      peerStaleNames:peerStale.map(p=>p.name),
      peerLagCount:peerLagging.length,
      peerLagNames:peerLagging.map(p=>p.name),
      peerAges,
      actionProgress,
    };
  }

  function destroy() {
    joinAttemptId++;
    resetTimers(); // 残留タイマーを停止してから破棄
    if (peer) { try{peer.destroy();}catch(e){} peer=null; }
    hostConns={}; connNames={}; guestConn=null; isHost=false; R={};
  }

  return { createRoom, joinRoom, wsSendP2P, startGame, destroy, resetTimers, requestResync, reconnect, diagnostics };
})();

// ========== ONLINE STATE ==========
// mode は最下部で 'opening' として初期化
let O = {};
let p2pWatchdogTimer = null;
let p2pResumeHooksInstalled = false;
let voteAckWatchdogTimer = null;
let p2pActionAckWatchdogTimer = null;

function clearP2PWatchdog() {
  if (p2pWatchdogTimer) clearTimeout(p2pWatchdogTimer);
  p2pWatchdogTimer = null;
}

function clearVoteAckWatchdog() {
  if (voteAckWatchdogTimer) clearTimeout(voteAckWatchdogTimer);
  voteAckWatchdogTimer = null;
}

function clearP2PActionAckWatchdog() {
  if (p2pActionAckWatchdogTimer) clearTimeout(p2pActionAckWatchdogTimer);
  p2pActionAckWatchdogTimer = null;
}

function clearP2PConnectionWarning(clearAuto=false) {
  O.p2pConnClosedAt = 0;
  if (clearAuto) {
    O.p2pAutoResyncAt = 0;
    O.p2pAutoResyncReason = '';
  }
}

function scheduleP2PActionAckWatchdog(kind) {
  clearP2PActionAckWatchdog();
  if (mode !== 'p2p' || O.isHost || !kind) return;
  const phaseAtSend = O.phase || '';
  p2pActionAckWatchdogTimer = setTimeout(() => {
    p2pActionAckWatchdogTimer = null;
    if (mode !== 'p2p' || O.isHost || O.phase !== phaseAtSend) return;
    const stillPending =
      (kind === 'wolf_ready' && O.wolfChatReadyPending && !O.wolfChatReady) ||
      (kind === 'night_action' && O.nightActionPending && !O.nightActionDone) ||
      (kind === 'vote_ready' && O.voteReadyPending && !O.voteReadyNames.includes(O.playerName));
    if (!stillPending) return;
    const reason = `${kind}_ack_timeout`;
    pushP2PEvent(reason, phaseAtSend);
    p2pAutoResync(reason);
    render();
  }, 9000);
}

function p2pAutoResync(reason='') {
  if (mode !== 'p2p' || O.isHost) return false;
  const now = Date.now();
  if (now - (O.p2pAutoResyncAt || 0) < 12000) return false;
  O.p2pAutoResyncAt = now;
  O.p2pAutoResyncReason = reason;
  pushP2PEvent(reason || 'auto_resync', 'request');
  try {
    const ok = P2PEngine.wsSendP2P({ type:'resync_request', reason });
    if (!ok) return false;
    return true;
  } catch(e) {
    return false;
  }
}

function scheduleVoteAckWatchdog() {
  clearVoteAckWatchdog();
  if (mode !== 'p2p' || !O.voteSubmitted || O.voteAckAt || O.phase !== 'vote') return;
  voteAckWatchdogTimer = setTimeout(() => {
    voteAckWatchdogTimer = null;
    if (mode !== 'p2p' || O.phase !== 'vote' || !O.voteSubmitted || O.voteAckAt) return;
    O.voteAckWarningAt = Date.now();
    p2pAutoResync('vote_ack_timeout');
    const retryCount = O.voteAckRetryCount || 0;
    const target = O.voteSentTarget || O.voteTarget || '';
    const reason = O.voteSentReason || O.voteReasonDraft || '';
    const canRetry = retryCount < 2 && target && (O.alive || []).some(p => p.name === target && p.name !== O.playerName);
    if (canRetry && wsSend({type:'vote', target, reason, retry:true})) {
      O.voteAckRetryCount = retryCount + 1;
      O.voteAckRetryAt = Date.now();
      scheduleVoteAckWatchdog();
    }
    render();
  }, 9000);
}

function scheduleP2PWatchdog() {
  clearP2PWatchdog();
  if (mode !== 'p2p' || O.isHost || !O.p2pHeartbeatAt) return;
  p2pWatchdogTimer = setTimeout(() => {
    if (mode !== 'p2p' || O.isHost || !O.p2pHeartbeatAt) return;
    const age = Date.now() - O.p2pHeartbeatAt;
    const activePhase = O.phase && !['p2p_setup','setup','lobby','game_over'].includes(O.phase);
    if (activePhase && age > 25000) {
      p2pAutoResync('heartbeat_timeout');
      render();
    }
  }, 26000);
}

function p2pResumeSync(reason='resume_sync') {
  if (mode !== 'p2p' || !O || !O.phase) return false;
  if (['p2p_setup','setup','lobby','game_over'].includes(O.phase)) return false;
  const now = Date.now();
  if (now - (O.p2pResumeSyncAt || 0) < 4000) return false;
  O.p2pResumeSyncAt = now;
  pushP2PEvent(reason || 'resume_sync', 'resume');
  let ok = false;
  if (O.isHost) {
    ok = P2PEngine.requestResync();
    if (ok) O.p2pResyncAt = now;
  } else if (O.p2pConnClosedAt) {
    ok = P2PEngine.reconnect();
  } else {
    ok = p2pAutoResync(reason);
  }
  render();
  return ok;
}

function installP2PResumeHooks() {
  if (p2pResumeHooksInstalled || typeof window === 'undefined') return;
  p2pResumeHooksInstalled = true;
  const resumeSoon = () => setTimeout(() => p2pResumeSync('resume_sync'), 180);
  try {
    document.addEventListener('visibilitychange', () => {
      if (!document.visibilityState || document.visibilityState === 'visible') resumeSoon();
    });
  } catch(e) {}
  try { window.addEventListener('focus', resumeSoon); } catch(e) {}
  try { window.addEventListener('pageshow', resumeSoon); } catch(e) {}
}

  O = {
